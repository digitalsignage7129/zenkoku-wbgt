<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3日間天気予報（視認性特化）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "Arial Black", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    body {
      padding: 1vh 1vw;
    }

    /* 3日間コンテナ（画面全体を3等分） */
    .forecast-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1vw;
      width: 100%;
      height: 98vh;
    }

    /* 各日付カード */
    .card {
      background-color: #050505;
      border: 3px solid #444444;
      border-radius: 12px;
      padding: 1.5vh 0.8vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* 本日カードの強調 */
    .card.today {
      border: 4px solid #00e5ff;
      background-color: #00121d;
    }

    /* 1. 日付・区分エリア */
    .date-box {
      width: 100%;
      border-bottom: 2px solid #333333;
      padding-bottom: 1vh;
    }
    .date-label {
      font-size: 3.2vh;
      font-weight: 900;
      color: #00e5ff;
      letter-spacing: 2px;
    }
    .tomorrow .date-label { color: #aaaaaa; }
    .day-after .date-label { color: #777777; }

    .date-val {
      font-size: 4.8vh;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin-top: 0.2vh;
    }

    /* 2. 天気アイコン ＆ テキスト */
    .weather-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0.5vh 0;
    }
    .weather-icon {
      font-size: 13vh; /* アイコンを超巨大化 */
      line-height: 1;
    }
    .weather-text {
      font-size: 4.8vh;
      font-weight: 900;
      color: #ffffff;
      margin-top: 0.5vh;
    }

    /* 3. 降水確率 */
    .pop-box {
      width: 100%;
      background-color: #002233;
      border: 2px solid #0088cc;
      border-radius: 8px;
      padding: 1vh 0;
    }
    .pop-val {
      font-size: 5vh;
      font-weight: 900;
      color: #00ffff;
      line-height: 1;
    }

    /* 4. 最高・最低気温 */
    .temp-box {
      width: 100%;
      background-color: #111111;
      border: 2px solid #222222;
      border-radius: 8px;
      padding: 1vh 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .temp-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .temp-title {
      font-size: 2.2vh;
      font-weight: bold;
      color: #888888;
    }
    .temp-val-high {
      font-size: 5.5vh;
      font-weight: 900;
      color: #ff3333;
      line-height: 1;
    }
    .temp-val-low {
      font-size: 5.5vh;
      font-weight: 900;
      color: #3399ff;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="forecast-container">

    <!-- 本日 -->
    <div class="card today">
      <div class="date-box">
        <div class="date-label">【 本日 】</div>
        <div class="date-val">7/29 (水)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon">☀️</div>
        <div class="weather-text">晴れ</div>
      </div>
      <div class="pop-box">
        <div class="pop-val">☔ 10%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high">33℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low">25℃</span>
        </div>
      </div>
    </div>

    <!-- 明日 -->
    <div class="card tomorrow">
      <div class="date-box">
        <div class="date-label">明日</div>
        <div class="date-val">7/30 (木)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon">⛅</div>
        <div class="weather-text">晴/曇</div>
      </div>
      <div class="pop-box">
        <div class="pop-val">☔ 30%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high">31℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low">24℃</span>
        </div>
      </div>
    </div>

    <!-- 明後日 -->
    <div class="card day-after">
      <div class="date-box">
        <div class="date-label">明後日</div>
        <div class="date-val">7/31 (金)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon">🌧️</div>
        <div class="weather-text">一時雨</div>
      </div>
      <div class="pop-box">
        <div class="pop-val">☔ 70%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high">28℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low">22℃</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
