<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>現場用 WBGT・気象情報表示器 (690x730 スケール版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 外枠：表示したい枠のサイズ (690px × 730px) */
    html, body {
      width: 690px;
      height: 730px;
      overflow: hidden; /* 見切れ・スクロールバーを防止 */
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    /* 
      【縮小コンテナ】
      1000px × 1058px の広いキャンバスで完璧なレイアウトを作り、
      それを 690px × 730px に自動でフィット（約0.69倍）させます。
    */
    .scaled-wrapper {
      width: 1000px;
      height: 1058px;
      transform-origin: 0 0;
      transform: scale(calc(690 / 1000), calc(730 / 1058));
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ヘッダーエリア */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #cbd5e1;
      padding-bottom: 16px;
    }

    .location-title {
      font-size: 38px;
      font-weight: 800;
      color: #1e293b;
      white-space: nowrap;
    }

    .update-time {
      font-size: 26px;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }

    /* メイン表示: WBGT & 警戒度 */
    .main-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 580px;
    }

    .wbgt-box {
      background: #ffffff;
      border: 4px solid #cbd5e1;
      border-radius: 28px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
    }

    .wbgt-label {
      font-size: 30px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 20px;
    }

    .wbgt-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .wbgt-value {
      font-size: 135px;
      font-weight: 900;
      line-height: 1;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .wbgt-unit {
      font-size: 42px;
      font-weight: 800;
      color: #475569;
    }

    /* 警戒度バナー */
    .level-banner {
      border-radius: 28px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }

    .level-sub {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
      opacity: 0.95;
      letter-spacing: 0.05em;
    }

    .level-text {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      letter-spacing: 0.05em;
    }

    /* サブ気象情報 4列カード */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      height: 260px;
    }

    .metric-card {
      background: #ffffff;
      border: 4px solid #cbd5e1;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
    }

    .metric-label {
      font-size: 24px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 12px;
    }

    .metric-value {
      font-size: 48px;
      font-weight: 900;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .metric-unit {
      font-size: 24px;
      font-weight: 800;
      color: #64748b;
      margin-left: 4px;
    }

    /* 警戒度別カラー定義 */
    .bg-danger  { background-color: #dc2626; color: #ffffff; }  /* 危険: 赤 */
    .bg-severe  { background-color: #ea580c; color: #ffffff; }  /* 厳重警戒: オレンジ */
    .bg-warning { background-color: #facc15; color: #0f172a; }  /* 警戒: 黄 */
    .bg-caution { background-color: #2563eb; color: #ffffff; }  /* 留意: 青 */
    .bg-safe    { background-color: #16a34a; color: #ffffff; }  /* ほぼ安全: 緑 */
  </style>
</head>
<body>

  <!-- 全体をスケールするラッパー -->
  <div class="scaled-wrapper">
    
    <!-- ヘッダー -->
    <div class="header">
      <div class="location-title" id="location">---</div>
      <div class="update-time">更新: <span id="updated-at">--:--</span></div>
    </div>

    <!-- メイン表示: WBGT & 警戒度 -->
    <div class="main-section">
      <div class="wbgt-box">
        <div class="wbgt-label">暑さ指数 (WBGT)</div>
        <div class="wbgt-value-wrap">
          <span class="wbgt-value" id="wbgt">--.-</span>
          <span class="wbgt-unit">℃</span>
        </div>
      </div>

      <div class="level-banner" id="level-banner">
        <div class="level-sub">熱中症警戒レベル</div>
        <div class="level-text" id="level">--</div>
      </div>
    </div>

    <!-- 4項目気象データ -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">気温</div>
        <div class="metric-value"><span id="temp">--.-</span><span class="metric-unit">℃</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-label">湿度</div>
        <div class="metric-value"><span id="humidity">--</span><span class="metric-unit">%</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-label">風速</div>
        <div class="metric-value"><span id="wind">--.-</span><span class="metric-unit">m/s</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-label">天気</div>
        <div class="metric-value" style="font-size: 40px;" id="weather">--</div>
      </div>
    </div>

  </div>

  <script>
    async function updateData() {
      try {
        const response = await fetch('./chiba_wbgt.json?t=' + new Date().getTime());
        if (!response.ok) return;

        const data = await response.json();

        // テキスト更新
        document.getElementById('location').textContent = data.location;
        document.getElementById('wbgt').textContent = data.wbgt;
        document.getElementById('temp').textContent = data.temperature;
        document.getElementById('humidity').textContent = data.humidity;
        document.getElementById('wind').textContent = data.wind_speed;
        document.getElementById('weather').textContent = data.weather || '晴れ';
        document.getElementById('updated-at').textContent = data.updated_at;

        // 警戒度バナーの文字と背景色更新
        const banner = document.getElementById('level-banner');
        const levelText = document.getElementById('level');
        const level = data.level;

        levelText.textContent = level;
        banner.className = 'level-banner'; // リセット

        if (level === '危険') {
          banner.classList.add('bg-danger');
        } else if (level === '厳重警戒') {
          banner.classList.add('bg-severe');
        } else if (level === '警戒') {
          banner.classList.add('bg-warning');
        } else if (level === '留意') {
          banner.classList.add('bg-caution');
        } else {
          banner.classList.add('bg-safe');
        }

      } catch (error) {
        console.error('Data fetch error:', error);
      }
    }

    // 初回実行 ＋ 60秒ごと自動更新
    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
