<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=690, height=730, initial-scale=1.0">
  <title>現場用 WBGT・気象情報表示器 (690x730)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 690px;
      height: 730px;
      overflow: hidden; /* スクロール枠を消して画面ぴったりに固定 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* ヘッダーエリア (高さ 約48px) */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #cbd5e1;
      padding-bottom: 10px;
      height: 48px;
    }

    .location-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 430px;
    }

    .update-time {
      font-size: 1.1rem;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }

    /* メインセクション: WBGT & 警戒度 (高さ 390px) */
    .main-section {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      height: 390px;
    }

    .wbgt-box {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 20px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .wbgt-label {
      font-size: 1.4rem;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
    }

    .wbgt-value-wrap {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 4px;
    }

    .wbgt-value {
      font-size: 6.5rem;
      font-weight: 900;
      line-height: 1;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .wbgt-unit {
      font-size: 2.2rem;
      font-weight: 800;
      color: #475569;
    }

    /* 警戒度バナー */
    .level-banner {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      padding: 20px 12px;
      text-align: center;
      box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.1);
      transition: all 0.5s ease;
    }

    .level-sub {
      font-size: 1.3rem;
      font-weight: 800;
      opacity: 0.95;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    .level-text {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.15;
      word-break: keep-all;
    }

    /* サブ気象情報 4列カード (高さ 180px) */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      height: 180px;
    }

    .metric-card {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      padding: 12px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .metric-label {
      font-size: 1.1rem;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 2.4rem;
      font-weight: 900;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .metric-unit {
      font-size: 1.1rem;
      font-weight: 800;
      color: #64748b;
      margin-left: 2px;
    }

    /* 警戒度別カラー定義 */
    .bg-danger  { background-color: #dc2626; color: #ffffff; }  /* 危険: 赤 */
    .bg-severe  { background-color: #ea580c; color: #ffffff; }  /* 厳重警戒: オレンジ */
    .bg-warning { background-color: #facc15; color: #0f172a; }  /* 警戒: 黄 */
    .bg-caution { background-color: #2563eb; color: #ffffff; }  /* 留意: 青 */
    .bg-safe    { background-color: #16a34a; color: #ffffff; }  /* ほぼ安全: 緑 */
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="location-title" id="location">---</div>
    <div class="update-time">更新: <span id="updated-at">--:--</span></div>
  </div>

  <!-- メイン表示: WBGT & 警戒度 -->
  <div class="main-section">
    <div class="wbgt-box">
      <div class="wbgt-label">暑さ指数 (WBGT)</div>
      <div class="wbgt-value-wrap">
        <span class="wbgt-value" id="wbgt">--.-</span>
        <span class="wbgt-unit">℃</span>
      </div>
    </div>

    <div class="level-banner" id="level-banner">
      <div class="level-sub">熱中症警戒レベル</div>
      <div class="level-text" id="level">--</div>
    </div>
  </div>

  <!-- 4項目気象データ -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">気温</div>
      <div class="metric-value"><span id="temp">--.-</span><span class="metric-unit">℃</span></div>
    </div>

    <div class="metric-card">
      <div class="metric-label">湿度</div>
      <div class="metric-value"><span id="humidity">--</span><span class="metric-unit">%</span></div>
    </div>

    <div class="metric-card">
      <div class="metric-label">風速</div>
      <div class="metric-value"><span id="wind">--.-</span><span class="metric-unit">m/s</span></div>
    </div>

    <div class="metric-card">
      <div class="metric-label">天気</div>
      <div class="metric-value" style="font-size: 2.1rem;" id="weather">--</div>
    </div>
  </div>

  <script>
    async function updateData() {
      try {
        const response = await fetch('./chiba_wbgt.json?t=' + new Date().getTime());
        if (!response.ok) return;

        const data = await response.json();

        // テキスト更新
        document.getElementById('location').textContent = data.location;
        document.getElementById('wbgt').textContent = data.wbgt;
        document.getElementById('temp').textContent = data.temperature;
        document.getElementById('humidity').textContent = data.humidity;
        document.getElementById('wind').textContent = data.wind_speed;
        document.getElementById('weather').textContent = data.weather || '晴れ';
        document.getElementById('updated-at').textContent = data.updated_at;

        // 警戒度バナーの文字と背景色更新
        const banner = document.getElementById('level-banner');
        const levelText = document.getElementById('level');
        const level = data.level;

        levelText.textContent = level;
        banner.className = 'level-banner'; // リセット

        if (level === '危険') {
          banner.classList.add('bg-danger');
        } else if (level === '厳重警戒') {
          banner.classList.add('bg-severe');
        } else if (level === '警戒') {
          banner.classList.add('bg-warning');
        } else if (level === '留意') {
          banner.classList.add('bg-caution');
        } else {
          banner.classList.add('bg-safe');
        }

      } catch (error) {
        console.error('Data fetch error:', error);
      }
    }

    // 初回実行 ＋ 60秒ごと自動更新
    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
