<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暑さ指数（WBGT）表示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    /* 地点名 */
    .location-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 12px;
    }

    /* 警戒度バナー */
    .level-badge {
      display: inline-block;
      padding: 8px 24px;
      font-size: 1.8rem;
      font-weight: 800;
      border-radius: 50px;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }

    /* WBGT数値 */
    .wbgt-title {
      font-size: 1.2rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .wbgt-value-container {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 24px;
    }

    .wbgt-value {
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .wbgt-unit {
      font-size: 2rem;
      font-weight: 700;
      color: #64748b;
    }

    /* フッター（更新日時） */
    .footer {
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    /* 警戒度別の背景色と文字色 */
    .bg-danger { background-color: #dc2626; color: #ffffff; }       /* 危険: 赤 */
    .bg-severe { background-color: #ea580c; color: #ffffff; }       /* 厳重警戒: オレンジ */
    .bg-warning { background-color: #facc15; color: #1e293b; }      /* 警戒: 黄 */
    .bg-caution { background-color: #3b82f6; color: #ffffff; }      /* 留意: 青 */
    .bg-safe { background-color: #10b981; color: #ffffff; }         /* ほぼ安全: 緑 */
  </style>
</head>
<body>

  <div class="card">
    <div class="location-name" id="location">--</div>
    <div class="level-badge" id="level-badge">--</div>

    <div class="wbgt-title">暑さ指数 (WBGT)</div>
    <div class="wbgt-value-container">
      <span class="wbgt-value" id="wbgt">--.-</span>
      <span class="wbgt-unit">℃</span>
    </div>

    <div class="footer">
      最終更新: <span id="updated-at">----/--/-- --:--</span>
    </div>
  </div>

  <script>
    async function updateData() {
      try {
        const response = await fetch('./chiba_wbgt.json?t=' + new Date().getTime());
        if (!response.ok) return;

        const data = await response.json();

        // データの反映
        document.getElementById('location').textContent = data.location;
        document.getElementById('wbgt').textContent = data.wbgt;
        document.getElementById('updated-at').textContent = data.updated_at;

        // 警戒度バナーの文字と色の更新
        const badge = document.getElementById('level-badge');
        badge.textContent = data.level;
        badge.className = 'level-badge';

        const level = data.level;
        if (level === '危険') {
          badge.classList.add('bg-danger');
        } else if (level === '厳重警戒') {
          badge.classList.add('bg-severe');
        } else if (level === '警戒') {
          badge.classList.add('bg-warning');
        } else if (level === '留意') {
          badge.classList.add('bg-caution');
        } else {
          badge.classList.add('bg-safe');
        }

      } catch (error) {
        console.error('Data fetch error:', error);
      }
    }

    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
