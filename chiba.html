<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>現場用 WBGT・気象情報表示器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 配信システムの枠いっぱいに広げる */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* スクロールバー・見切れ防止 */
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 
      【基準キャンバス (690px × 730px)】
      JSがこのブロック全体を計測されたエリア枠に合わせて動的に自動スケーリングします。
    */
    #stage {
      width: 690px;
      height: 730px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform-origin: center center; /* 中央基準で拡大縮小 */
      flex-shrink: 0;
    }

    /* 1. ヘッダーエリア (高さ 40px) */
    .header {
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #cbd5e1;
      padding-bottom: 8px;
    }

    .location-title {
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 440px;
    }

    .update-time {
      font-size: 16px;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }

    /* 2. メイン表示: WBGT & 警戒度 (高さ 410px) */
    .main-section {
      height: 410px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .wbgt-box {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
    }

    .wbgt-label {
      font-size: 22px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 16px;
    }

    .wbgt-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .wbgt-value {
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .wbgt-unit {
      font-size: 32px;
      font-weight: 800;
      color: #475569;
    }

    /* 警戒度バナー */
    .level-banner {
      border-radius: 20px;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .level-sub {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      opacity: 0.95;
      letter-spacing: 0.05em;
    }

    .level-text {
      font-size: 48px; /* 「厳重警戒」が1行に綺麗に収まる設計 */
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      letter-spacing: 0.05em;
    }

    /* 3. サブ気象情報 4列カード (高さ 190px) */
    .metrics-grid {
      height: 190px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .metric-card {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
    }

    .metric-label {
      font-size: 16px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 900;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .metric-unit {
      font-size: 14px;
      font-weight: 800;
      color: #64748b;
      margin-left: 2px;
    }

    /* 警戒度別カラー定義 */
    .bg-danger  { background-color: #dc2626; color: #ffffff; }  /* 危険: 赤 */
    .bg-severe  { background-color: #ea580c; color: #ffffff; }  /* 厳重警戒: オレンジ */
    .bg-warning { background-color: #facc15; color: #0f172a; }  /* 警戒: 黄 */
    .bg-caution { background-color: #2563eb; color: #ffffff; }  /* 留意: 青 */
    .bg-safe    { background-color: #16a34a; color: #ffffff; }  /* ほぼ安全: 緑 */
  </style>
</head>
<body>

  <!-- STB側サイズに合わせて自動伸縮する690x730基準ステージ -->
  <div id="stage">
    
    <!-- ヘッダー -->
    <div class="header">
      <div class="location-title" id="location">---</div>
      <div class="update-time">更新: <span id="updated-at">--:--</span></div>
    </div>

    <!-- メイン表示: WBGT & 警戒度 -->
    <div class="main-section">
      <div class="wbgt-box">
        <div class="wbgt-label">暑さ指数 (WBGT)</div>
        <div class="wbgt-value-wrap">
          <span class="wbgt-value" id="wbgt">--.-</span>
          <span class="wbgt-unit">℃</span>
        </div>
      </div>

      <div class="level-banner" id="level-banner">
        <div class="level-sub">熱中症警戒レベル</div>
        <div class="level-text" id="level">--</div>
      </div>
    </div>

    <!-- 4項目気象データ -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">気温</div>
        <div class="metric-value"><span id="temp">--.-</span><span class="metric-unit">℃</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-label">湿度</div>
        <div class="metric-value"><span id="humidity">--</span><span class="metric-unit">%</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-label">風速</div>
        <div class="metric-value"><span id="wind">--.-</span><span class="metric-unit">m/s</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-label">天気</div>
        <div class="metric-value" style="font-size: 24px;" id="weather">--</div>
      </div>
    </div>

  </div>

  <script>
    /* STBの実際の枠領域を計測し、690x730キャンバスを完全フィッティングさせる制御 */
    function autoFit() {
      const targetW = 690;
      const targetH = 730;
      
      // STBブラウザが実際に割り当てている画面幅・高さを取得
      const currentW = window.innerWidth;
      const currentH = window.innerHeight;

      if (currentW === 0 || currentH === 0) return;

      // 縦横どちらかが溢れないよう倍率を自動算出
      const scale = Math.min(currentW / targetW, currentH / targetH);
      
      const stage = document.getElementById('stage');
      if (stage) {
        stage.style.transform = `scale(${scale})`;
      }
    }

    // 画面初期化時・リサイズ時にフィット処理を実行
    window.addEventListener('resize', autoFit);
    window.addEventListener('DOMContentLoaded', autoFit);
    window.addEventListener('load', autoFit);
    autoFit();

    /* データ取得 & 表示更新ロジック */
    async function updateData() {
      try {
        const response = await fetch('./chiba_wbgt.json?t=' + new Date().getTime());
        if (!response.ok) return;

        const data = await response.json();

        // テキスト更新
        document.getElementById('location').textContent = data.location;
        document.getElementById('wbgt').textContent = data.wbgt;
        document.getElementById('temp').textContent = data.temperature;
        document.getElementById('humidity').textContent = data.humidity;
        document.getElementById('wind').textContent = data.wind_speed;
        document.getElementById('weather').textContent = data.weather || '晴れ';
        document.getElementById('updated-at').textContent = data.updated_at;

        // 警戒度バナーの文字と背景色更新
        const banner = document.getElementById('level-banner');
        const levelText = document.getElementById('level');
        const level = data.level;

        levelText.textContent = level;
        banner.className = 'level-banner'; // リセット

        if (level === '危険') {
          banner.classList.add('bg-danger');
        } else if (level === '厳重警戒') {
          banner.classList.add('bg-severe');
        } else if (level === '警戒') {
          banner.classList.add('bg-warning');
        } else if (level === '留意') {
          banner.classList.add('bg-caution');
        } else {
          banner.classList.add('bg-safe');
        }

      } catch (error) {
        console.error('Data fetch error:', error);
      }
    }

    // 初回実行 ＋ 60秒ごと自動更新
    updateData();
    setInterval(updateData, 60000);
  </script>
</body>
</html>
