<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WBGTマルチサイネージシステム (気象庁アメダス連動)</title>
<style>
html,body{margin:0;padding:0;width:100vw;height:100vh;background-color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden!important;}
#start-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#1a202c 0%,#2d3748 100%);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9999;color:#fff;}
.start-box{text-align:center;background:rgba(255,255,255,.1);padding:6vh 5vw;border-radius:24px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.3);}
.start-box h2{font-size:4vh;margin:0 0 1vh 0;font-weight:900;}
.start-box p{font-size:2vh;color:#cbd5e0;margin:0 0 4vh 0;}
.start-search-container{display:flex;gap:15px;width:40vw;}
.start-input{flex:1;font-size:2.5vh;padding:2vh 2.5vw;border:none;border-radius:50px;font-weight:bold;outline:none;}
.start-btn{font-size:2.5vh;padding:2vh 4vw;background:#3182ce;color:#fff;border:none;border-radius:50px;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px rgba(49,130,206,.4);}
.widget-box{width:100vw;height:100vh;box-sizing:border-box;padding:1.5vh 3vw;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden!important;background-color:#fff;}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid #edf2f7;height:11vh;}
.header-title-area{display:flex;flex-direction:column;}
.header h1{margin:0;font-size:4vh;color:#2d3748;font-weight:900;line-height:1.1;}
.header .sub{font-size:1.8vh;color:#4a5568;font-weight:bold;}
.search-container{display:flex;align-items:center;gap:8px;}
.search-input{font-size:2.2vh;padding:.8vh 1.5vw;border:3px solid #cbd5e0;border-radius:30px;width:18vw;font-weight:bold;outline:none;color:#2d3748;}
.search-btn{font-size:2.2vh;padding:.8vh 1.8vw;background-color:#3182ce;color:#fff;border:none;border-radius:30px;font-weight:bold;cursor:pointer;}
.weather-icon-txt{font-size:5.5vh;font-weight:900;color:#3182ce;margin-left:15px;}
.wbgt-section{background:#2ecc71;color:#fff;border-radius:24px;text-align:center;height:59vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:2vh 0;box-shadow:0 10px 25px rgba(0,0,0,.1);}
.wbgt-label{font-size:3.5vh;font-weight:bold;letter-spacing:2px;margin:0;line-height:1;}
.wbgt-display-area{display:flex;justify-content:center;align-items:center;width:100%;height:41vh;margin:0;padding:0;}
#wbgt-num{font-weight:900!important;line-height:.9!important;letter-spacing:-6px!important;}
.wbgt-unit{font-size:9vh!important;font-weight:900!important;margin-left:10px;align-self:flex-end;margin-bottom:5vh;}
.wbgt-status{font-size:5vh;font-weight:900;background:rgba(0,0,0,.25);padding:.4vh 8vw;border-radius:50px;display:inline-block;align-self:center;letter-spacing:2px;margin:0;line-height:1.2;}
.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;height:18vh;}
.grid-item{background:#f7fafc;border:4px solid #e2e8f0;border-radius:16px;display:flex;flex-direction:column;justify-content:center;text-align:center;}
.grid-label{font-size:2.5vh;color:#4a5568;font-weight:bold;margin-bottom:2px;}
.grid-value{font-size:4.5vh;font-weight:900;color:#1a202c;line-height:1;}
.footer{font-size:2vh;color:#a0aec0;text-align:center;border-top:3px solid #edf2f7;height:4vh;display:flex;align-items:center;justify-content:center;font-weight:bold;}
</style>
</head>
<body>

<div id="start-screen">
    <div class="start-box">
        <h2>WBGT MONITOR SYSTEM</h2>
        <p>設置する地域、または現場名を入力してください</p>
        <div class="start-search-container">
            <input type="text" id="start-input" class="start-input" placeholder="例：加古川市、舞洲、和歌山...">
            <button onclick="initSearch()" class="start-btn">モニター起動</button>
        </div>
        <div id="start-error" style="color:#fc8181;margin-top:15px;font-weight:bold;"></div>
    </div>
</div>

<div class="widget-box">
    <div class="header">
        <div class="header-title-area">
            <h1 id="location-title">地域情報</h1>
            <div class="sub" id="location-sub">気象庁アメダス観測情報</div>
        </div>
        <div class="search-container">
            <input type="text" id="panel-search-input" class="search-input" placeholder="地域を変更...">
            <button onclick="panelSearch()" class="search-btn">変更</button>
            <div id="weather-text" class="weather-icon-txt">--</div>
        </div>
    </div>
    <div class="wbgt-section" id="wbgt-card">
        <div class="wbgt-label" id="time-label">現在の暑さ指数 (WBGT)</div>
        <div class="wbgt-display-area"><span id="wbgt-num">--.-</span><span class="wbgt-unit">℃</span></div>
        <div class="wbgt-status" id="wbgt-status">取得中...</div>
    </div>
    <div class="weather-grid">
        <div class="grid-item"><div class="grid-label">気温</div><div class="grid-value" id="cur-temp">--.-℃</div></div>
        <div class="grid-item"><div class="grid-label">湿度</div><div class="grid-value" id="cur-humidity">--%</div></div>
        <div class="grid-item"><div class="grid-label">風速</div><div class="grid-value" id="cur-wind">--.-m/s</div></div>
        <div class="grid-item"><div class="grid-label">降水 (1h)</div><div class="grid-value" id="cur-pop">--mm</div></div>
    </div>
    <div class="footer" id="update-time">気象庁アメダス 自動更新</div>
</div>

<script>
let currentLat = null, currentLon = null, currentName = "";
let amedasTable = null; // アメダス観測所マスターデータ

function getWbgtLevel(e){
    const t = parseFloat(e);
    return t >= 31 ? {color:"#e74c3c", text:"危険（運動中止）"} :
           t >= 28 ? {color:"#e67e22", text:"厳重警戒"} :
           t >= 25 ? {color:"#f1c40f", text:"警戒"} :
           t >= 21 ? {color:"#3498db", text:"注意"} :
                     {color:"#2ecc71", text:"ほぼ安全"};
}

// 気温と湿度から近似WBGTを計算
function calcWbgt(temp, humidity){
    return .725 * temp + .0368 * humidity + .00315 * temp * humidity - 3.2;
}

// 2点間の距離(km)を計算（ヒュベニの公式）
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // 地球の半径 (km)
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// 最寄りのアメダス観測所を探す
async function getNearestAmedasStation(lat, lon) {
    if (!amedasTable) {
        const res = await fetch("https://www.jma.go.jp/bosai/amedas/const/amedastable.json");
        amedasTable = await res.json();
    }
    let nearestStn = null;
    let minDistance = Infinity;

    for (const [stnId, stnInfo] of Object.entries(amedasTable)) {
        // 緯度経度データ形式: [度, 分]
        const stnLat = stnInfo.lat[0] + stnInfo.lat[1] / 60;
        const stnLon = stnInfo.lon[0] + stnInfo.lon[1] / 60;
        const dist = getDistance(lat, lon, stnLat, stnLon);
        if (dist < minDistance) {
            minDistance = dist;
            nearestStn = { id: stnId, name: stnInfo.kjName, lat: stnLat, lon: stnLon };
        }
    }
    return nearestStn;
}

async function updateDashboard(){
    if (!currentLat || !currentLon) return;
    const statusEl = document.getElementById("wbgt-status");
    
    try {
        // 1. 最寄りのアメダス観測所を取得
        const station = await getNearestAmedasStation(currentLat, currentLon);
        if (!station) throw new Error("アメダス観測所が見つかりません");

        // 2. 最新データの時刻（10分刻み）を取得するため最新のアメダスJSONを探す
        // 直近の毎時00分/10分/20分...の時刻文字列を生成
        const now = new Date();
        // 処理の安全のため気象庁データの反映遅れ(約3〜5分)を考慮して少し前の時刻にする
        now.setMinutes(now.getMinutes() - 5);
        const min10 = Math.floor(now.getMinutes() / 10) * 10;
        
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const mi = String(min10).padStart(2, '0');
        
        const timeStr = `${yyyy}${mm}${dd}${hh}${mi}00`;
        const jmaDataUrl = `https://www.jma.go.jp/bosai/amedas/data/map/${timeStr}.json`;

        const res = await fetch(jmaDataUrl);
        if (!res.ok) throw new Error("気象庁データ取得エラー");
        const jmaData = await res.json();

        const stnData = jmaData[station.id];
        if (!stnData) throw new Error("該当観測所のデータが見つかりません");

        // 気圧/湿度観測がない小さなアメダスの場合の対策
        const temp = stnData.temp ? stnData.temp[0] : null;
        const humidity = stnData.humidity ? stnData.humidity[0] : 50; // 湿度データが無い場合は代替値
        const wind = stnData.wind ? stnData.wind[0] : 0;
        const precip1h = stnData.precipitation1h ? stnData.precipitation1h[0] : 0;

        if (temp === null) throw new Error("気温データが取得できません");

        // WBGT算出
        const wbgt = calcWbgt(temp, humidity).toFixed(1);

        // 画面描画
        document.getElementById("location-title").innerText = currentName;
        document.getElementById("location-sub").innerText = `観測地点: ${station.name} (${hh}:${mi}時点)`;
        document.getElementById("weather-text").innerText = "🌡️"; // アメダス単体では天気記号が無い場合があるため

        const numEl = document.getElementById("wbgt-num");
        numEl.innerText = wbgt;
        numEl.style.setProperty("font-size", "32vh", "important");

        document.getElementById("cur-temp").innerText = `${temp.toFixed(1)}℃`;
        document.getElementById("cur-humidity").innerText = stnData.humidity ? `${humidity}%` : `--%`;
        document.getElementById("cur-wind").innerText = `${wind.toFixed(1)}m/s`;
        document.getElementById("cur-pop").innerText = `${precip1h.toFixed(1)}mm`;

        const level = getWbgtLevel(wbgt);
        document.getElementById("wbgt-card").style.backgroundColor = level.color;
        statusEl.innerText = level.text;

        document.getElementById("time-label").innerText = `現在（${hh}:${mi}）の暑さ指数`;
        document.getElementById("update-time").innerText = `気象庁アメダス同期: ${yyyy}/${mm}/${dd} ${hh}:${mi}`;

    } catch (err) {
        console.error(err);
        statusEl.innerText = "データ取得失敗";
    }
}

async function executeLocationSearch(e, t = !1){
    try {
        // 位置検索（緯度経度の取得）のみOpen-Meteoのジオコーディングを利用
        const n = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(e)}&count=1&language=ja`;
        const c = await fetch(n);
        const r = await c.json();
        
        if (r.results && r.results.length > 0) {
            const o = r.results[0];
            const s = (o.admin1 ? o.admin1 : "") + o.name;
            if (!t && !confirm(`「 ${s} 」を取得しました。\nこの場所で間違いありませんか？`)) return !1;
            
            currentLat = o.latitude;
            currentLon = o.longitude;
            currentName = s;
            localStorage.setItem("saved_wbgt_location", e);
            
            const i = window.location.protocol + "//" + window.location.host + window.location.pathname + `?name=${encodeURIComponent(e)}`;
            window.history.replaceState({path: i}, "", i);
            document.getElementById("start-screen").style.display = "none";
            
            await updateDashboard();
            return !0;
        }
        alert(`「${e}」が見つかりませんでした。正しい地域名を入力してください。`);
        return !1;
    } catch (s) {
        alert("通信エラーが発生しました。");
        return !1;
    }
}

async function initSearch(){
    const e = document.getElementById("start-input").value.trim();
    if(e){
        document.getElementById("start-error").innerText = "位置を検索中...";
        (await executeLocationSearch(e, !1)) || (document.getElementById("start-error").innerText = "場所が見つからないか、キャンセルされました。");
    }
}

async function panelSearch(){
    const e = document.getElementById("panel-search-input").value.trim();
    e && (await executeLocationSearch(e, !1)) && (document.getElementById("panel-search-input").value = "");
}

function initSystem(){
    const e = new URLSearchParams(window.location.search).get("name");
    const t = localStorage.getItem("saved_wbgt_location");
    e ? executeLocationSearch(e, !0) : t ? executeLocationSearch(t, !0) : document.getElementById("start-screen").style.display = "flex";
}

document.getElementById("start-input").addEventListener("keypress", function(e){ "Enter" === e.key && initSearch(); });
document.getElementById("panel-search-input").addEventListener("keypress", function(e){ "Enter" === e.key && panelSearch(); });

initSystem();
setInterval(updateDashboard, 600000); // 10分ごとに更新
</script>
</body>
</html>
