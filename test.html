<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WBGTマルチサイネージシステム (環境省基準表示)</title>
<style>
html,body{margin:0;padding:0;width:100vw;height:100vh;background-color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden!important;}
#start-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#1a202c 0%,#2d3748 100%);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9999;color:#fff;}
.start-box{text-align:center;background:rgba(255,255,255,.1);padding:6vh 5vw;border-radius:24px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.3);}
.start-box h2{font-size:4vh;margin:0 0 1vh 0;font-weight:900;}
.start-box p{font-size:2vh;color:#cbd5e0;margin:0 0 4vh 0;}
.start-search-container{display:flex;gap:15px;width:40vw;}
.start-input{flex:1;font-size:2.5vh;padding:2vh 2.5vw;border:none;border-radius:50px;font-weight:bold;outline:none;}
.start-btn{font-size:2.5vh;padding:2vh 4vw;background:#3182ce;color:#fff;border:none;border-radius:50px;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px rgba(49,130,206,.4);}
.widget-box{width:100vw;height:100vh;box-sizing:border-box;padding:1.5vh 3vw;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden!important;background-color:#fff;}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid #edf2f7;height:11vh;}
.header-title-area{display:flex;flex-direction:column;}
.header h1{margin:0;font-size:4vh;color:#2d3748;font-weight:900;line-height:1.1;}
.header .sub{font-size:1.8vh;color:#4a5568;font-weight:bold;}
.search-container{display:flex;align-items:center;gap:8px;}
.search-input{font-size:2.2vh;padding:.8vh 1.5vw;border:3px solid #cbd5e0;border-radius:30px;width:18vw;font-weight:bold;outline:none;color:#2d3748;}
.search-btn{font-size:2.2vh;padding:.8vh 1.8vw;background-color:#3182ce;color:#fff;border:none;border-radius:30px;font-weight:bold;cursor:pointer;}
.weather-icon-txt{font-size:4.5vh;font-weight:900;color:#3182ce;margin-left:15px;white-space:nowrap;}
.wbgt-section{background:#2ecc71;color:#fff;border-radius:24px;text-align:center;height:59vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:2vh 0;box-shadow:0 10px 25px rgba(0,0,0,.1);}
.wbgt-label{font-size:3.5vh;font-weight:bold;letter-spacing:2px;margin:0;line-height:1;}
.wbgt-display-area{display:flex;justify-content:center;align-items:center;width:100%;height:41vh;margin:0;padding:0;}
#wbgt-num{font-weight:900!important;line-height:.9!important;letter-spacing:-6px!important;}
.wbgt-unit{font-size:9vh!important;font-weight:900!important;margin-left:10px;align-self:flex-end;margin-bottom:5vh;}
.wbgt-status{font-size:5vh;font-weight:900;background:rgba(0,0,0,.25);padding:.4vh 8vw;border-radius:50px;display:inline-block;align-self:center;letter-spacing:2px;margin:0;line-height:1.2;}
.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;height:18vh;}
.grid-item{background:#f7fafc;border:4px solid #e2e8f0;border-radius:16px;display:flex;flex-direction:column;justify-content:center;text-align:center;}
.grid-label{font-size:2.5vh;color:#4a5568;font-weight:bold;margin-bottom:2px;}
.grid-value{font-size:4.5vh;font-weight:900;color:#1a202c;line-height:1;}
.footer{font-size:2vh;color:#a0aec0;text-align:center;border-top:3px solid #edf2f7;height:4vh;display:flex;align-items:center;justify-content:center;font-weight:bold;}
</style>
</head>
<body>

<div id="start-screen">
    <div class="start-box">
        <h2>WBGT MONITOR SYSTEM</h2>
        <p>設置する地域、または現場名を入力してください</p>
        <div class="start-search-container">
            <input type="text" id="start-input" class="start-input" placeholder="例：千葉市、加古川市、舞洲...">
            <button onclick="initSearch()" class="start-btn">モニター起動</button>
        </div>
        <div id="start-error" style="color:#fc8181;margin-top:15px;font-weight:bold;"></div>
    </div>
</div>

<div class="widget-box">
    <div class="header">
        <div class="header-title-area">
            <h1 id="location-title">地域情報</h1>
            <div class="sub" id="location-sub">ピンポイント観測情報 (環境省方式算出)</div>
        </div>
        <div class="search-container">
            <input type="text" id="panel-search-input" class="search-input" placeholder="地域を変更...">
            <button onclick="panelSearch()" class="search-btn">変更</button>
            <div id="weather-text" class="weather-icon-txt">--</div>
        </div>
    </div>
    <div class="wbgt-section" id="wbgt-card">
        <div class="wbgt-label" id="time-label">現在の暑さ指数 (WBGT)</div>
        <div class="wbgt-display-area"><span id="wbgt-num">--.-</span><span class="wbgt-unit">℃</span></div>
        <div class="wbgt-status" id="wbgt-status">取得中...</div>
    </div>
    <div class="weather-grid">
        <div class="grid-item"><div class="grid-label">気温</div><div class="grid-value" id="cur-temp">--.-℃</div></div>
        <div class="grid-item"><div class="grid-label">湿度</div><div class="grid-value" id="cur-humidity">--%</div></div>
        <div class="grid-item"><div class="grid-label">風速</div><div class="grid-value" id="cur-wind">--.-m/s</div></div>
        <div class="grid-item"><div class="grid-label">降水</div><div class="grid-value" id="cur-pop">--%</div></div>
    </div>
    <div class="footer" id="update-time">環境省基準算定データ・自動更新</div>
</div>

<script>
let currentLat = null, currentLon = null, currentName = "";

// WMOお天気コードから日本語とアイコンに変換
function getWeatherText(e) {
    if (e === 0) return "☀️ 晴れ";
    if (e === 1 || e === 2 || e === 3) return "⛅ 晴時々曇";
    if (e === 45 || e === 48) return "🌫️ 霧";
    if (e >= 51 && e <= 55) return "🌧️ 小雨";
    if (e >= 61 && e <= 65) return "☔ 雨";
    if (e >= 71 && e <= 75) return "❄️ 雪";
    if (e >= 80 && e <= 82) return "🌦️ にわか雨";
    if (e >= 95 && e <= 99) return "⚡ 雷雨";
    return "☁️ 曇り";
}

// 暑さ指数レベル判定
function getWbgtLevel(e) {
    const t = parseFloat(e);
    if (t >= 31) return { color: "#e74c3c", text: "危険（運動中止）" };
    if (t >= 28) return { color: "#e67e22", text: "厳重警戒" };
    if (t >= 25) return { color: "#f1c40f", text: "警戒" };
    if (t >= 21) return { color: "#3498db", text: "注意" };
    return { color: "#2ecc71", text: "ほぼ安全" };
}

/**
 * 環境省「実況推定用算定式（小野らの式）」に基づくWBGT計算
 * @param {number} Ta 気温 (℃)
 * @param {number} RH 相対湿度 (%)
 * @param {number} WS 風速 (m/s)
 * @param {number} SR 全天日射量 (kW/m2)
 */
function calcEnvWbgt(Ta, RH, WS, SR) {
    // 日射量が負数の場合は0に補正
    const srKw = Math.max(0, SR / 1000); 
    const wbgt = 0.735 * Ta + 0.0374 * RH + 0.00292 * Ta * RH + 7.619 * srKw - 4.557 * Math.pow(srKw, 2) - 0.0572 * WS - 4.064;
    return Math.max(0, wbgt); // 最低値ガード
}

async function updateDashboard() {
    if (!currentLat || !currentLon) return;
    const statusEl = document.getElementById("wbgt-status");
    
    // キャッシュKey
    const cacheKey = `wbgt_env_${currentLat.toFixed(3)}_${currentLon.toFixed(3)}`;
    const cacheData = localStorage.getItem(cacheKey);
    const cacheTime = localStorage.getItem(`${cacheKey}_time`);
    const nowTime = new Date().getTime();

    // 30分以内のキャッシュがあれば利用
    if (cacheData && cacheTime && (nowTime - cacheTime < 1800000)) {
        renderData(JSON.parse(cacheData));
        return;
    }

    const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&hourly=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation_probability,direct_normal_irradiance&timezone=Asia%2FTokyo&forecast_days=1`;

    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("気象データ取得失敗");
        const data = await res.json();
        
        localStorage.setItem(cacheKey, JSON.stringify(data));
        localStorage.setItem(`${cacheKey}_time`, nowTime);
        renderData(data);
    } catch (err) {
        console.error(err);
        if (cacheData) {
            renderData(JSON.parse(cacheData));
            statusEl.innerText += " (オフライン)";
        } else {
            statusEl.innerText = "データ取得失敗";
        }
    }
}

function renderData(data) {
    const hourly = data.hourly;
    const now = new Date();
    let index = 0;

    // 現在時刻に一番近いタイムスロットを検索
    for (let i = 0; i < hourly.time.length; i++) {
        if (new Date(hourly.time[i]) >= now) {
            index = i;
            break;
        }
    }

    const temp = hourly.temperature_2m[index];
    const humidity = hourly.relative_humidity_2m[index];
    const windKm = hourly.wind_speed_10m[index];
    const windMs = windKm / 3.6; // km/h -> m/s 変換
    const pop = hourly.precipitation_probability[index];
    const solarRad = hourly.direct_normal_irradiance ? hourly.direct_normal_irradiance[index] : 0;
    const weatherCode = hourly.weather_code[index];

    // 環境省公式推定式でWBGT算出
    const wbgtVal = calcEnvWbgt(temp, humidity, windMs, solarRad).toFixed(1);
    const weatherTxt = getWeatherText(weatherCode);

    document.getElementById("location-title").innerText = currentName;
    document.getElementById("weather-text").innerText = weatherTxt;

    const numEl = document.getElementById("wbgt-num");
    numEl.innerText = wbgtVal;
    numEl.style.setProperty("font-size", "32vh", "important");

    document.getElementById("cur-temp").innerText = `${temp.toFixed(1)}℃`;
    document.getElementById("cur-humidity").innerText = `${humidity}%`;
    document.getElementById("cur-wind").innerText = `${windMs.toFixed(1)}m/s`;
    document.getElementById("cur-pop").innerText = `${pop}%`;

    const level = getWbgtLevel(wbgtVal);
    document.getElementById("wbgt-card").style.backgroundColor = level.color;
    document.getElementById("wbgt-status").innerText = level.text;

    const slotTime = new Date(hourly.time[index]);
    document.getElementById("time-label").innerText = `現在（${slotTime.getHours()}:00）の暑さ指数 (環境省基準)`;

    const updateNow = new Date();
    document.getElementById("update-time").innerText = `環境省基準データ更新: ${updateNow.getMonth() + 1}/${updateNow.getDate()} ${updateNow.getHours()}:${String(updateNow.getMinutes()).padStart(2, "0")}`;
}

async function executeLocationSearch(query, isAuto = false) {
    if (!query) return false;
    try {
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=ja`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
            const place = data.results[0];
            const displayName = (place.admin1 ? place.admin1 : "") + place.name;

            if (!isAuto && !confirm(`「 ${displayName} 」を取得しました。\n表示を切り替えますか？`)) {
                return false;
            }

            currentLat = place.latitude;
            currentLon = place.longitude;
            currentName = displayName;

            localStorage.setItem("saved_wbgt_location", query);

            const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?name=${encodeURIComponent(query)}`;
            window.history.replaceState({ path: newUrl }, "", newUrl);

            document.getElementById("start-screen").style.display = "none";
            await updateDashboard();
            return true;
        }

        alert(`「${query}」が見つかりませんでした。別の地域名（例：千代田区、大阪市など）でお試しください。`);
        return false;
    } catch (err) {
        console.error(err);
        alert("位置情報の取得中に通信エラーが発生しました。");
        return false;
    }
}

async function initSearch() {
    const val = document.getElementById("start-input").value.trim();
    if (val) {
        document.getElementById("start-error").innerText = "位置を検索中...";
        const success = await executeLocationSearch(val, false);
        if (!success) {
            document.getElementById("start-error").innerText = "場所が見つからないか、キャンセルされました。";
        }
    }
}

async function panelSearch() {
    const val = document.getElementById("panel-search-input").value.trim();
    if (val) {
        const success = await executeLocationSearch(val, false);
        if (success) {
            document.getElementById("panel-search-input").value = "";
        }
    }
}

function initSystem() {
    const urlParam = new URLSearchParams(window.location.search).get("name");
    const savedLoc = localStorage.getItem("saved_wbgt_location");

    if (urlParam) {
        executeLocationSearch(urlParam, true);
    } else if (savedLoc) {
        executeLocationSearch(savedLoc, true);
    } else {
        document.getElementById("start-screen").style.display = "flex";
    }
}

// Enterキー入力での検索対応
document.getElementById("start-input").addEventListener("keypress", function (e) {
    if (e.key === "Enter") initSearch();
});
document.getElementById("panel-search-input").addEventListener("keypress", function (e) {
    if (e.key === "Enter") panelSearch();
});

// システム初期化 & 10分ごとの定期更新
initSystem();
setInterval(updateDashboard, 600000);
</script>
</body>
</html>
