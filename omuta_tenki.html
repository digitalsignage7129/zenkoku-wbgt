<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=558, initial-scale=1.0">
  <title>福岡県大牟田市 3日間天気予報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 558px;
      height: 778px;
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "Arial Black", sans-serif;
      overflow: hidden;
      user-select: none;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダーエリア */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 12px;
      background-color: #111111;
      border-radius: 8px;
      border: 1px solid #333333;
    }
    .location-name {
      font-size: 22px;
      font-weight: 900;
      color: #00e5ff;
    }
    .update-time {
      font-size: 13px;
      color: #aaaaaa;
    }

    /* 3日間コンテナ */
    .forecast-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      flex: 1;
    }

    /* 各日付カード */
    .card {
      background-color: #050505;
      border: 3px solid #444444;
      border-radius: 12px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* 本日/一律のカード強調 */
    .card.today {
      border: 4px solid #00e5ff;
      background-color: #00121d;
    }

    /* 1. 日付・区分エリア */
    .date-box {
      width: 100%;
      border-bottom: 2px solid #333333;
      padding-bottom: 10px;
    }
    .date-label {
      font-size: 22px;
      font-weight: 900;
      color: #00e5ff;
      letter-spacing: 1px;
    }
    .card:not(.today) .date-label {
      color: #aaaaaa;
    }

    .date-val {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
      margin-top: 4px;
    }

    /* 2. 天気アイコン ＆ テキスト */
    .weather-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .weather-icon {
      font-size: 72px;
      line-height: 1;
    }
    .weather-text {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 8px;
      word-break: break-all;
    }

    /* 3. 降水確率 */
    .pop-box {
      width: 100%;
      background-color: #002233;
      border: 2px solid #0088cc;
      border-radius: 8px;
      padding: 10px 0;
    }
    .pop-val {
      font-size: 26px;
      font-weight: 900;
      color: #00ffff;
      line-height: 1;
    }

    /* 4. 最高・最低気温 */
    .temp-box {
      width: 100%;
      background-color: #111111;
      border: 2px solid #222222;
      border-radius: 8px;
      padding: 10px 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .temp-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .temp-title {
      font-size: 13px;
      font-weight: bold;
      color: #888888;
    }
    .temp-val-high {
      font-size: 28px;
      font-weight: 900;
      color: #ff3333;
      line-height: 1;
    }
    .temp-val-low {
      font-size: 28px;
      font-weight: 900;
      color: #3399ff;
      line-height: 1;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="location-name" id="location-name">福岡県大牟田市</div>
    <div class="update-time" id="updated-at">更新: --:--</div>
  </div>

  <div class="forecast-container">
    <!-- Day 1 -->
    <div class="card today" id="card-day1">
      <div class="date-box">
        <div class="date-label" id="label-day1">【 今日 】</div>
        <div class="date-val" id="date-day1">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day1">☀️</div>
        <div class="weather-text" id="weather-day1">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day1">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day1">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day1">--℃</span>
        </div>
      </div>
    </div>

    <!-- Day 2 -->
    <div class="card" id="card-day2">
      <div class="date-box">
        <div class="date-label" id="label-day2">明日</div>
        <div class="date-val" id="date-day2">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day2">⛅</div>
        <div class="weather-text" id="weather-day2">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day2">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day2">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day2">--℃</span>
        </div>
      </div>
    </div>

    <!-- Day 3 -->
    <div class="card" id="card-day3">
      <div class="date-box">
        <div class="date-label" id="label-day3">明後日</div>
        <div class="date-val" id="date-day3">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day3">🌧️</div>
        <div class="weather-text" id="weather-day3">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day3">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day3">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day3">--℃</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 天気文字列から絵文字を判定する関数
    function getWeatherIcon(weatherText) {
      if (!weatherText || weatherText === '--') return '☀️';
      if (weatherText.includes('雨')) {
        if (weatherText.includes('晴')) return '🌦️';
        return '🌧️';
      }
      if (weatherText.includes('雪')) return '❄️';
      if (weatherText.includes('雷')) return '🌩️';
      if (weatherText.includes('くもり') || weatherText.includes('曇')) {
        if (weatherText.includes('晴')) return '⛅';
        return '☁️';
      }
      return '☀️';
    }

    // JSONデータを取得して表示を更新する
    async function loadWeather() {
      try {
        // キャッシュ回避のためタイムスタンプを付与
        const response = await fetch('omuta_tenki.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        // ヘッダー情報
        document.getElementById('location-name').textContent = data.location || '福岡県大牟田市';
        document.getElementById('updated-at').textContent = '更新: ' + (data.updated_at || '--');

        // 各日データの反映
        const keys = ['day1', 'day2', 'day3'];
        keys.forEach((key) => {
          const dayData = data[key];
          if (!dayData) return;

          // ラベル・日付
          const labelEl = document.getElementById(`label-${key}`);
          const dateEl = document.getElementById(`date-${key}`);
          if (labelEl) {
            labelEl.textContent = dayData.label === '今日' ? '【 今日 】' : dayData.label;
          }
          if (dateEl) dateEl.textContent = dayData.date;

          // 天気・アイコン
          const weatherEl = document.getElementById(`weather-${key}`);
          const iconEl = document.getElementById(`icon-${key}`);
          if (weatherEl) weatherEl.textContent = dayData.weather;
          if (iconEl) iconEl.textContent = getWeatherIcon(dayData.weather);

          // 降水確率
          const popEl = document.getElementById(`pop-${key}`);
          if (popEl) {
            const popVal = dayData.pop !== '--' ? `${dayData.pop}%` : '--%';
            popEl.textContent = `☔ ${popVal}`;
          }

          // 気温
          const highEl = document.getElementById(`temphigh-${key}`);
          const lowEl = document.getElementById(`templow-${key}`);
          if (highEl) {
            highEl.textContent = dayData.temp_max !== '--' ? `${dayData.temp_max}℃` : '--℃';
          }
          if (lowEl) {
            lowEl.textContent = dayData.temp_min !== '--' ? `${dayData.temp_min}℃` : '--℃';
          }
        });
      } catch (error) {
        console.error('天気データの読み込みに失敗しました:', error);
      }
    }

    // 初回読み込み
    loadWeather();
  </script>
</body>
</html>
