<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=100vw, height=100vh, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WBGTマルチサイネージ (単体一発起動版)</title>
<style>
html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #fff; font-family: sans-serif; overflow: hidden !important; }
.widget-box { width: 100vw; height: 100vh; box-sizing: border-box; padding: 2.3vh 2.1vw; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden !important; background-color: #fff; }
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 0.46vh solid #edf2f7; height: 10.2vh; }
.header-title-area { display: flex; flex-direction: column; }
.header h1 { margin: 0; font-size: 3.9vh; color: #2d3748; font-weight: 900; line-height: 1.1; }
.weather-icon-txt { font-size: 5.1vh; font-weight: 900; color: #3182ce; }
.wbgt-section { background: #2ecc71; color: #fff; border-radius: 2.2vh; text-align: center; height: 59.2vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 2.8vh 0; box-shadow: 0 0.9vh 2.3vh rgba(0, 0, 0, .1); }
.wbgt-label { font-size: 3.3vh; font-weight: bold; letter-spacing: 0.1vw; margin: 0; line-height: 1; }
.wbgt-display-area { display: flex; justify-content: center; align-items: flex-end; width: 100%; height: 38.9vh; margin: 0; padding: 0; }
#wbgt-num { font-weight: 900 !important; line-height: 0.85 !important; letter-spacing: -0.3vw !important; }
.wbgt-unit { font-size: 8.3vh !important; font-weight: 900 !important; margin-left: 0.8vw; margin-bottom: 3.2vh; }
.wbgt-status { font-size: 5.1vh; font-weight: 900; background: rgba(0, 0, 0, .25); padding: 0.9vh 6vw; border-radius: 4.6vh; display: inline-block; align-self: center; letter-spacing: 0.15vw; margin: 0; line-height: 1.2; }
.weather-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5vw; height: 16.7vh; }
.grid-item { background: #f7fafc; border: 0.37vh solid #e2e8f0; border-radius: 1.5vh; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.grid-label { font-size: 2.4vh; color: #4a5568; font-weight: bold; margin-bottom: 0.7vh; }
.grid-value { font-size: 4.25vh; font-weight: 900; color: #1a202c; line-height: 1; }
.footer { font-size: 1.67vh; color: #a0aec0; text-align: center; border-top: 0.28vh solid #edf2f7; height: 3.7vh; display: flex; align-items: center; justify-content: center; font-weight: bold; }
</style>
</head>
<body>

<div class="widget-box">
    <div class="header">
        <div class="header-title-area">
            <h1 id="location-title">地域情報</h1>
        </div>
        <div id="weather-text" class="weather-icon-txt">--</div>
    </div>
    <div class="wbgt-section" id="wbgt-card">
        <div class="wbgt-label">現在の暑さ指数 (WBGT)</div>
        <div class="wbgt-display-area"><span id="wbgt-num">--.-</span><span class="wbgt-unit">℃</span></div>
        <div class="wbgt-status" id="wbgt-status">データ取得中...</div>
    </div>
    <div class="weather-grid">
        <div class="grid-item"><div class="grid-label">気温</div><div class="grid-value" id="cur-temp">--.-℃</div></div>
        <div class="grid-item"><div class="grid-label">湿度</div><div class="grid-value" id="cur-humidity">--%</div></div>
        <div class="grid-item"><div class="grid-label">風速</div><div class="grid-value" id="cur-wind">--.-m/s</div></div>
        <div class="grid-item"><div class="grid-label">天気詳細</div><div class="grid-value" id="cur-desc" style="font-size:3vh;">--</div></div>
    </div>
    <div class="footer" id="update-time">Open-Meteo 独立計算システム</div>
</div>

<script>
// 💡【解決の鍵】Open-Meteoで国内の主要現場を100%特定するための、正確な緯度経度マスター
function getCoords(cityName) {
    const pure = cityName.replace(/[市区町村]$/, "").trim();
    const master = {
        "江南": { lat: 35.3349, lon: 136.8722 },
        "名護": { lat: 26.5915, lon: 127.9774 },
        "加古川": { lat: 34.7667, lon: 134.8333 },
        "舞洲": { lat: 34.6661, lon: 135.3956 },
        "大阪": { lat: 34.6937, lon: 135.5023 },
        "東京": { lat: 35.6895, lon: 139.6917 },
        "名古屋": { lat: 35.1814, lon: 136.9064 }
    };
    // リストにない新規現場が追加された場合、自動でOpenWeather経由で座標を割り出すバックアップ付き
    return master[pure] || null;
}

function getWeatherEmoji(code) {
    if (code < 2) return "☀️晴";
    if (code < 50) return "☁️曇";
    return "☔雨";
}

function getWeatherDesc(code) {
    if (code === 0) return "快晴";
    if (code < 4) return "晴れ/曇り";
    if (code < 50) return "霧";
    return "雨";
}

function getWbgtLevel(wbgt) {
    const val = parseFloat(wbgt);
    if(val >= 31) return {color: "#e74c3c", text: "危険（運動中止）"};
    if(val >= 28) return {color: "#e67e22", text: "厳重警戒"};
    if(val >= 25) return {color: "#f1c40f", text: "警戒"};
    if(val >= 21) return {color: "#3498db", text: "注意"};
    return {color: "#2ecc71", text: "ほぼ安全"};
}

function calcWbgt(temp, humidity) {
    return 0.725 * temp + 0.0368 * humidity + 0.00315 * temp * humidity - 3.2;
}

async function updateWbgtSystem() {
    const urlParams = new URLSearchParams(window.location.search);
    let cityName = decodeURIComponent(urlParams.get('name') || '江南').trim();
    
    document.getElementById("location-title").innerText = `${cityName}のWBGT`;

    // 30分間は無駄な通信をしないキャッシュ機構（Magic Playerのリロード対策）
    const cacheKey = `wbgt_standalone_cache_${cityName}`;
    const cachedString = localStorage.getItem(cacheKey);
    const nowTime = Date.now();

    if (cachedString) {
        try {
            const cachedData = JSON.parse(cachedString);
            if (cachedData && cachedData.timestamp && (nowTime - cachedData.timestamp < 1800000)) {
                renderWbgt(cachedData.data, cachedData.timestamp);
                return;
            }
        } catch(e) {}
    }

    let coords = getCoords(cityName);
    
    // もしマスターにない地名が来たら、自動でネット検索して位置を特定する（予備機能）
    if (!coords) {
        try {
            const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(cityName)},JP&limit=1&appid=6b80c00ad3da39082b7e25c449d07c51`);
            const geoData = await geoRes.json();
            if (geoData && geoData.length > 0) {
                coords = { lat: geoData[0].lat, lon: geoData[0].lon };
            }
        } catch (e) { console.error("地名検索エラー", e); }
    }

    // どうしても場所がわからない時はデフォルトで江南市にする
    if (!coords) coords = { lat: 35.3349, lon: 136.8722 };

    try {
        // 💡【完全自立】お天気画面を頼らず、自分で直接Open-Meteoからピンポイントデータを取得！
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error();
        const data = await res.json();

        localStorage.setItem(cacheKey, JSON.stringify({ data: data, timestamp: nowTime }));
        renderWbgt(data, nowTime);

    } catch (e) {
        if (cachedString) {
            const cachedData = JSON.parse(cachedString);
            renderWbgt(cachedData.data, cachedData.timestamp);
        } else {
            document.getElementById("wbgt-status").innerText = "データ取得エラー";
        }
    }
}

function renderWbgt(data, timestamp) {
    const current = data.current;
    const temp = current.temperature_2m;
    const humidity = current.relative_humidity_2m || 50;
    const windSpeed = current.wind_speed_10m || 0;
    const weatherCode = current.weather_code;

    // 天気サイネージと同じ温度ベースでWBGTを精密計算
    const wbgtVal = calcWbgt(temp, humidity).toFixed(1);
    const level = getWbgtLevel(wbgtVal);

    document.getElementById("weather-text").innerText = getWeatherEmoji(weatherCode);
    const numDiv = document.getElementById("wbgt-num");
    numDiv.innerText = wbgtVal;
    numDiv.style.setProperty("font-size", "31.5vh", "important");

    document.getElementById("wbgt-card").style.backgroundColor = level.color;
    document.getElementById("wbgt-status").innerText = level.text;

    document.getElementById("cur-temp").innerText = `${temp.toFixed(1)}℃`;
    document.getElementById("cur-humidity").innerText = `${humidity}%`;
    document.getElementById("cur-wind").innerText = `${windSpeed.toFixed(1)}m/s`;
    document.getElementById("cur-desc").innerText = getWeatherDesc(weatherCode);

    const syncDate = new Date(timestamp);
    document.getElementById("update-time").innerText = `データ更新時刻: ${syncDate.getHours()}:${String(syncDate.getMinutes()).padStart(2, '0')} (30分毎自動更新)`;
}

updateWbgtSystem();
setInterval(updateWbgtSystem, 1800000); // 30分毎
</script>
</body>
</html>
