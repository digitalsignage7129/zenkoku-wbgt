<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>広島県広島市安芸区 3日間天気予報</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    /* どんな環境でも親枠（558x424）の100%に完全追従（固定pxによる拡大事故を防止） */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      user-select: none;
    }
    body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* 1. ヘッダーエリア */
    .header {
      height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      background-color: #111111;
      border-radius: 6px;
      border: 1px solid #333333;
      flex-shrink: 0;
    }
    .location-name {
      font-size: 15px;
      font-weight: 900;
      color: #00e5ff;
      white-space: nowrap;
    }
    .update-time {
      font-size: 11px;
      color: #aaaaaa;
      white-space: nowrap;
    }
    /* 2. 3日間コンテナ（枠幅に合わせて均等割） */
    .forecast-container {
      flex: 1;
      display: flex;
      gap: 8px;
      min-height: 0; /* 縦方向のはみ出しを強制リセット */
    }
    /* 各日付カード */
    .card {
      flex: 1;
      min-width: 0; /* 横方向のはみ出しを強制リセット */
      background-color: #050505;
      border: 1px solid #444444;
      border-radius: 6px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .card.today {
      border: 2px solid #00e5ff;
      background-color: #00121d;
    }
    /* 日付表示 */
    .date-box {
      width: 100%;
      border-bottom: 1px solid #333333;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .date-label {
      font-size: 13px;
      font-weight: 900;
      color: #00e5ff;
      white-space: nowrap;
    }
    .card:not(.today) .date-label {
      color: #aaaaaa;
    }
    .date-val {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.2;
      margin-top: 2px;
      white-space: nowrap;
    }
    /* 天気アイコン ＆ テキスト */
    .weather-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 2px 0;
    }
    .weather-icon {
      font-size: 36px;
      line-height: 1;
    }
    .weather-text {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 4px;
      line-height: 1.2;
      word-break: break-all;
    }
    /* 降水確率 */
    .pop-box {
      width: 100%;
      background-color: #002233;
      border: 1px solid #0088cc;
      border-radius: 4px;
      padding: 4px 0;
      flex-shrink: 0;
    }
    .pop-val {
      font-size: 13px;
      font-weight: 900;
      color: #00ffff;
      line-height: 1;
    }
    /* 気温エリア */
    .temp-box {
      width: 100%;
      background-color: #111111;
      border: 1px solid #222222;
      border-radius: 4px;
      padding: 4px 2px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .temp-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .temp-title {
      font-size: 9px;
      font-weight: bold;
      color: #888888;
      margin-bottom: 1px;
    }
    .temp-val-high {
      font-size: 13px;
      font-weight: 900;
      color: #ff3333;
      line-height: 1;
    }
    .temp-val-low {
      font-size: 13px;
      font-weight: 900;
      color: #3399ff;
      line-height: 1;
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <div class="header">
    <div class="location-name" id="location-name">広島県広島市安芸区</div>
    <div class="update-time" id="updated-at">更新: --:--</div>
  </div>
  <!-- 3日間エリア -->
  <div class="forecast-container">
    <!-- Day 1 -->
    <div class="card today" id="card-day1">
      <div class="date-box">
        <div class="date-label" id="label-day1">【 今日 】</div>
        <div class="date-val" id="date-day1">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day1">☀️</div>
        <div class="weather-text" id="weather-day1">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day1">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day1">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day1">--℃</span>
        </div>
      </div>
    </div>
    <!-- Day 2 -->
    <div class="card" id="card-day2">
      <div class="date-box">
        <div class="date-label" id="label-day2">明日</div>
        <div class="date-val" id="date-day2">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day2">⛅</div>
        <div class="weather-text" id="weather-day2">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day2">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day2">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day2">--℃</span>
        </div>
      </div>
    </div>
    <!-- Day 3 -->
    <div class="card" id="card-day3">
      <div class="date-box">
        <div class="date-label" id="label-day3">明後日</div>
        <div class="date-val" id="date-day3">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day3">🌧️</div>
        <div class="weather-text" id="weather-day3">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day3">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day3">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day3">--℃</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    function getWeatherIcon(weatherText) {
      if (!weatherText || weatherText === '--') return '☀️';
      if (weatherText.includes('雨')) {
        if (weatherText.includes('晴')) return '🌦️';
        return '🌧️';
      }
      if (weatherText.includes('雪')) return '❄️';
      if (weatherText.includes('雷')) return '🌩️';
      if (weatherText.includes('くもり') || weatherText.includes('曇')) {
        if (weatherText.includes('晴')) return '⛅';
        return '☁️';
      }
      return '☀️';
    }
    async function loadWeather() {
      try {
        const response = await fetch('akigun-tenki.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        document.getElementById('location-name').textContent = data.location || '広島県広島市安芸区';
        document.getElementById('updated-at').textContent = '更新: ' + (data.updated_at || '--');
        const keys = ['day1', 'day2', 'day3'];
        keys.forEach((key) => {
          const dayData = data[key];
          if (!dayData) return;
          const labelEl = document.getElementById(`label-${key}`);
          const dateEl = document.getElementById(`date-${key}`);
          if (labelEl) labelEl.textContent = dayData.label === '今日' ? '【 今日 】' : (dayData.label || '--');
          if (dateEl) dateEl.textContent = dayData.date || '--/--';
          const weatherEl = document.getElementById(`weather-${key}`);
          const iconEl = document.getElementById(`icon-${key}`);
          if (weatherEl) weatherEl.textContent = dayData.weather || '--';
          if (iconEl) iconEl.textContent = getWeatherIcon(dayData.weather);
          const popEl = document.getElementById(`pop-${key}`);
          if (popEl) {
            const popVal = (dayData.pop && dayData.pop !== '--') ? `${dayData.pop}%` : '--%';
            popEl.textContent = `☔ ${popVal}`;
          }
          const highEl = document.getElementById(`temphigh-${key}`);
          const lowEl = document.getElementById(`templow-${key}`);
          if (highEl) {
            highEl.textContent = (dayData.temp_max && dayData.temp_max !== '--') ? `${dayData.temp_max}℃` : '--℃';
          }
          if (lowEl) {
            lowEl.textContent = (dayData.temp_min && dayData.temp_min !== '--') ? `${dayData.temp_min}℃` : '--℃';
          }
        });
      } catch (error) {
        console.error('天気データの読み込みに失敗しました:', error);
      }
    }
    loadWeather();
    setInterval(loadWeather, 60000);
  </script>
</body>
</html>
