<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大野城市 下帯サイネージ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #080b10; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #ffffff; user-select: none;
    }
    body { padding: 1vh 1vw; display: flex; align-items: center; }

    .bottom-bar {
      width: 100%; height: 100%; background: #111722; border: 1px solid #1f2b3e;
      border-radius: 12px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 2vw; overflow: hidden;
    }

    /* 1. エリア名 ＆ 時計 */
    .info-left { display: flex; align-items: center; gap: 1.5vw; flex: 0 0 auto; }
    .city-badge {
      background: #00e5ff; color: #080b10; font-size: clamp(14px, 2vh, 20px);
      font-weight: 900; padding: 4px 12px; border-radius: 6px;
    }
    .clock-text { font-size: clamp(20px, 3.5vh, 32px); font-weight: 900; color: #ffffff; letter-spacing: 1px; }

    /* 2. テロップ */
    .ticker-container {
      flex: 1; margin: 0 2vw; overflow: hidden; white-space: nowrap; position: relative;
    }
    .ticker-text {
      display: inline-block; font-size: clamp(14px, 2.2vh, 20px); font-weight: bold;
      color: #e2e8f0; animation: marquee 20s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* 3. WBGT（暑さ指数） */
    .wbgt-box {
      display: flex; align-items: center; gap: 1vw; background: rgba(255, 85, 85, 0.15);
      border: 1px solid #ff5555; padding: 0.5vh 1.5vw; border-radius: 8px; flex: 0 0 auto;
    }
    .wbgt-title { font-size: clamp(10px, 1.4vh, 14px); color: #94a3b8; font-weight: bold; }
    .wbgt-status { font-size: clamp(14px, 2.2vh, 22px); font-weight: 900; color: #ffcc00; }
    .wbgt-value { font-size: clamp(22px, 4vh, 36px); font-weight: 900; color: #ff5555; }
  </style>
</head>
<body>

  <div class="bottom-bar">
    <div class="info-left">
      <div class="city-badge">大野城市</div>
      <div class="clock-text" id="clock">--:--</div>
    </div>

    <div class="ticker-container">
      <div class="ticker-text" id="ticker-msg">
        【熱中症予防】こまめな水分補給と適切なエアコンの使用を心がけてください。
      </div>
    </div>

    <div class="wbgt-box" id="wbgt-card">
      <div>
        <div class="wbgt-title">暑さ指数(WBGT)</div>
        <div class="wbgt-status" id="wbgt-status">警戒</div>
      </div>
      <div class="wbgt-value" id="wbgt-val">--</div>
    </div>
  </div>

  <script>
    // 時計更新
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // WBGTデータ取得（大野城市最寄り：太宰府観測所 82176）
    async function fetchWBGT() {
      try {
        // 環境省アメダス太宰府データ参照処理
        const res = await fetch(`https://www.wbgt.env.go.jp/prev15/data/tbl/pref_82.json?t=` + Date.now());
        const data = await res.json();
        
        // 太宰府(82176)の最新WBGT値の抽出（フォールバック用簡易判定含む）
        let wbgt = 31; // デフォルト例
        if (data && data['82176']) {
          const vals = Object.values(data['82176']);
          wbgt = vals[vals.length - 1] || 31;
        }

        const valElem = document.getElementById('wbgt-val');
        const statusElem = document.getElementById('wbgt-status');
        const cardElem = document.getElementById('wbgt-card');

        valElem.textContent = `${wbgt}℃`;

        if (wbgt >= 31) {
          statusElem.textContent = "危険";
          statusElem.style.color = "#ff2222";
          cardElem.style.borderColor = "#ff2222";
        } else if (wbgt >= 28) {
          statusElem.textContent = "厳重警戒";
          statusElem.style.color = "#ff8800";
          cardElem.style.borderColor = "#ff8800";
        } else if (wbgt >= 25) {
          statusElem.textContent = "警戒";
          statusElem.style.color = "#ffcc00";
          cardElem.style.borderColor = "#ffcc00";
        } else {
          statusElem.textContent = "注意";
          statusElem.style.color = "#33cc33";
          cardElem.style.borderColor = "#33cc33";
        }
      } catch (e) {
        console.error("WBGT取得エラー:", e);
      }
    }

    fetchWBGT();
    setInterval(fetchWBGT, 1800000); // 30分毎更新
  </script>
</body>
</html>
