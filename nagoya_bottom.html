<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名古屋市 下帯サイネージ</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #ffffff;
      user-select: none;
    }

    body {
      padding: 12px;
      display: flex;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .clock-block {
      width: 340px;
      height: 100%;
      background: #11141a;
      border: 2px solid #2a364a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .clock-date { font-size: 22px; color: #9ab0c7; font-weight: bold; }
    .clock-time { font-size: 68px; color: #00e5ff; font-weight: 900; line-height: 1; margin-top: 2px; letter-spacing: -1px; }

    .main-block {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .status-bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .city-badge {
      background: #00e5ff;
      color: #000000;
      font-size: 26px;
      font-weight: 900;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .alert-badge {
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      padding: 0 24px;
      border-radius: 8px;
      background: #007700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alert-badge.advisory { background: #d99b00; color: #000000; }
    .alert-badge.warning { background: #d92626; color: #ffffff; }
    .alert-badge.emergency {
      background: #990099;
      color: #ffffff;
      animation: blink 1s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .ticker-container {
      container-type: inline-size;
      flex: 1;
      min-height: 0;
      background: #0a0d14;
      border: 2px solid #2a364a;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .ticker-text {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      width: max-content;
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;

      will-change: transform;
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }

    @keyframes tickerScroll {
      0% { transform: translate3d(100cqw, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <div class="clock-block">
    <div class="clock-date" id="clock-date">----/--/-- (-)</div>
    <div class="clock-time" id="clock-time">00:00</div>
  </div>

  <div class="main-block">
    <div class="status-bar">
      <div class="city-badge" id="city-badge">名古屋市</div>
      <div class="alert-badge" id="alert-badge">気象情報を確認中...</div>
    </div>
    <div class="ticker-container" id="ticker-bg">
      <div class="ticker-text" id="ticker-text">データ取得中...</div>
    </div>
  </div>

  <script>
    // --- 名古屋市用設定 ---
    // 名古屋市は区ごとではなく「市全体で1コード」で警報・注意報が発表される
    // (大阪市と同じ扱い。広島市のように区ごとに分かれるパターンとは異なる)
    const CITY_NAME = '愛知県名古屋市';
    const FORECAST_OFFICE_CODE = '230000'; // 愛知県(警報JSONの取得先。名古屋地方気象台の発表区)
    const CITY_CODE = '2310000';           // 名古屋市(警報・注意報の対象コード)

    // 警報・注意報コード対応表(2026年5月29日改定の「令和8年体系」に対応)
    const WARNING_CODES = {
      '02': { name: '暴風雪警報', type: 'warning' },
      '03': { name: '大雨警報', type: 'warning' },
      '04': { name: '洪水警報', type: 'warning' },
      '05': { name: '暴風警報', type: 'warning' },
      '06': { name: '大雪警報', type: 'warning' },
      '07': { name: '波浪警報', type: 'warning' },
      '08': { name: '高潮警報', type: 'warning' },
      '09': { name: '土砂災害警報', type: 'warning' },
      '10': { name: '大雨注意報', type: 'advisory' },
      '12': { name: '大雪注意報', type: 'advisory' },
      '13': { name: '風雪注意報', type: 'advisory' },
      '14': { name: '雷注意報', type: 'advisory' },
      '15': { name: '強風注意報', type: 'advisory' },
      '16': { name: '波浪注意報', type: 'advisory' },
      '17': { name: '融雪注意報', type: 'advisory' },
      '18': { name: '洪水注意報', type: 'advisory' },
      '19': { name: '高潮注意報', type: 'advisory' },
      '20': { name: '濃霧注意報', type: 'advisory' },
      '21': { name: '乾燥注意報', type: 'advisory' },
      '22': { name: 'なだれ注意報', type: 'advisory' },
      '23': { name: '低温注意報', type: 'advisory' },
      '24': { name: '霜注意報', type: 'advisory' },
      '25': { name: '着氷注意報', type: 'advisory' },
      '26': { name: '着雪注意報', type: 'advisory' },
      '29': { name: '土砂災害注意報', type: 'advisory' },
      '32': { name: '暴風雪特別警報', type: 'emergency' },
      '33': { name: '大雨特別警報', type: 'emergency' },
      '35': { name: '暴風特別警報', type: 'emergency' },
      '36': { name: '大雪特別警報', type: 'emergency' },
      '37': { name: '波浪特別警報', type: 'emergency' },
      '38': { name: '高潮特別警報', type: 'emergency' },
      '39': { name: '土砂災害特別警報', type: 'emergency' },
      '43': { name: '大雨危険警報', type: 'emergency' },
      '48': { name: '高潮危険警報', type: 'emergency' },
      '49': { name: '土砂災害危険警報', type: 'emergency' }
    };

    document.getElementById('city-badge').textContent = CITY_NAME;

    function updateClock() {
      const now = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('clock-date').textContent = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
      document.getElementById('clock-time').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let currentText = '';

    function startTicker(text) {
      if (currentText === text) return;
      currentText = text;

      const el = document.getElementById('ticker-text');
      el.textContent = text;

      const duration = Math.max(12, text.length * 0.38 + 6);

      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = `tickerScroll ${duration}s linear infinite`;
    }

    startTicker(`【${CITY_NAME}】気象庁から最新データを取得しています...`);

    // 発表中とみなすステータス(「解除」以外はすべて発表中として扱う)
    function isActiveStatus(status) {
      return status && status !== '解除' && status !== '発表警報・注意報はなし';
    }

    // 新方式(令和8年体系)のr8エンドポイントに対応。
    // 応答が複数レポートの配列で返る場合は、reportDatetimeが最新のものを採用する。
    // また、レポートの内部構造が「areaTypes/areas/warnings」型と
    // 「class10Items/class20Items/kinds」型のどちらでも読み取れるようにしている。
    async function fetchJmaWarnings() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        const url = `https://www.jma.go.jp/bosai/warning/data/r8/${FORECAST_OFFICE_CODE}.json?t=` + Date.now();
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error('HTTPエラー');
        const data = await res.json();

        // 配列で複数レポートが返る場合、reportDatetimeが最新のものを使う
        let report = data;
        if (Array.isArray(data)) {
          report = data.reduce((latest, cur) => {
            if (!latest) return cur;
            return new Date(cur.reportDatetime) > new Date(latest.reportDatetime) ? cur : latest;
          }, null);
        }
        if (!report) throw new Error('レポートが見つかりません');

        let activeWarnings = [];
        let maxLevel = 'none';

        const registerCode = (code, status) => {
          if (!isActiveStatus(status)) return;
          const master = WARNING_CODES[code];
          if (!master) return;
          if (!activeWarnings.includes(master.name)) activeWarnings.push(master.name);
          if (master.type === 'emergency') maxLevel = 'emergency';
          else if (master.type === 'warning' && maxLevel !== 'emergency') maxLevel = 'warning';
          else if (master.type === 'advisory' && maxLevel === 'none') maxLevel = 'advisory';
        };

        // 構造パターンA: areaTypes[].areas[].warnings[]
        if (Array.isArray(report.areaTypes)) {
          for (const areaType of report.areaTypes) {
            for (const area of areaType.areas || []) {
              if (String(area.code) === String(CITY_CODE)) {
                for (const w of area.warnings || []) {
                  registerCode(w.code, w.status);
                }
              }
            }
          }
        }

        // 構造パターンB: class10Items[]/class20Items[] の areaCode/kinds[]
        const itemLists = [report.class10Items, report.class20Items].filter(Array.isArray);
        for (const items of itemLists) {
          for (const item of items) {
            if (String(item.areaCode) === String(CITY_CODE)) {
              for (const k of item.kinds || []) {
                registerCode(k.code, k.status);
              }
            }
          }
        }

        const badgeEl = document.getElementById('alert-badge');
        badgeEl.className = 'alert-badge';

        if (activeWarnings.length === 0) {
          badgeEl.textContent = '警報・注意報：発表なし';
          startTicker(`【${CITY_NAME}】現在、警報・注意報は発表されていません。本日もご安全にお過ごしください。`);
        } else {
          badgeEl.classList.add(maxLevel);
          const titleMap = {
            'emergency': '【特別警報・危険警報発表中】',
            'warning': '【気象警報発表中】',
            'advisory': '【気象注意報発表中】'
          };
          badgeEl.textContent = titleMap[maxLevel] + ' ' + activeWarnings.join('・');
          startTicker(`【${titleMap[maxLevel]}】${CITY_NAME}に「${activeWarnings.join('、')}」が発表されています。最新の気象・防災情報に注意してください。`);
        }

      } catch (e) {
        clearTimeout(timeoutId);
        console.error('気象警報取得エラー:', e);
        document.getElementById('alert-badge').textContent = '警報・注意報：発表なし';
        startTicker(`【${CITY_NAME}】現在、警報・注意報は発表されていません。本日もご安全にお過ごしください。`);
      }
    }

    fetchJmaWarnings();
    setInterval(fetchJmaWarnings, 600000);
  </script>
</body>
</html>
