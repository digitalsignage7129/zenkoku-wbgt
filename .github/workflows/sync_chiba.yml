name: Chiba MOE Official Correct Sync

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに自動更新
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch and Process MOE Official Monthly CSV
        run: |
          # 1. 気象庁アメダスから気温・湿度・風速を取得（千葉: 45212）
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/latest_time.txt" -o latest_time.txt
          RAW_TIME=$(cat latest_time.txt)
          LATEST_TIME=$(echo "${RAW_TIME}" | sed 's/[-:+T]//g' | cut -c 1-14)
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/map/${LATEST_TIME}.json" -o amedas_now.json

          REAL_TEMP=$(jq -r '."45212".temp[0] // "28.0"' amedas_now.json)
          REAL_TEMP=$(echo "scale=1; $REAL_TEMP / 10" | bc)
          REAL_HUM=$(jq -r '."45212".humidity[0] // "80"' amedas_now.json)
          RAW_WIND=$(jq -r '."45212".wind[0] // "10"' amedas_now.json)
          REAL_WIND=$(echo "scale=1; $RAW_WIND / 10" | bc)

          # 2. 環境省の公式「月別・全地点CSV」を年月から動的生成してダウンロード
          CURRENT_YM=$(date '+%Y%m')
          CSV_URL="https://www.wbgt.env.go.jp/est15WG/dl/wbgt_all_${CURRENT_YM}.csv"
          
          curl -s -o moe_monthly.csv -w "%{http_code}" -H "User-Agent: Mozilla/5.0" "$CSV_URL"

          # 3. 千葉（45212）の行を特定し、最新のWBGT生データを正確に抽出
          REAL_WBGT=""
          if [ -s moe_monthly.csv ]; then
            RAW_LINE=$(iconv -f SHIFT_JIS -t UTF-8 moe_monthly.csv 2>/dev/null | grep "^45212," | tail -n 1)
            if [ -n "$RAW_LINE" ]; then
              # 行の右側（最新の時間帯の列）から順に 50〜500 の数値を探索
              VAL_STR=$(echo "$RAW_LINE" | awk -F',' '{
                val="";
                for(i=NF; i>=1; i--) {
                  gsub(/^[ \t\r\n]+|[ \t\r\n]+$/, "", $i);
                  if ($i ~ /^[0-9]+$/ && $i >= 50 && $i <= 500) {
                    val = $i;
                    break;
                  }
                }
                print val;
              }')
              
              if [ -n "$VAL_STR" ]; then
                REAL_WBGT=$(echo "scale=1; $VAL_STR / 10" | bc)
              fi
            fi
          fi

          # 万が一取得できない場合の安全なバックアップ
          if [ -z "$REAL_WBGT" ]; then
            RAW_WBGT_CALC=$(echo "scale=4; (0.735 * $REAL_TEMP + 0.0374 * $REAL_HUM + 0.00292 * $REAL_TEMP * $REAL_HUM - 4.064)" | bc)
            REAL_WBGT=$(printf "%.1f" "$RAW_WBGT_CALC")
          fi

          # 4. 警戒度の判定
          LEVEL="ほぼ安全"
          if (( $(echo "$REAL_WBGT >= 21.0" | bc -l) )); then
            if (( $(echo "$REAL_WBGT >= 25.0" | bc -l) )); then
              if (( $(echo "$REAL_WBGT >= 28.0" | bc -l) )); then
                if (( $(echo "$REAL_WBGT >= 31.0" | bc -l) )); then
                  LEVEL="危険"
                else
                  LEVEL="厳重警戒"
                fi
              else
                LEVEL="警戒"
              fi
            else
              LEVEL="留意"
            fi
          fi

          # 5. サイネージ送信用JSONに保存
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          echo "{\"location\": \"新港清掃工場（周辺：千葉）\", \"wbgt\": \"$REAL_WBGT\", \"level\": \"$LEVEL\", \"temperature\": \"$REAL_TEMP\", \"humidity\": \"$REAL_HUM\", \"wind_speed\": \"$REAL_WIND\", \"updated_at\": \"$TIMESTAMP\"}" > chiba_wbgt.json
          echo "Official Sync Success -> WBGT: $REAL_WBGT, Temp: $REAL_TEMP, Hum: $REAL_HUM, Level: $LEVEL"

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add chiba_wbgt.json
          git diff --cached --quiet || (git commit -m "Sync Chiba Official Monthly CSV Data" && git push)
