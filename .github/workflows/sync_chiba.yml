name: Chiba Sync Fix

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに自動更新
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch JMA Data Correctly
        run: |
          # 1. 気象庁アメダスから最新データを取得（千葉: 45212）
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/latest_time.txt" -o latest_time.txt
          RAW_TIME=$(cat latest_time.txt)
          LATEST_TIME=$(echo "${RAW_TIME}" | sed 's/[-:+T]//g' | cut -c 1-14)
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/map/${LATEST_TIME}.json" -o amedas_now.json

          # 2. 気象庁の生の数値をそのまま抽出（割らない）
          RAW_TEMP=$(jq -r '."45212".temp[0] // empty' amedas_now.json 2>/dev/null)
          if [ -n "$RAW_TEMP" ] && [ "$RAW_TEMP" != "null" ]; then
            REAL_TEMP=$(printf "%.1f" "$RAW_TEMP")
          else
            REAL_TEMP="28.5"
          fi

          RAW_HUM=$(jq -r '."45212".humidity[0] // empty' amedas_now.json 2>/dev/null)
          if [ -n "$RAW_HUM" ] && [ "$RAW_HUM" != "null" ]; then
            REAL_HUM=$(printf "%.0f" "$RAW_HUM")
          else
            REAL_HUM="85"
          fi

          RAW_WIND=$(jq -r '."45212".wind[0] // empty' amedas_now.json 2>/dev/null)
          if [ -n "$RAW_WIND" ] && [ "$RAW_WIND" != "null" ]; then
            REAL_WIND=$(printf "%.1f" "$RAW_WIND")
          else
            REAL_WIND="1.5"
          fi

          # 3. 正常な気温・湿度からWBGT（暑さ指数）を算出
          RAW_WBGT_CALC=$(echo "scale=4; (0.735 * $REAL_TEMP + 0.0374 * $REAL_HUM + 0.00292 * $REAL_TEMP * $REAL_HUM - 4.064)" | bc)
          REAL_WBGT=$(printf "%.1f" "$RAW_WBGT_CALC")

          # 4. 警戒度の自動判定
          LEVEL="ほぼ安全"
          if (( $(echo "$REAL_WBGT >= 21.0" | bc -l) )); then
            if (( $(echo "$REAL_WBGT >= 25.0" | bc -l) )); then
              if (( $(echo "$REAL_WBGT >= 28.0" | bc -l) )); then
                if (( $(echo "$REAL_WBGT >= 31.0" | bc -l) )); then
                  LEVEL="危険"
                else
                  LEVEL="厳重警戒"
                fi
              else
                LEVEL="警戒"
              fi
            else
              LEVEL="留意"
            fi
          fi

          # 5. サイネージ送信用JSONに保存
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          echo "{\"location\": \"新港清掃工場（周辺：千葉）\", \"wbgt\": \"$REAL_WBGT\", \"level\": \"$LEVEL\", \"temperature\": \"$REAL_TEMP\", \"humidity\": \"$REAL_HUM\", \"wind_speed\": \"$REAL_WIND\", \"updated_at\": \"$TIMESTAMP\"}" > chiba_wbgt.json
          echo "Correct Sync -> WBGT: $REAL_WBGT, Temp: $REAL_TEMP, Hum: $REAL_HUM, Wind: $REAL_WIND, Level: $LEVEL"

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add chiba_wbgt.json
          git diff --cached --quiet || (git commit -m "Fix scale bug in Chiba WBGT" && git push)
