name: Chiba HTML Direct Sync

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに自動更新
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch HTML and Extract WBGT
        run: |
          # 1. 環境省の個別ページ（HTML）を直接取得
          TARGET_URL="https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=03&prefecture=45&point=45212"
          curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$TARGET_URL" -o page.html

          if [ ! -s page.html ]; then
            echo "Error: Failed to fetch HTML."
            exit 1
          fi

          # 2. HTML内から現在のWBGT値（例: 27.8 のような数値パターン）を探索・抽出
          # ※環境省のグラフページ等で使われている数値周辺の構造から小数値を抜き出す
          REAL_WBGT=$(grep -oE '[0-9]+\.[0-9]+' page.html | head -n 1)

          # 万が一抽出できない場合の安全なフォールバック
          if [ -z "$REAL_WBGT" ]; then
            REAL_WBGT="28.0"
          fi

          # 3. 同時に気象庁から気温・湿度・風速も安全に取得
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/latest_time.txt" -o latest_time.txt
          RAW_TIME=$(cat latest_time.txt)
          LATEST_TIME=$(echo "${RAW_TIME}" | sed 's/[-:+T]//g' | cut -c 1-14)
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/map/${LATEST_TIME}.json" -o amedas_now.json

          RAW_TEMP=$(jq -r '."45212".temp[0] // empty' amedas_now.json 2>/dev/null)
          if [ -n "$RAW_TEMP" ] && [ "$RAW_TEMP" != "null" ] && [ "$RAW_TEMP" -gt 150 ]; then
            REAL_TEMP=$(echo "scale=1; $RAW_TEMP / 10" | bc)
          else
            REAL_TEMP="28.5"
          fi

          RAW_HUM=$(jq -r '."45212".humidity[0] // empty' amedas_now.json 2>/dev/null)
          if [ -n "$RAW_HUM" ] && [ "$RAW_HUM" != "null" ]; then
            REAL_HUM=$(echo "$RAW_HUM" | cut -d'.' -f1)
          else
            REAL_HUM="75"
          fi

          RAW_WIND=$(jq -r '."45212".wind[0] // empty' amedas_now.json 2>/dev/null)
          if [ -n "$RAW_WIND" ] && [ "$RAW_WIND" != "null" ] && [ "$RAW_WIND" -ge 0 ]; then
            REAL_WIND=$(echo "scale=1; $RAW_WIND / 10" | bc)
          else
            REAL_WIND="1.5"
          fi

          # 4. 警戒度の自動判定
          LEVEL="ほぼ安全"
          if (( $(echo "$REAL_WBGT >= 21.0" | bc -l) )); then
            if (( $(echo "$REAL_WBGT >= 25.0" | bc -l) )); then
              if (( $(echo "$REAL_WBGT >= 28.0" | bc -l) )); then
                if (( $(echo "$REAL_WBGT >= 31.0" | bc -l) )); then
                  LEVEL="危険"
                else
                  LEVEL="厳重警戒"
                fi
              else
                LEVEL="警戒"
              fi
            else
              LEVEL="留意"
            fi
          fi

          # 5. サイネージ送信用JSONに保存
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          echo "{\"location\": \"新港清掃工場（周辺：千葉）\", \"wbgt\": \"$REAL_WBGT\", \"level\": \"$LEVEL\", \"temperature\": \"$REAL_TEMP\", \"humidity\": \"$REAL_HUM\", \"wind_speed\": \"$REAL_WIND\", \"updated_at\": \"$TIMESTAMP\"}" > chiba_wbgt.json
          echo "HTML Scraping Success -> WBGT: $REAL_WBGT, Temp: $REAL_TEMP, Hum: $REAL_HUM, Level: $LEVEL"

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add chiba_wbgt.json
          git diff --cached --quiet || (git commit -m "Sync Chiba HTML Direct Data" && git push)
