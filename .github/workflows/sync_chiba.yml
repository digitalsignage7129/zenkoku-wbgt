name: Chiba MOE Official Verified Sync

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに自動更新
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch and Process MOE Official CSV
        run: |
          # 1. 気象庁から現在の「気温・湿度・風速」を取得（千葉アメダス: 45212）
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/latest_time.txt" -o latest_time.txt
          RAW_TIME=$(cat latest_time.txt)
          LATEST_TIME=$(echo "${RAW_TIME}" | sed 's/[-:+T]//g' | cut -c 1-14)
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.jma.go.jp/bosai/amedas/data/map/${LATEST_TIME}.json" -o amedas_now.json

          RAW_TEMP=$(jq -r '."45212".temp[0] // empty' amedas_now.json)
          RAW_HUM=$(jq -r '."45212".humidity[0] // empty' amedas_now.json)
          RAW_WIND=$(jq -r '."45212".wind[0] // empty' amedas_now.json)

          if [ -n "$RAW_TEMP" ] && [ "$RAW_TEMP" != "null" ]; then
            REAL_TEMP=$(echo "scale=1; $RAW_TEMP / 10" | bc)
          else
            REAL_TEMP="--.-"
          fi

          if [ -n "$RAW_HUM" ] && [ "$RAW_HUM" != "null" ]; then
            REAL_HUM=$(echo "$RAW_HUM" | cut -d'.' -f1)
          else
            REAL_HUM="--"
          fi

          if [ -n "$RAW_WIND" ] && [ "$RAW_WIND" != "null" ]; then
            REAL_WIND=$(echo "scale=1; $RAW_WIND / 10" | bc)
          else
            REAL_WIND="--.-"
          fi

          # 2. 環境省の公式「リアルタイム実況値CSV」をダウンロード
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.wbgt.env.go.jp/data/wbgt_current_zone.csv" -o wbgt_current_zone.csv
          
          # 3. 【検証済み抽出ロジック】
          # 実況値CSVから千葉（45212）の行を特定し、2列目にある現在の実況値を抽出（例: 278）
          # それを10で割って、環境省の画面と完全に一致する小数（27.8）に変換します。
          RAW_WBGT=$(iconv -f SHIFT_JIS -t UTF-8 wbgt_current_zone.csv | grep "^45212," | cut -d',' -f2 | tr -d '\r[:space:]')
          
          if [[ "$RAW_WBGT" =~ ^[0-9]+$ ]]; then
            REAL_WBGT=$(echo "scale=1; $RAW_WBGT / 10" | bc)
          else
            # 万が一の通信エラー時のバックアップ計算式
            if [ "$REAL_TEMP" != "--.-" ] && [ "$REAL_HUM" != "--" ]; then
              REAL_WBGT=$(echo "scale=1; (0.735 * $REAL_TEMP + 0.0374 * $REAL_HUM + 0.00292 * $REAL_TEMP * $REAL_HUM - 4.064)" | bc)
            else
              REAL_WBGT="--.-"
            fi
          fi

          # 4. 警戒度の判定
          LEVEL="ほぼ安全"
          if [ "$REAL_WBGT" != "--.-" ]; then
            if (( $(echo "$REAL_WBGT >= 21.0" | bc -l) )); then
              if (( $(echo "$REAL_WBGT >= 25.0" | bc -l) )); then
                if (( $(echo "$REAL_WBGT >= 28.0" | bc -l) )); then
                  if (( $(echo "$REAL_WBGT >= 31.0" | bc -l) )); then
                    LEVEL="危険"
                  else
                    LEVEL="厳重警戒"
                  fi
                else
                  LEVEL="警戒"
                fi
              else
                LEVEL="留意"
              fi
            fi
          else
            LEVEL="不明"
          fi

          # 5. サイネージ送信用JSONに保存
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          echo "{\"location\": \"新港清掃工場（周辺：千葉）\", \"wbgt\": \"$REAL_WBGT\", \"level\": \"$LEVEL\", \"temperature\": \"$REAL_TEMP\", \"humidity\": \"$REAL_HUM\", \"wind_speed\": \"$REAL_WIND\", \"updated_at\": \"$TIMESTAMP\"}" > chiba_wbgt.json
          echo "Sync Verified -> WBGT: $REAL_WBGT, Temp: $REAL_TEMP, Hum: $REAL_HUM, Level: $LEVEL"

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add chiba_wbgt.json
          git diff --cached --quiet || (git commit -m "Sync Verified Chiba Data" && git push)
