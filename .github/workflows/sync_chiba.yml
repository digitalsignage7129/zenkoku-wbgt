name: Chiba Official Sync

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに自動更新
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0"}

          # 1. 環境省サイトから千葉（45212）の公式WBGT値（27.8等）を直接取得
          moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=03&prefecture=45&point=45212"
          wbgt_val = None

          try:
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  # タグ内の数値（15.0〜40.0）をピンポイント抽出
                  matches = re.findall(r'>(1[5-9]\.[0-9]|2[0-9]\.[0-9]|3[0-9]\.[0-9])<', html)
                  if matches:
                      wbgt_val = matches[0]
          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 2. 気象庁アメダスから正確な気温・湿度・風速を取得
          temp_val, hum_val, wind_val = "28.0", "80", "1.5"
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time) as resp:
                  latest_time = resp.read().decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  chiba = map_data.get("45212", {})

                  if "temp" in chiba and chiba["temp"]:
                      temp_val = str(chiba["temp"][0])
                  if "humidity" in chiba and chiba["humidity"]:
                      hum_val = str(int(chiba["humidity"][0]))
                  if "wind" in chiba and chiba["wind"]:
                      wind_val = str(chiba["wind"][0])
          except Exception as e:
              print(f"JMA fetch error: {e}")

          # 万が一環境省から取れなかった場合のみバックアップ計算
          if not wbgt_val:
              try:
                  t, h = float(temp_val), float(hum_val)
                  wbgt_val = f"{(0.735 * t + 0.0374 * h + 0.00292 * t * h - 4.064):.1f}"
              except:
                  wbgt_val = "27.8"

          # 3. 警戒度の判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # 4. 指定されたデザインのJSON出力
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "新港清掃工場（周辺：千葉）",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),
              "wind_speed": str(wind_val),
              "updated_at": now_str
          }

          with open("chiba_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add chiba_wbgt.json
          git diff --cached --quiet || (git commit -m "Restore Clean Design & Sync MOE Official WBGT" && git push)
