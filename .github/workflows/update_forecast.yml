name: Update Hakuba Weather Forecast

on:
  schedule:
    # 毎時0分（UTC）に自動実行（JST 毎時0分）
    - cron: '0 * * * *'
  workflow_dispatch: # Actions画面からの手動実行を許可

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 天気予報データの取得・JSON生成
        run: python get_hakuba_tenki.py

      - name: 変更の確認とコミット・プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add hakuba_tenki.json
          
          # JSONデータに差分がある場合のみコミット
          if git diff --staged --quiet; then
            echo "データに変更はありません。"
          else
            git commit -m "Auto update hakuba_tenki.json [skip ci]"
            git push
          fi
