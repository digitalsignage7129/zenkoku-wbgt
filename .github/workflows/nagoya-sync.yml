name: Nagoya Moriyama Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行（混雑回避のため数分ズラし）
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0"}

          # デフォルト値・ダミー値は一切持たせない
          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "不明"

          # 1. 環境省サイトから名古屋（51106）の公式WBGT値を取得
          # region=06 (東海), prefecture=51 (愛知県), point=51106 (名古屋)
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=06&prefecture=51&point=51106"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  matches = re.findall(r'>(1[5-9]\.[0-9]|2[0-9]\.[0-9]|3[0-9]\.[0-9])<', html)
                  if matches:
                      wbgt_val = matches[0]
          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 2. 気象庁アメダスから気温・湿度・風速・天気を取得（失敗時は例外を発生させる）
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time) as resp:
                  latest_time = resp.read().decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  nagoya = map_data.get("51106", {})

                  if "temp" in nagoya and nagoya["temp"] and nagoya["temp"][0] is not None:
                      temp_val = f"{float(nagoya['temp'][0]):.1f}"
                  if "humidity" in nagoya and nagoya["humidity"] and nagoya["humidity"][0] is not None:
                      hum_val = str(int(nagoya["humidity"][0]))
                  if "wind" in nagoya and nagoya["wind"] and nagoya["wind"][0] is not None:
                      wind_val = f"{float(nagoya['wind'][0]):.1f}"

                  # 実測値から天気を判定（10分降水量 / 10分日照時間）
                  precip = nagoya.get("precipitation10m", [0])[0] or 0
                  sun = nagoya.get("sun10m", [0])[0] or 0

                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"

          except Exception as e:
              print(f"JMA fetch error: {e}")
              raise RuntimeError(f"Failed to fetch real-time weather data: {e}")

          # 必須データが一つでも欠けていたら処理を中断し、嘘のデータを書き込まない
          if not temp_val or not hum_val or not wind_val:
              raise ValueError("Critical weather data is missing. Aborting to prevent invalid display.")

          # 環境省WBGTが万が一取得できなかった場合も即座にストップ
          if not wbgt_val:
              raise ValueError("Official WBGT data could not be retrieved from MOE.")

          # 警戒度の判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # JSON出力
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "名古屋市守山区（周辺：名古屋）",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("nagoya_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nagoya_wbgt.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Nagoya WBGT & Weather Data"
            git pull --rebase origin main
            git push origin main
          fi
