name: Ibaraki Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行（混雑回避のため数分ズラし）
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0"}

          # デフォルト値・ダミー値は一切持たせない
          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "不明"

          # 1. 環境省サイトから茨木（62086）の公式WBGT値を取得
          # region=07 (近畿), prefecture=62 (大阪府), point=62086 (茨木)
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62086"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  matches = re.findall(r'>(1[5-9]\.[0-9]|2[0-9]\.[0-9]|3[0-9]\.[0-9])<', html)
                  if matches:
                      wbgt_val = matches[0]
          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 2. Open-Meteo APIから茨木市（緯度:34.8163, 経度:135.5686）のピンポイント気象データを取得
          try:
              lat = 34.8163
              lon = 135.5686
              openmeteo_url = f"https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo"
              
              req_om = urllib.request.Request(openmeteo_url, headers=headers)
              with urllib.request.urlopen(req_om) as resp:
                  om_data = json.loads(resp.read().decode('utf-8'))
                  current = om_data.get("current", {})

                  if "temperature_2m" in current and current["temperature_2m"] is not None:
                      temp_val = f"{float(current['temperature_2m']):.1f}"

                  if "relative_humidity_2m" in current and current["relative_humidity_2m"] is not None:
                      hum_val = str(int(current["relative_humidity_2m"]))

                  if "wind_speed_10m" in current and current["wind_speed_10m"] is not None:
                      wind_val = f"{float(current['wind_speed_10m']):.1f}"

                  # WMO Weather Code から天気を日本語に変換
                  if "weather_code" in current and current["weather_code"] is not None:
                      code = int(current["weather_code"])
                      if code in [0, 1]:
                          weather_val = "晴れ"
                      elif code in [2, 3]:
                          weather_val = "くもり"
                      elif code in [45, 48]:
                          weather_val = "霧"
                      elif code in [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]:
                          weather_val = "雨"
                      elif code in [71, 73, 75, 77, 85, 86]:
                          weather_val = "雪"
                      elif code in [95, 96, 99]:
                          weather_val = "雷雨"
                      else:
                          weather_val = "くもり"

          except Exception as e:
              print(f"Open-Meteo fetch error: {e}")
              raise RuntimeError(f"Failed to fetch real-time weather data from Open-Meteo: {e}")

          # 必須データが一つでも欠けていたら処理を中断
          if not temp_val or not hum_val or not wind_val:
              raise ValueError("Critical weather data is missing from Open-Meteo. Aborting.")

          # 環境省WBGTが万が一取得できなかった場合も即座にストップ
          if not wbgt_val:
              raise ValueError("Official WBGT data could not be retrieved from MOE.")

          # 警戒度の判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # JSON出力
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府茨木市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("ibaraki_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ibaraki_wbgt.json
          git diff --cached --quiet || (git commit -m "Update Ibaraki WBGT & Weather Data" && git push)
