name: Ibaraki Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0"}

          wbgt_val = None
          temp_val = None
          hum_val = "--"  # 茨木は湿度観測がないため初期値・データなしを「--」に設定
          wind_val = None
          weather_val = "不明"

          # 1. 環境省サイトから茨木（62086）の公式WBGT値を取得
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62086"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  matches = re.findall(r'>(1[5-9]\.[0-9]|2[0-9]\.[0-9]|3[0-9]\.[0-9])<', html)
                  if matches:
                      wbgt_val = matches[0]
          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 2. 気象庁アメダスから茨木（62086）のデータを取得
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time) as resp:
                  latest_time = resp.read().decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  ibaraki = map_data.get("62086", {})

                  if "temp" in ibaraki and ibaraki["temp"] and ibaraki["temp"][0] is not None:
                      temp_val = f"{float(ibaraki['temp'][0]):.1f}"
                  
                  # 観測データが存在する場合のみ上書き（存在しない場合は "--" のまま）
                  if "humidity" in ibaraki and ibaraki["humidity"] and ibaraki["humidity"][0] is not None:
                      hum_val = str(int(ibaraki["humidity"][0]))

                  if "wind" in ibaraki and ibaraki["wind"] and ibaraki["wind"][0] is not None:
                      wind_val = f"{float(ibaraki['wind'][0]):.1f}"

                  # 実測値から天気を判定（10分降水量 / 10分日照時間）
                  precip = ibaraki.get("precipitation10m", [0])[0] or 0
                  sun = ibaraki.get("sun10m", [0])[0] or 0

                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"

          except Exception as e:
              print(f"JMA fetch error: {e}")
              raise RuntimeError(f"Failed to fetch real-time weather data: {e}")

          # 気温・風速（湿度はチェック対象から除外）の必須データチェック
          if not temp_val or not wind_val:
              raise ValueError("Critical weather data (temp/wind) is missing. Aborting.")

          # 環境省WBGTのチェック
          if not wbgt_val:
              raise ValueError("Official WBGT data could not be retrieved from MOE.")

          # 警戒度判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # JSON出力
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府茨木市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),  # "--" または実測値
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("ibaraki_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ibaraki_wbgt.json
          git diff --cached --quiet || (git commit -m "Update Ibaraki WBGT & Weather Data" && git push)
