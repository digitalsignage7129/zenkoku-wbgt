name: Update Hakuba WBGT Data

on:
  schedule:
    # 10分ごとに自動実行 (UTC表記)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動実行ボタンも用意

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run data fetch script
        run: python get_hakuba_data.py

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hakuba_wbgt.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update hakuba_wbgt.json" && git push)
