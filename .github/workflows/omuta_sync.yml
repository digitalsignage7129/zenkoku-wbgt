name: Auto Update Omuta WBGT Data

on:
  schedule:
    # 10分ごとに実行
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron-trigger]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Python script
        run: python get_omuta_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omuta_wbgt.json
          git diff --staged --quiet || (git commit -m "auto: update omuta_wbgt.json" && git push)
