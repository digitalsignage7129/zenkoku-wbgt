name: Update WBGT and Weather Data

on:
  schedule:
    # 毎時15分に自動実行 (データの更新タイミングに合わせる)
    - cron: '15 * * * *'
  workflow_dispatch:  # 手動でも実行できるようにする

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # リポジトリへの書き込み権限を付与

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: python fetch_hybrid_data.py

      - name: Commit and push if data changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add wbgt_data.json
          # 変更がある場合のみコミット＆プッシュ
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update WBGT and weather data [skip ci]" && git push)
