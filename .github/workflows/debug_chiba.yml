name: Chiba Current CSV Debugger

on:
  workflow_dispatch:  # 手動実行

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Current Zone CSV for 45212
        run: |
          # 1. リアルタイム速報CSVをダウンロード
          curl -s -H "User-Agent: Mozilla/5.0" "https://www.wbgt.env.go.jp/data/wbgt_current_zone.csv" -o current_zone.csv
          
          if [ ! -s current_zone.csv ]; then
            echo "Error: Failed to download current_zone.csv"
            exit 1
          fi

          echo "=== 千葉 (45212) 行の全カラム値内訳 ==="
          iconv -f SHIFT_JIS -t UTF-8 current_zone.csv 2>/dev/null | grep "^45212," | awk -F',' '{
            for(i=1; i<=NF; i++) {
              print "Col " i " : " $i
            }
          }'
