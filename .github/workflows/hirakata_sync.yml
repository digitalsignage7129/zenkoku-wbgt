name: Hirakata Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "晴れ"

          # 1. 気象庁(JMA) アメダス枚方(62081)の10分毎【生データ】を取得
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  latest_time_str = resp.read().decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time_str)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  hirakata = map_data.get("62081", {})

                  # 気温 (°C) - アメダス実測値
                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"

                  # 湿度 (%) - アメダス実測値
                  if "humidity" in hirakata and hirakata["humidity"] and hirakata["humidity"][0] is not None:
                      hum_val = str(int(hirakata["humidity"][0]))

                  # 風速 (m/s) - アメダス実測値 (index 1が風速)
                  if "wind" in hirakata and hirakata["wind"] and len(hirakata["wind"]) > 1 and hirakata["wind"][1] is not None:
                      wind_val = f"{float(hirakata['wind'][1]):.1f}"

          except Exception as e:
              print(f"JMA Amedas fetch error: {e}")

          # 2. 気象庁(JMA) 天気予報APIから大阪府(270000)の公式天気を取得
          try:
              jma_fc_url = "https://www.jma.go.jp/bosai/forecast/data/forecast/270000.json"
              req_fc = urllib.request.Request(jma_fc_url, headers=headers)
              with urllib.request.urlopen(req_fc, timeout=10) as resp:
                  fc_data = json.loads(resp.read().decode('utf-8'))
                  weathers = fc_data[0]["timeSeries"][0]["areas"][0]["weathers"]
                  if weathers:
                      raw_w = weathers[0].replace(" ", "")
                      if "雨" in raw_w and "晴" in raw_w:
                          weather_val = "晴のち雨" if raw_w.find("晴") < raw_w.find("雨") else "雨のち晴"
                      elif "雷" in raw_w:
                          weather_val = "雷雨"
                      elif "雨" in raw_w:
                          weather_val = "雨"
                      elif "晴" in raw_w:
                          weather_val = "晴れ"
                      elif "くもり" in raw_w or "曇" in raw_w:
                          weather_val = "くもり"
          except Exception as e:
              print(f"JMA Forecast fetch error: {e}")

          # 3. 環境省HPから「現在の暑さ指数」バナーの公式WBGT値をピンポイント取得
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62081"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  
                  # 「現在の暑さ指数」の直近にある数値（例: 30.5）をピンポイント抽出
                  match = re.search(r'現在の暑さ指数[\s\S]{0,300}?([1-3]?[0-9]\.[0-9])', html)
                  if match:
                      wbgt_val = match.group(1)
                  else:
                      matches = re.findall(r'>([0-3]?[0-9]\.[0-9])<', html)
                      if matches:
                          wbgt_val = matches[0]

          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 万が一WBGTが取得できなかった場合の簡易計算フォールバック
          if not wbgt_val and temp_val and hum_val:
              t = float(temp_val)
              h = float(hum_val)
              calc_wbgt = 0.725 * t + 0.0368 * h + 0.00115 * t * h - 0.992
              wbgt_val = f"{calc_wbgt:.1f}"

          # 警戒度の判定
          w = float(wbgt_val) if wbgt_val else 0.0
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # JST時刻でJSON書き出し
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val or "--.-"),
              "level": level,
              "temperature": str(temp_val or "--.-"),
              "humidity": str(hum_val or "--"),
              "wind_speed": str(wind_val or "--.-"),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          git diff --cached --quiet || (git commit -m "Update Hirakata WBGT & Weather Data" && git push)
