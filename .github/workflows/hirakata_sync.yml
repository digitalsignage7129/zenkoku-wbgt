name: Hirakata Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "晴れ"

          # 1. Open-Meteo APIから枚方市（北緯34.8136, 東経135.6530）の日本時間(JST)最新気象データを取得
          try:
              lat = 34.8136
              lon = 135.6530
              openmeteo_url = f"https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo"
              
              req_om = urllib.request.Request(openmeteo_url, headers=headers)
              with urllib.request.urlopen(req_om, timeout=10) as resp:
                  om_data = json.loads(resp.read().decode('utf-8'))
                  current = om_data.get("current", {})

                  if "temperature_2m" in current and current["temperature_2m"] is not None:
                      temp_val = f"{float(current['temperature_2m']):.1f}"

                  if "relative_humidity_2m" in current and current["relative_humidity_2m"] is not None:
                      hum_val = str(int(current["relative_humidity_2m"]))

                  if "wind_speed_10m" in current and current["wind_speed_10m"] is not None:
                      wind_val = f"{float(current['wind_speed_10m']):.1f}"

                  # 天気コード判定
                  if "weather_code" in current and current["weather_code"] is not None:
                      code = int(current["weather_code"])
                      if code in [0, 1]:
                          weather_val = "晴れ"
                      elif code in [2, 3]:
                          weather_val = "くもり"
                      elif code in [45, 48]:
                          weather_val = "霧"
                      elif code in [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]:
                          weather_val = "雨"
                      elif code in [95, 96, 99]:
                          weather_val = "雷雨"
                      else:
                          weather_val = "くもり"

          except Exception as e:
              print(f"Open-Meteo fetch error: {e}")

          # 2. 環境省HPから枚方（62081）の最新WBGT値（テーブルの最新行）を抽出
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62081"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  
                  # テーブルの各行 <tr> を抽出
                  rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html, re.DOTALL | re.IGNORECASE)
                  
                  # 下（最新時間帯）から逆順に解析して、最初にマッチした最新のWBGT数値を取得
                  for row in reversed(rows):
                      # <td>タグ内のテキストを取得
                      tds = re.findall(r'<td[^>]*>(.*?)</td>', row, re.DOTALL | re.IGNORECASE)
                      clean_tds = [re.sub(r'<[^>]+>', '', td).strip() for td in tds]
                      
                      for text in clean_tds:
                          # 10.0 ～ 39.9 の数値パターン（最新発表の数値）
                          m = re.match(r'^([0-3]?[0-9]\.[0-9])$', text)
                          if m:
                              wbgt_val = m.group(1)
                              break
                      if wbgt_val:
                          break

          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 3. 万が一WBGTを取得できなかった場合は気温・湿度から簡易WBGT（BOM式）で算出
          if not wbgt_val and temp_val and hum_val:
              print("Warning: Official WBGT could not be fetched. Calculating estimated WBGT.")
              t = float(temp_val)
              h = float(hum_val)
              calc_wbgt = 0.725 * t + 0.0368 * h + 0.00115 * t * h - 0.992
              wbgt_val = f"{calc_wbgt:.1f}"

          # 警戒度の判定
          w = float(wbgt_val) if wbgt_val else 0.0
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # JST時刻でJSON書き出し
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val or "--.-"),
              "level": level,
              "temperature": str(temp_val or "--.-"),
              "humidity": str(hum_val or "--"),
              "wind_speed": str(wind_val or "--.-"),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          git diff --cached --quiet || (git commit -m "Update Hirakata WBGT & Weather Data" && git push)
