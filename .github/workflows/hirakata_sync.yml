name: Hirakata Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch Official Data and Generate JSON
        run: |
          # 1. WBGT & アメダス実測データの取得
          python - << 'EOF'
          import urllib.request
          import gzip
          import json
          import re
          import html
          from datetime import datetime, timezone, timedelta

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Encoding": "gzip, deflate"
          }

          wbgt_val = None
          temp_val = None
          wind_val = None
          weather_val = "晴れ"

          moe_urls = [
              "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62046",
              "https://www.wbgt.env.go.jp/graph_ref_td.php?region=07&prefecture=62&point=62046"
          ]

          for url in moe_urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raw_data = resp.read()
                      if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                          raw_data = gzip.decompress(raw_data)
                      raw_text = raw_data.decode('utf-8', errors='ignore')

                      time_matches = re.findall(r'\b\d{1,2}:\d{2}\b[\s\S]{1,150}?\b(\d{1,2}\.\d)\b', raw_text)
                      valid_a = [m for m in time_matches if 10.0 <= float(m) <= 45.0]
                      if valid_a:
                          wbgt_val = valid_a[-1]
                          break

                      unescaped = html.unescape(raw_text)
                      clean_text = re.sub(r'<[^>]+>', ' ', unescaped)
                      tokens = clean_text.split()
                      found_b = []
                      for i in range(len(tokens) - 1):
                          if re.match(r'^\d{1,2}:\d{2}$', tokens[i]):
                              for j in range(1, 4):
                                  if i + j < len(tokens):
                                      tok = tokens[i + j]
                                      if re.match(r'^\d{1,2}\.\d$', tok) and 10.0 <= float(tok) <= 45.0:
                                          found_b.append(tok)
                                          break
                      if found_b:
                          wbgt_val = found_b[-1]
                          break

                      all_floats = re.findall(r'\b\d{1,2}\.\d\b', raw_text)
                      valid_c = [f for f in all_floats if 10.0 <= float(f) <= 45.0]
                      if valid_c:
                          wbgt_val = valid_c[-1]
                          break
              except Exception as e:
                  print(f"[MOE Warning] {e}")

          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  raw_data = resp.read()
                  if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                      raw_data = gzip.decompress(raw_data)
                  latest_time = raw_data.decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  raw_data = resp.read()
                  if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                      raw_data = gzip.decompress(raw_data)
                  map_data = json.loads(raw_data.decode('utf-8'))
                  hirakata = map_data.get("62046", {})

                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"
                  if "wind" in hirakata and hirakata["wind"] and hirakata["wind"][0] is not None:
                      wind_val = f"{float(hirakata['wind'][0]):.1f}"

                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0
                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"
          except Exception as e:
              print(f"[JMA Error] {e}")

          if not wbgt_val or not temp_val or not wind_val:
              raise ValueError("Data retrieval failed.")

          w = float(wbgt_val)
          level = "危険" if w >= 31.0 else "厳重警戒" if w >= 28.0 else "警戒" if w >= 25.0 else "留意" if w >= 21.0 else "ほぼ安全"
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }
          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          EOF

          # 2. 3日間天気予報データの取得（気温完全補完 ＋ アイコン修正版）
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime

          URL = "https://www.jma.go.jp/bosai/forecast/data/forecast/270000.json"
          WEEK_DAYS = ["月", "火", "水", "木", "金", "土", "日"]

          def get_weather_icon(text):
              if "雨" in text and "晴" in text:
                  return "🌦️"
              elif "雨" in text or "雷" in text:
                  return "🌧️"
              elif "雪" in text:
                  return "☃️"
              elif "晴" in text and ("くもり" in text or "曇" in text):
                  return "⛅"
              elif "晴" in text:
                  return "☀️"
              elif "くもり" in text or "曇" in text:
                  return "☁️"
              return "🌤️"

          def format_weather_text(raw_text):
              for detail_key in ["所により", "雷を伴", "激しく"]:
                  raw_text = raw_text.split(detail_key)[0]
              
              time_pattern = r'(朝のうち|昼過ぎ|夕方|夜のはじめ頃|夜遅く|夜|明け方|午前中|午後)(から|まで|頃)?'
              text = re.sub(time_pattern, '', raw_text)
              
              text = text.replace(" ", "").replace(" ", "")
              text = text.replace("のち", "/").replace("時々", "/").replace("一時", "/")
              
              parts = [p.strip() for p in text.split("/") if p.strip()]
              if len(parts) >= 2:
                  return f"{parts[0]} / {parts[1]}"
              elif len(parts) == 1:
                  return parts[0]
              return "くもり"

          try:
              req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              # 1. 週間予報（data[1]）から日付ごとの気温データを抽出してマップ化
              weekly_temp_map = {}
              if len(data) > 1 and "timeSeries" in data[1]:
                  try:
                      w_times = data[1]["timeSeries"][1]["timeDefines"]
                      w_area = data[1]["timeSeries"][1]["areas"][0]
                      w_mins = w_area.get("tempMin", [])
                      w_maxs = w_area.get("tempMax", [])

                      for idx, t_str in enumerate(w_times):
                          d_key = t_str.split("T")[0]
                          t_min = w_mins[idx] if idx < len(w_mins) and w_mins[idx] != "" else None
                          t_max = w_maxs[idx] if idx < len(w_maxs) and w_maxs[idx] != "" else None
                          weekly_temp_map[d_key] = {"min": t_min, "max": t_max}
                  except Exception as ex:
                      print(f"[Weekly Temp Parse Warning] {ex}")

              # 2. 短期予報（data[0]）のデータ抽出
              time_series = data[0]["timeSeries"]
              dates_raw = time_series[0]["timeDefines"]
              weathers_raw = time_series[0]["areas"][0]["weathers"]
              pops_raw = time_series[1]["areas"][0]["pops"]
              temps_raw = time_series[2]["areas"][0]["temps"] if len(time_series) > 2 else []

              forecasts = []
              for i in range(min(3, len(dates_raw))):
                  dt = datetime.fromisoformat(dates_raw[i])
                  date_iso = dt.strftime("%Y-%m-%d")
                  date_str = f"{dt.month}/{dt.day} ({WEEK_DAYS[dt.weekday()]})"
                  
                  raw_w = weathers_raw[i]
                  weather_text = format_weather_text(raw_w)
                  icon = get_weather_icon(raw_w)
                  pop = pops_raw[i] if i < len(pops_raw) else "0"
                  
                  temp_low = None
                  temp_high = None
                  
                  # 短期予報APIからの気温抽出
                  if i == 0 and len(temps_raw) >= 2:
                      temp_high = temps_raw[1]
                  elif i == 1 and len(temps_raw) >= 4:
                      temp_low = temps_raw[2]
                      temp_high = temps_raw[3]

                  # 不足分を週間予報マップから補完
                  if date_iso in weekly_temp_map:
                      if temp_high is None:
                          temp_high = weekly_temp_map[date_iso]["max"]
                      if temp_low is None:
                          temp_low = weekly_temp_map[date_iso]["min"]

                  forecasts.append({
                      "date_str": date_str,
                      "weather": weather_text,
                      "icon": icon,
                      "pop": pop,
                      "temp_high": temp_high,
                      "temp_low": temp_low
                  })

              result = {"forecasts": forecasts}
              with open("weather_3days.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print("Successfully generated weather_3days.json")
          except Exception as e:
              print(f"[Forecast Error] {e}")
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json weather_3days.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WBGT and 3-day weather forecast data"
            git push
          fi
