name: Hirakata Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import gzip
          import json
          import re
          import html
          from datetime import datetime, timezone, timedelta

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Encoding": "gzip, deflate"
          }

          wbgt_val = None
          temp_val = None
          wind_val = None
          weather_val = "晴れ"

          # ----------------------------------------------------
          # 1. WBGT値：環境省（枚方: 62046）から取得
          # ----------------------------------------------------
          moe_urls = [
              "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62046",
              "https://www.wbgt.env.go.jp/graph_ref_td.php?region=07&prefecture=62&point=62046"
          ]

          for url in moe_urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raw_data = resp.read()
                      
                      # Gzip解凍処理
                      if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                          raw_data = gzip.decompress(raw_data)

                      raw_text = raw_data.decode('utf-8', errors='ignore')

                      # 【パターンA】時刻(HH:MM)に近接する小数値を抽出 (10.0〜45.0の範囲)
                      time_matches = re.findall(r'\b\d{1,2}:\d{2}\b[\s\S]{1,150}?\b(\d{1,2}\.\d)\b', raw_text)
                      valid_a = [m for m in time_matches if 10.0 <= float(m) <= 45.0]
                      if valid_a:
                          wbgt_val = valid_a[-1]
                          print(f"[MOE Pattern A Success] WBGT: {wbgt_val}")
                          break

                      # 【パターンB】HTMLタグを除去してトークン解析
                      unescaped = html.unescape(raw_text)
                      clean_text = re.sub(r'<[^>]+>', ' ', unescaped)
                      tokens = clean_text.split()

                      found_b = []
                      for i in range(len(tokens) - 1):
                          if re.match(r'^\d{1,2}:\d{2}$', tokens[i]):
                              # 時刻トークンの後ろ3個まで検索
                              for j in range(1, 4):
                                  if i + j < len(tokens):
                                      tok = tokens[i + j]
                                      if re.match(r'^\d{1,2}\.\d$', tok) and 10.0 <= float(tok) <= 45.0:
                                          found_b.append(tok)
                                          break
                      if found_b:
                          wbgt_val = found_b[-1]
                          print(f"[MOE Pattern B Success] WBGT: {wbgt_val}")
                          break

                      # 【パターンC】JS配列やテキスト内の浮動小数点数をフォールバック抽出
                      all_floats = re.findall(r'\b\d{1,2}\.\d\b', raw_text)
                      valid_c = [f for f in all_floats if 10.0 <= float(f) <= 45.0]
                      if valid_c:
                          wbgt_val = valid_c[-1]
                          print(f"[MOE Pattern C Success] WBGT: {wbgt_val}")
                          break

              except Exception as e:
                  print(f"[MOE Warning] Failed to fetch {url}: {e}")

          # ----------------------------------------------------
          # 2. 気温・風速・天気：気象庁アメダス（枚方: 62046）から取得
          # ----------------------------------------------------
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  raw_data = resp.read()
                  if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                      raw_data = gzip.decompress(raw_data)
                  latest_time = raw_data.decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  raw_data = resp.read()
                  if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                      raw_data = gzip.decompress(raw_data)
                  map_data = json.loads(raw_data.decode('utf-8'))
                  hirakata = map_data.get("62046", {})

                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"

                  if "wind" in hirakata and hirakata["wind"] and hirakata["wind"][0] is not None:
                      wind_val = f"{float(hirakata['wind'][0]):.1f}"

                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0

                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"

                  print(f"[JMA Success] Temp: {temp_val}℃, Wind: {wind_val}m/s, Weather: {weather_val}")

          except Exception as e:
              print(f"[JMA Error] {e}")

          # エラーチェック
          if not wbgt_val:
              raise ValueError("WBGT data could not be retrieved from MOE.")
          if not temp_val or not wind_val:
              raise ValueError("Weather data could not be retrieved from JMA Amedas.")

          # ----------------------------------------------------
          # 3. 警戒度判定とJSON出力
          # ----------------------------------------------------
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hirakata WBGT & Weather Data"
            git push
          fi
