name: Hirakata Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          wbgt_val = None
          temp_val = None
          wind_val = None
          weather_val = "晴れ"

          # ----------------------------------------------------
          # 1. WBGT値：環境省（枚方: 62046）から取得
          # ----------------------------------------------------
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62046"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  # 時刻セル直後のWBGT数値(例: 28.5)を抽出
                  matches = re.findall(r'<td>\d{1,2}:\d{2}</td>\s*<td>([\d\.]+)</td>', html)
                  if matches:
                      wbgt_val = matches[-1] # 最新時刻の値
                      print(f"[MOE] WBGT: {wbgt_val}")
          except Exception as e:
              print(f"[MOE Error] {e}")

          # ----------------------------------------------------
          # 2. 気温・風速・天気：気象庁アメダス（枚方: 62046）から取得
          # ----------------------------------------------------
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  latest_time = resp.read().decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  hirakata = map_data.get("62046", {})

                  # 気温
                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"

                  # 風速
                  if "wind" in hirakata and hirakata["wind"] and hirakata["wind"][0] is not None:
                      wind_val = f"{float(hirakata['wind'][0]):.1f}"

                  # 天気判定（降水量 / 日照時間）
                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0

                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"

                  print(f"[JMA] Temp: {temp_val}℃, Wind: {wind_val}m/s, Weather: {weather_val}")

          except Exception as e:
              print(f"[JMA Error] {e}")

          # エラーチェック
          if not wbgt_val:
              raise ValueError("WBGT data could not be retrieved from MOE.")
          if not temp_val or not wind_val:
              raise ValueError("Weather data could not be retrieved from JMA Amedas.")

          # ----------------------------------------------------
          # 3. 警戒度判定とJSON出力
          # ----------------------------------------------------
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hirakata WBGT & Weather Data"
            git push
          fi
