name: Hirakata Official Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "不明"

          # 1. 気象庁アメダスから枚方（62081）の実測データを正しく取得
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  latest_time_str = resp.read().decode('utf-8').strip()
                  # 2026-08-03T12:50:00+09:00 -> 20260803125000
                  dt_jst = datetime.fromisoformat(latest_time_str)
                  formatted_time = dt_jst.strftime("%Y%m%d%H%M00")

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  hirakata = map_data.get("62081", {})

                  # 気温 (°C) -> index 0 が数値
                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"

                  # 湿度 (%) -> index 0 が数値
                  if "humidity" in hirakata and hirakata["humidity"] and hirakata["humidity"][0] is not None:
                      hum_val = str(int(hirakata["humidity"][0]))

                  # 風速 (m/s) -> index 0 が風速数値（※修正箇所: 1は品質フラグのため0を指定）
                  if "wind" in hirakata and hirakata["wind"] and hirakata["wind"][0] is not None:
                      wind_val = f"{float(hirakata['wind'][0]):.1f}"

                  # 天気判定（降水量・日照時間）
                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0
                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"

          except Exception as e:
              print(f"JMA fetch error: {e}")
              raise RuntimeError(f"Failed to fetch real-time weather data from JMA: {e}")

          # 2. 環境省HPから「現在時刻（または直近）」の枚方WBGT値をピンポイント取得
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62081"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')

                  # 時間ごとのテーブル（1時〜24時）から「時間: WBGT値」のペアを抽出
                  hourly_wbgt = {}
                  rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html, re.DOTALL | re.IGNORECASE)
                  for row in rows:
                      h_match = re.search(r'(?:<th>|>)\s*([0-2]?[0-9])\s*(?:時|:00)?\s*(?:</th>|<)', row)
                      v_match = re.search(r'([1-3][0-9]\.[0-9])', row)
                      if h_match and v_match:
                          h = int(h_match.group(1))
                          v = v_match.group(1)
                          if 1 <= h <= 24:
                              hourly_wbgt[h] = v

                  # 現在時刻（例: 12時）の値を取得。無ければ1時間前、それも無ければ最新の発表値を採用
                  cur_hour = dt_jst.hour
                  if cur_hour in hourly_wbgt:
                      wbgt_val = hourly_wbgt[cur_hour]
                  elif (cur_hour - 1) in hourly_wbgt:
                      wbgt_val = hourly_wbgt[cur_hour - 1]
                  else:
                      sorted_hours = sorted(hourly_wbgt.keys())
                      if sorted_hours:
                          wbgt_val = hourly_wbgt[sorted_hours[-1]]

          except Exception as e:
              print(f"MOE fetch error: {e}")
              raise RuntimeError(f"Failed to fetch official WBGT data from MOE: {e}")

          # 取得結果の厳格な存在チェック
          if not temp_val or not hum_val or not wind_val or not wbgt_val:
              raise ValueError(f"Data missing! Temp: {temp_val}, Hum: {hum_val}, Wind: {wind_val}, WBGT: {wbgt_val}")

          # 3. 警戒度の判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # 4. JSON出力
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          git diff --cached --quiet || (git commit -m "Update Hirakata WBGT & Weather Data" && git push)
