name: Hirakata Official Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "不明"

          # 1. 気象庁アメダスから枚方（62081）の実測データを取得 (UTC時間変換対応)
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  latest_time_str = resp.read().decode('utf-8').strip()

                  # JST時刻をUTCに変換（気象庁のJSONファイル名はUTC基準のため）
                  dt_jst = datetime.fromisoformat(latest_time_str)
                  dt_utc = dt_jst.astimezone(timezone.utc)
                  jma_filename = dt_utc.strftime("%Y%m%d%H%M00")

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{jma_filename}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  hirakata = map_data.get("62081", {})

                  # 気温 (°C)
                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"

                  # 湿度 (%)
                  if "humidity" in hirakata and hirakata["humidity"] and hirakata["humidity"][0] is not None:
                      hum_val = str(int(hirakata["humidity"][0]))

                  # 風速 (m/s) ※ index 1が風速
                  if "wind" in hirakata and hirakata["wind"] and len(hirakata["wind"]) > 1 and hirakata["wind"][1] is not None:
                      wind_val = f"{float(hirakata['wind'][1]):.1f}"

                  # 実測値（降水量・日照時間）から天気を判定
                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0
                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"

          except Exception as e:
              print(f"JMA fetch error: {e}")
              raise RuntimeError(f"Failed to fetch real-time weather data from JMA: {e}")

          # 気象データの必須チェック（取得漏れがあればエラー終了）
          if not temp_val or not hum_val or not wind_val:
              raise ValueError("Critical weather data is missing from Hirakata Amedas. Aborting.")

          # 2. 環境省サイトから枚方（62081）の公式WBGT値を取得（最新の測定値を安全取得）
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62081"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')

                  # パターンA: 画面上部のメイン表示（「現在の暑さ指数」付近）
                  hero_match = re.search(r'現在の暑さ指数[\s\S]{0,300}?([1-3]?[0-9]\.[0-9])', html)
                  if hero_match:
                      wbgt_val = hero_match.group(1)
                      print(f"[MOE Hero Match] WBGT: {wbgt_val}")

                  # パターンB: テーブルの実測値（15.0〜40.0の範囲）から「最新の測定値」を採用
                  if not wbgt_val:
                      rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html, re.DOTALL | re.IGNORECASE)
                      valid_wbgt_list = []
                      for row in rows:
                          if re.search(r'\d{1,2}(?:時|:00)', row):
                              vals = re.findall(r'([1-3][0-9]\.[0-9])', row)
                              if vals:
                                  valid_wbgt_list.append(vals[0])

                      if valid_wbgt_list:
                          wbgt_val = valid_wbgt_list[-1]  # 最新（最後）の測定値
                          print(f"[MOE Table Latest Match] WBGT: {wbgt_val}")

                  # パターンC: ページ内の全WBGT候補から最後の有効値を取得
                  if not wbgt_val:
                      all_vals = re.findall(r'([1-3][0-9]\.[0-9])', html)
                      valid_vals = [v for v in all_vals if 15.0 <= float(v) <= 40.0]
                      if valid_vals:
                          wbgt_val = valid_vals[-1]
                          print(f"[MOE Fallback Match] WBGT: {wbgt_val}")

          except Exception as e:
              print(f"MOE fetch error: {e}")
              raise RuntimeError(f"Failed to fetch official WBGT data from MOE: {e}")

          # WBGTデータの必須チェック
          if not wbgt_val:
              raise ValueError("Official WBGT data could not be retrieved from MOE. Aborting.")

          # 3. 警戒度の判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # 4. JSON出力
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON successfully:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          git diff --cached --quiet || (git commit -m "Update Hirakata WBGT & Weather Data" && git push)
