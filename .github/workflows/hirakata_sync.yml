name: Hirakata Sync

on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch Official Data and Generate JSON
        run: |
          # 1. WBGT & アメダス実測データ取得（堅牢・自動リトライ・フォールバック付き）
          python - << 'EOF'
          import urllib.request
          import gzip
          import json
          import re
          import html
          import time
          from datetime import datetime, timezone, timedelta

          def fetch_text(url, timeout=7, retries=3):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  "Accept-Encoding": "gzip, deflate"
              }
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          raw = resp.read()
                          if resp.headers.get('Content-Encoding') == 'gzip' or raw[:2] == b'\x1f\x8b':
                              raw = gzip.decompress(raw)
                          return raw.decode('utf-8', errors='ignore')
                  except Exception as e:
                      print(f"[Retry {attempt+1}/{retries}] {url} failed: {e}")
                      time.sleep(1)
              return None

          # 万が一失敗した際のための前回データ読み込み
          old_data = {}
          try:
              with open("hirakata_wbgt.json", "r", encoding="utf-8") as f:
                  old_data = json.load(f)
          except Exception:
              pass

          wbgt_val = None
          temp_val = None
          wind_val = None
          weather_val = old_data.get("weather", "晴れ")

          # WBGT取得
          moe_urls = [
              "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62046",
              "https://www.wbgt.env.go.jp/graph_ref_td.php?region=07&prefecture=62&point=62046"
          ]
          for url in moe_urls:
              raw_text = fetch_text(url)
              if raw_text:
                  time_matches = re.findall(r'\b\d{1,2}:\d{2}\b[\s\S]{1,150}?\b(\d{1,2}\.\d)\b', raw_text)
                  valid_a = [m for m in time_matches if 10.0 <= float(m) <= 45.0]
                  if valid_a:
                      wbgt_val = valid_a[-1]
                      break

          # アメダス取得
          latest_time_raw = fetch_text("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt")
          if latest_time_raw:
              formatted_time = re.sub(r'[-:+T]', '', latest_time_raw.strip())[:14]
              map_json_str = fetch_text(f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json")
              if map_json_str:
                  try:
                      map_data = json.loads(map_json_str)
                      hirakata = map_data.get("62046", {})
                      if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                          temp_val = f"{float(hirakata['temp'][0]):.1f}"
                      if "wind" in hirakata and hirakata["wind"] and hirakata["wind"][0] is not None:
                          wind_val = f"{float(hirakata['wind'][0]):.1f}"
                      
                      precip = hirakata.get("precipitation10m", [0])[0] or 0
                      sun = hirakata.get("sun10m", [0])[0] or 0
                      if precip >= 0.5: weather_val = "雨"
                      elif sun >= 0.1: weather_val = "晴れ"
                      else: weather_val = "くもり"
                  except Exception as e:
                      print(f"[JMA JSON Error] {e}")

          # フォールバック処理（通信が全全全滅しても前回の値を使って時刻を更新しサイネージを生存させる）
          wbgt_val = wbgt_val or old_data.get("wbgt", "26.0")
          temp_val = temp_val or old_data.get("temperature", "30.0")
          wind_val = wind_val or old_data.get("wind_speed", "2.0")

          w = float(wbgt_val)
          level = "危険" if w >= 31.0 else "厳重警戒" if w >= 28.0 else "警戒" if w >= 25.0 else "留意" if w >= 21.0 else "ほぼ安全"
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }
          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print("Successfully updated hirakata_wbgt.json")
          EOF

          # 2. 3日間天気予報（Open-Meteo API版）
          python - << 'EOF'
          import urllib.request
          import json
          import time
          from datetime import datetime

          URL = "https://api.open-meteo.com/v1/forecast?latitude=34.8136&longitude=135.6492&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3"
          WEEK_DAYS = ["月", "火", "水", "木", "金", "土", "日"]

          def parse_wmo_code(code):
              if code in [0, 1]: return "晴れ", "☀️"
              elif code == 2: return "晴れ / くもり", "⛅"
              elif code == 3: return "くもり", "☁️"
              elif code in [45, 48]: return "霧", "🌫️"
              elif code in [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]: return "雨", "🌧️"
              elif code in [71, 73, 75, 77, 85, 86]: return "雪", "☃️"
              elif code in [95, 96, 99]: return "雷雨", "⛈️"
              return "晴れ", "☀️"

          data = None
          for _ in range(3):
              try:
                  req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=7) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      break
              except Exception as e:
                  time.sleep(1)

          if data:
              daily = data.get("daily", {})
              times = daily.get("time", [])
              codes = daily.get("weather_code", [])
              t_maxs = daily.get("temperature_2m_max", [])
              t_mins = daily.get("temperature_2m_min", [])
              pops = daily.get("precipitation_probability_max", [])

              forecasts = []
              for i in range(min(3, len(times))):
                  dt = datetime.strptime(times[i], "%Y-%m-%d")
                  date_str = f"{dt.month}/{dt.day} ({WEEK_DAYS[dt.weekday()]})"
                  weather_text, icon = parse_wmo_code(codes[i] if i < len(codes) else 0)
                  
                  t_max = str(round(t_maxs[i])) if i < len(t_maxs) and t_maxs[i] is not None else None
                  t_min = str(round(t_mins[i])) if i < len(t_mins) and t_mins[i] is not None else None
                  pop = str(pops[i]) if i < len(pops) and pops[i] is not None else "0"

                  forecasts.append({
                      "date_str": date_str,
                      "weather": weather_text,
                      "icon": icon,
                      "pop": pop,
                      "temp_high": t_max,
                      "temp_low": t_min
                  })

              result = {"forecasts": forecasts}
              with open("weather_3days.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print("Successfully updated weather_3days.json")
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json weather_3days.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WBGT and 3-day weather forecast data"
            for i in {1..3}; do
              git push && break || sleep 3
            done
          fi
