name: Hirakata Sync

on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import gzip
          import json
          import re
          import html
          from datetime import datetime, timezone, timedelta

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Encoding": "gzip, deflate"
          }

          jst = timezone(timedelta(hours=9))
          now_jst = datetime.now(jst)
          current_time_str = now_jst.strftime("%H:%M")

          # 1. アメダス実測データの取得（茨木市最寄りの枚方観測所: 62046）
          temp_val = None
          wind_val = None
          weather_val = "くもり"

          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time, timeout=10) as resp:
                  raw_data = resp.read()
                  if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                      raw_data = gzip.decompress(raw_data)
                  latest_time = raw_data.decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map, timeout=10) as resp:
                  raw_data = resp.read()
                  if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                      raw_data = gzip.decompress(raw_data)
                  map_data = json.loads(raw_data.decode('utf-8'))
                  hirakata = map_data.get("62046", {})

                  if "temp" in hirakata and hirakata["temp"] and hirakata["temp"][0] is not None:
                      temp_val = f"{float(hirakata['temp'][0]):.1f}"
                  if "wind" in hirakata and hirakata["wind"] and hirakata["wind"][0] is not None:
                      wind_val = f"{float(hirakata['wind'][0]):.1f}"

                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0
                  if precip >= 0.5: weather_val = "雨"
                  elif sun >= 0.1: weather_val = "晴れ"
                  else: weather_val = "くもり"
          except Exception as e:
              print(f"[JMA Error] {e}")

          # 2. WBGT（暑さ指数）の取得（茨木市最寄りの枚方観測所）
          wbgt_val = None
          moe_urls = [
              "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62046",
              "https://www.wbgt.env.go.jp/graph_ref_td.php?region=07&prefecture=62&point=62046"
          ]

          for url in moe_urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      raw_data = resp.read()
                      if resp.headers.get('Content-Encoding') == 'gzip' or raw_data[:2] == b'\x1f\x8b':
                          raw_data = gzip.decompress(raw_data)
                      raw_text = raw_data.decode('utf-8', errors='ignore')

                      pairs = re.findall(r'\b(\d{1,2}:\d{2})\b[\s\S]{1,100}?\b(\d{1,2}\.\d)\b', raw_text)
                      valid_pairs = []
                      for t_str, val in pairs:
                          try:
                              v = float(val)
                              if 10.0 <= v <= 45.0 and t_str <= current_time_str:
                                  valid_pairs.append((t_str, val))
                          except ValueError:
                              continue

                      if valid_pairs:
                          valid_pairs.sort(key=lambda x: x[0])
                          wbgt_val = valid_pairs[-1][1]
                          break
              except Exception as e:
                  print(f"[MOE Error] {url}: {e}")

          # バックアップ読み込み
          if not wbgt_val:
              try:
                  with open("hirakata_wbgt.json", "r", encoding="utf-8") as f:
                      old = json.load(f)
                      wbgt_val = old.get("wbgt")
              except Exception:
                  pass

          if not wbgt_val:
              wbgt_val = "26.0"

          w = float(wbgt_val)
          level = "危険" if w >= 31.0 else "厳重警戒" if w >= 28.0 else "警戒" if w >= 25.0 else "留意" if w >= 21.0 else "ほぼ安全"
          now_str = now_jst.strftime("%Y-%m-%d %H:%M")

          # 地域表示名を「大阪府茨木市周辺」へ変更（JSONフォーマット・ファイル名は完全維持）
          result = {
              "location": "大阪府茨木市周辺",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val) if temp_val else "--",
              "wind_speed": str(wind_val) if wind_val else "--",
              "weather": str(weather_val),
              "updated_at": now_str
          }
          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          EOF

          # 3. 茨木市ピンポイント3日間天気予報（Open-Meteo API: 緯度34.8160 / 経度135.5680）
          python - << 'EOF'
          import urllib.request
          import json
          from datetime import datetime

          URL = "https://api.open-meteo.com/v1/forecast?latitude=34.8160&longitude=135.5680&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=3"
          WEEK_DAYS = ["月", "火", "水", "木", "金", "土", "日"]

          def parse_wmo_code(code):
              if code in [0, 1]: return "晴れ", "☀️"
              elif code == 2: return "晴れ / くもり", "⛅"
              elif code == 3: return "くもり", "☁️"
              elif code in [45, 48]: return "霧", "🌫️"
              elif code in [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]: return "雨", "🌧️"
              elif code in [71, 73, 75, 77, 85, 86]: return "雪", "☃️"
              elif code in [95, 96, 99]: return "雷雨", "⛈️"
              return "晴れ", "☀️"

          try:
              req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              daily = data.get("daily", {})
              times = daily.get("time", [])
              codes = daily.get("weather_code", [])
              t_maxs = daily.get("temperature_2m_max", [])
              t_mins = daily.get("temperature_2m_min", [])
              pops = daily.get("precipitation_probability_max", [])

              forecasts = []
              for i in range(min(3, len(times))):
                  dt = datetime.strptime(times[i], "%Y-%m-%d")
                  date_str = f"{dt.month}/{dt.day} ({WEEK_DAYS[dt.weekday()]})"
                  weather_text, icon = parse_wmo_code(codes[i] if i < len(codes) else 0)
                  
                  t_max = str(round(t_maxs[i])) if i < len(t_maxs) and t_maxs[i] is not None else None
                  t_min = str(round(t_mins[i])) if i < len(t_mins) and t_mins[i] is not None else None
                  pop = str(pops[i]) if i < len(pops) and pops[i] is not None else "0"

                  forecasts.append({
                      "date_str": date_str,
                      "weather": weather_text,
                      "icon": icon,
                      "pop": pop,
                      "temp_high": t_max,
                      "temp_low": t_min
                  })

              result = {"forecasts": forecasts}
              with open("weather_3days.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
          except Exception as e:
              print(f"[Open-Meteo Error] {e}")
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json weather_3days.json
          if ! git diff --cached --quiet; then
            git commit -m "Update location display to Ibaraki City and adjust forecast coordinates"
            for i in {1..3}; do
              git push && break || sleep 3
            done
          fi
