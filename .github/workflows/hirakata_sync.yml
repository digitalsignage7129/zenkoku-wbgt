name: Hirakata Sync

on:
  schedule:
    # 毎時 3分, 13分, 23分, 33分, 43分, 53分に自動実行
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Official Data and Generate JSON
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone, timedelta

          headers = {"User-Agent": "Mozilla/5.0"}

          wbgt_val = None
          temp_val = None
          hum_val = None
          wind_val = None
          weather_val = "晴れ"

          # 1. 環境省サイトから枚方（62046）の WBGT・気温・湿度・風速 を一括取得
          try:
              moe_url = "https://www.wbgt.env.go.jp/sp/graph_ref_td.php?region=07&prefecture=62&point=62046"
              req = urllib.request.Request(moe_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  
                  # テーブルから最新行の [時刻, WBGT, 気温, 湿度, 風速] を抽出
                  rows = re.findall(r'<tr>\s*<td>\d{1,2}:\d{2}</td>\s*<td>([\d\.]+)</td>\s*<td>([\d\.]+)</td>\s*<td>(\d+)</td>\s*<td>([\d\.]+)</td>', html)
                  if rows:
                      latest = rows[-1] # 直近の最新データ
                      wbgt_val = latest[0]
                      temp_val = latest[1]
                      hum_val = latest[2]
                      wind_val = latest[3]
          except Exception as e:
              print(f"MOE fetch error: {e}")

          # 2. 気象庁アメダスから枚方（62046）の降水・日照データのみ取得して天気を判定
          try:
              req_time = urllib.request.Request("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt", headers=headers)
              with urllib.request.urlopen(req_time) as resp:
                  latest_time = resp.read().decode('utf-8').strip()
                  formatted_time = re.sub(r'[-:+T]', '', latest_time)[:14]

              jma_url = f"https://www.jma.go.jp/bosai/amedas/data/map/{formatted_time}.json"
              req_map = urllib.request.Request(jma_url, headers=headers)
              with urllib.request.urlopen(req_map) as resp:
                  map_data = json.loads(resp.read().decode('utf-8'))
                  hirakata = map_data.get("62046", {})

                  precip = hirakata.get("precipitation10m", [0])[0] or 0
                  sun = hirakata.get("sun10m", [0])[0] or 0

                  if precip >= 0.5:
                      weather_val = "雨"
                  elif sun >= 0.1:
                      weather_val = "晴れ"
                  else:
                      weather_val = "くもり"
          except Exception as e:
              print(f"JMA weather error: {e}")

          # 必須データチェック
          if not wbgt_val or not temp_val or not hum_val or not wind_val:
              raise ValueError(f"Critical data missing: WBGT={wbgt_val}, Temp={temp_val}, Hum={hum_val}, Wind={wind_val}")

          # 警戒度の判定
          w = float(wbgt_val)
          if w >= 31.0:
              level = "危険"
          elif w >= 28.0:
              level = "厳重警戒"
          elif w >= 25.0:
              level = "警戒"
          elif w >= 21.0:
              level = "留意"
          else:
              level = "ほぼ安全"

          # 更新日時の生成（JST）
          jst = timezone(timedelta(hours=9))
          now_str = datetime.now(jst).strftime("%Y-%m-%d %H:%M")

          result = {
              "location": "大阪府枚方市",
              "wbgt": str(wbgt_val),
              "level": level,
              "temperature": str(temp_val),
              "humidity": str(hum_val),
              "wind_speed": str(wind_val),
              "weather": str(weather_val),
              "updated_at": now_str
          }

          with open("hirakata_wbgt.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Generated JSON:", json.dumps(result, ensure_ascii=False))
          EOF

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hirakata_wbgt.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hirakata WBGT & Weather Data"
            git push
          fi
