<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>WBGTマルチサイネージシステム (1920x1080 Ver.)</title>
<style>
/* 1920x1080の固定サイズ・スクロールバー強制非表示 */
html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background-color: #fff;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    overflow: hidden !important;
}

/* スタート画面の最適化 */
#start-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    color: #fff;
}
.start-box {
    text-align: center;
    background: rgba(255, 255, 255, .1);
    padding: 60px 80px;
    border-radius: 24px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .2);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
}
.start-box h2 {
    font-size: 45px;
    margin: 0 0 15px 0;
    font-weight: 900;
    letter-spacing: 2px;
}
.start-box p {
    font-size: 22px;
    color: #cbd5e0;
    margin: 0 0 40px 0;
}
.start-search-container {
    display: flex;
    gap: 15px;
    width: 700px;
}
.start-input {
    flex: 1;
    font-size: 24px;
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    outline: none;
}
.start-btn {
    font-size: 24px;
    padding: 15px 45px;
    background: #3182ce;
    color: #fff;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(49, 130, 206, .4);
    transition: background 0.2s;
}
.start-btn:hover {
    background: #2b6cb0;
}

/* メインウィジェット全体のコンテナ枠 */
.widget-box {
    width: 1920px;
    height: 1080px;
    box-sizing: border-box;
    padding: 25px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden !important;
    background-color: #fff;
}

/* ヘッダーエリア */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 5px solid #edf2f7;
    height: 110px;
}
.header-title-area {
    display: flex;
    flex-direction: column;
}
.header h1 {
    margin: 0;
    font-size: 42px;
    color: #2d3748;
    font-weight: 900;
    line-height: 1.1;
}
.header .sub {
    font-size: 18px;
    color: #4a5568;
    font-weight: bold;
    margin-top: 5px;
}
.search-container {
    display: flex;
    align-items: center;
    gap: 12px;
}
.search-input {
    font-size: 20px;
    padding: 10px 20px;
    border: 3px solid #cbd5e0;
    border-radius: 30px;
    width: 300px;
    font-weight: bold;
    outline: none;
    color: #2d3748;
}
.search-btn {
    font-size: 20px;
    padding: 10px 25px;
    background-color: #3182ce;
    color: #fff;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
}
.weather-icon-txt {
    font-size: 55px;
    font-weight: 900;
    color: #3182ce;
    margin-left: 20px;
}

/* WBGTメインカード（特大表示） */
.wbgt-section {
    background: #2ecc71;
    color: #fff;
    border-radius: 24px;
    text-align: center;
    height: 640px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 0;
    box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
}
.wbgt-label {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 0;
    line-height: 1;
}
.wbgt-display-area {
    display: flex;
    justify-content: center;
    align-items: flex-end; /* 下揃えにして単位と数字のバランスを調整 */
    width: 100%;
    height: 420px;
    margin: 0;
    padding: 0;
}
#wbgt-num {
    font-weight: 900 !important;
    line-height: 0.85 !important;
    letter-spacing: -6px !important;
}
.wbgt-unit {
    font-size: 90px !important;
    font-weight: 900 !important;
    margin-left: 15px;
    margin-bottom: 35px; /* 数字のベースラインに合わせる微調整 */
}
.wbgt-status {
    font-size: 55px;
    font-weight: 900;
    background: rgba(0, 0, 0, .25);
    padding: 10px 120px;
    border-radius: 50px;
    display: inline-block;
    align-self: center;
    letter-spacing: 3px;
    margin: 0;
    line-height: 1.2;
}

/* 気象情報 4カラムグリッド */
.weather-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
    height: 180px;
}
.grid-item {
    background: #f7fafc;
    border: 4px solid #e2e8f0;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}
.grid-label {
    font-size: 26px;
    color: #4a5568;
    font-weight: bold;
    margin-bottom: 8px;
}
.grid-value {
    font-size: 46px;
    font-weight: 900;
    color: #1a202c;
    line-height: 1;
}

/* フッター */
.footer {
    font-size: 18px;
    color: #a0aec0;
    text-align: center;
    border-top: 3px solid #edf2f7;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="start-screen">
    <div class="start-box">
        <h2>WBGT MONITOR SYSTEM</h2>
        <p>設置する地域、または現場名を入力してください</p>
        <div class="start-search-container">
            <input type="text" id="start-input" class="start-input" placeholder="例：加古川市、舞洲、和歌山...">
            <button onclick="initSearch()" class="start-btn">モニター起動</button>
        </div>
        <div id="start-error" style="color:#fc8181;margin-top:20px;font-weight:bold;font-size:18px;"></div>
    </div>
</div>

<div class="widget-box">
    <div class="header">
        <div class="header-title-area">
            <h1 id="location-title">地域情報</h1>
            <div class="sub" id="location-sub">ピンポイント観測情報</div>
        </div>
        <div class="search-container">
            <input type="text" id="panel-search-input" class="search-input" placeholder="地域を変更...">
            <button onclick="panelSearch()" class="search-btn">変更</button>
            <div id="weather-text" class="weather-icon-txt">--</div>
        </div>
    </div>
    <div class="wbgt-section" id="wbgt-card">
        <div class="wbgt-label" id="time-label">現在の暑さ指数 (WBGT)</div>
        <div class="wbgt-display-area"><span id="wbgt-num">--.-</span><span class="wbgt-unit">℃</span></div>
        <div class="wbgt-status" id="wbgt-status">取得中...</div>
    </div>
    <div class="weather-grid">
        <div class="grid-item"><div class="grid-label">気温</div><div class="grid-value" id="cur-temp">--.-℃</div></div>
        <div class="grid-item"><div class="grid-label">湿度</div><div class="grid-value" id="cur-humidity">--%</div></div>
        <div class="grid-item"><div class="grid-label">風速</div><div class="grid-value" id="cur-wind">--.-m/s</div></div>
        <div class="grid-item"><div class="grid-label">降水</div><div class="grid-value" id="cur-pop">--%</div></div>
    </div>
    <div class="footer" id="update-time">Open-Meteo 自動更新</div>
</div>

<script>
let currentLat=null,currentLon=null,currentName="";
function getWeatherText(e){return 0===e?"☀️晴":1===e||2===e||3===e?"⛅晴曇":45===e||48===e?"🌫️霧":51===e||53===e||55===e?"🌧️小雨":61===e||63===e||65===e?"☔雨":71===e||73===e||75===e?"❄️雪":80===e||81===e||82===e?"🌦️雨":95===e||96===e?"⚡雷雨":"☁️曇"}
function getWbgtLevel(e){const t=parseFloat(e);return t>=31?{color:"#e74c3c",text:"危険（運動中止）"}:t>=28?{color:"#e67e22",text:"厳重警戒"}:t>=25?{color:"#f1c40f",text:"警戒"}:t>=21?{color:"#3498db",text:"注意"}:{color:"#2ecc71",text:"ほぼ安全"}}
function calcWbgt(e,t){return.725*e+.0368*t+.00315*e*t-3.2}
async function updateDashboard(){if(!currentLat||!currentLon)return;const e=document.getElementById("wbgt-status"),t=`wbgt_data_${currentLat.toFixed(4)}_${currentLon.toFixed(4)}`,n=localStorage.getItem(t),c=localStorage.getItem(`${t}_time`),r=(new Date).getTime();if(n&&c&&r-c<1800000){renderData(JSON.parse(n));return}const o=`https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&hourly=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=1`;try{const s=await fetch(o);if(!s.ok)throw new Error;const i=await s.json();localStorage.setItem(t,JSON.stringify(i)),localStorage.setItem(`${t}_time`,r),renderData(i)}catch(a){n?(renderData(JSON.parse(n)),e.innerText+=" (オフライン)"):(e.innerText="データ取得失敗")}}

function renderData(e){
    const t=e.hourly,n=new Date;let c=0;for(let r=0;r<t.time.length;r++)if(new Date(t.time[r])>=n){c=r;break}
    const o=t.temperature_2m[c],s=t.relative_humidity_2m[c],i=(t.wind_speed_10m[c]/3.6).toFixed(1),a=t.precipitation_probability[c],l=calcWbgt(o,s).toFixed(1),u=getWeatherText(t.weather_code[c]);
    document.getElementById("location-title").innerText=currentName;
    document.getElementById("weather-text").innerText=u;
    
    // 1920x1080に最適化した固定文字サイズ（340px）に変更
    const d=document.getElementById("wbgt-num");
    d.innerText=l;
    d.style.setProperty("font-size","340px","important");
    
    document.getElementById("cur-temp").innerText=`${o.toFixed(1)}℃`,document.getElementById("cur-humidity").innerText=`${s}%`,document.getElementById("cur-wind").innerText=`${i}m/s`,document.getElementById("cur-pop").innerText=`${a}%`;
    const m=getWbgtLevel(l);document.getElementById("wbgt-card").style.backgroundColor=m.color,document.getElementById("wbgt-status").innerText=m.text;const f=new Date(t.time[c]);document.getElementById("time-label").innerText=`現在（${f.getHours()}:00）の暑さ指数`;const g=new Date;document.getElementById("update-time").innerText=`同期: ${g.getMonth()+1}/${g.getDate()} ${g.getHours()}:${String(g.getMinutes()).padStart(2,"0")}
}

async function executeLocationSearch(e,t=!1){try{const n=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(e)}&count=1&language=ja`,c=await fetch(n),r=await c.json();if(r.results&&r.results.length>0){const o=r.results[0],s=(o.admin1?o.admin1:"")+o.name;if(!t&&!confirm(`「 ${s} 」を取得しました。\nこの場所で間違いありませんか？`))return!1;currentLat=o.latitude,currentLon=o.longitude,currentName=s,localStorage.setItem("saved_wbgt_location",e);const i=window.location.protocol+"//"+window.location.host+window.location.pathname+`?name=${encodeURIComponent(e)}`;return window.history.replaceState({path:i},"",i),document.getElementById("start-screen").style.display="none",await updateDashboard(),!0}return alert(`「${e}」が見つかりませんでした。正しい地域名を入力してください。`),!1}catch(s){return alert("通信エラーが発生しました。"),!1}}
async function initSearch(){const e=document.getElementById("start-input").value.trim();if(e){document.getElementById("start-error").innerText="位置を検索中...";(await executeLocationSearch(e,!1))||(document.getElementById("start-error").innerText="場所が見つからないか、キャンセルされました。")}}
async function panelSearch(){const e=document.getElementById("panel-search-input").value.trim();e&&(await executeLocationSearch(e,!1))&&(document.getElementById("panel-search-input").value="")}
function initSystem(){const e=new URLSearchParams(window.location.search).get("name"),t=localStorage.getItem("saved_wbgt_location");e?executeLocationSearch(e,!0):t?executeLocationSearch(t,!0):document.getElementById("start-screen").style.display="flex"}
document.getElementById("start-input").addEventListener("keypress",function(e){"Enter"===e.key&&initSearch()}),document.getElementById("panel-search-input").addEventListener("keypress",function(e){"Enter"===e.key&&panelSearch()}),initSystem(),setInterval(updateDashboard,600000);
</script>
</body>
</html>
