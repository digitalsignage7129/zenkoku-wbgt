<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>右帯 - 全画面・全環境100%自動フィット版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #05070a;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #ffffff;
      user-select: none;
    }

    body {
      padding: 1vh 2vw;
      display: flex;
      flex-direction: column;
      gap: 1vh;
      width: 100vw;
      height: 100vh;
    }

    /* 各カード共通設定 */
    .card-common {
      width: 100%;
      min-height: 0;
      min-width: 0;
      border-radius: 6px;
      overflow: hidden;
    }

    /* 1. ヘッダー (高さ: 約4.5vh) */
    .header {
      height: 4.5vh;
      background: #111622;
      border: 1.5px solid #1f293d;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 3vw;
      flex-shrink: 0;
    }
    .location-title {
      font-size: clamp(11px, 1.8vh, 16px);
      font-weight: bold;
      color: #00e5ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .update-time {
      font-size: clamp(9px, 1.3vh, 12px);
      color: #8a99ad;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* 2. 熱中症目安 (高さ: 約8.5vh) */
    .wbgt-card {
      height: 8.5vh;
      background: linear-gradient(135deg, #1f1200 0%, #0d0600 100%);
      border: 1.5px solid #ff9900;
      border-radius: 6px;
      padding: 0.6vh 2vw;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }
    .wbgt-head { display: flex; justify-content: space-between; align-items: center; }
    .wbgt-title { font-size: clamp(10px, 1.4vh, 13px); font-weight: bold; color: #ffcc00; }
    .wbgt-status { font-size: clamp(11px, 1.6vh, 14px); font-weight: 900; color: #ff3333; }
    
    .wbgt-meter { display: flex; gap: 3px; height: 0.8vh; min-height: 4px; width: 100%; }
    .meter-seg { flex: 1; border-radius: 2px; opacity: 0.2; }
    .seg-1 { background: #00b0f0; }
    .seg-2 { background: #00b050; }
    .seg-3 { background: #ffc000; }
    .seg-4 { background: #ed7d31; }
    .seg-5 { background: #ff0000; }
    .meter-seg.active { opacity: 1; box-shadow: 0 0 4px currentColor; }

    .wbgt-desc { font-size: clamp(9px, 1.2vh, 11px); color: #cccccc; text-align: right; }

    /* 3. 今日 (flex: 3.8 - 最重要メイン領域) */
    .today-card {
      flex: 3.8;
      background: linear-gradient(180deg, #0f1c2e 0%, #08101c 100%);
      border: 2px solid #00e5ff;
      border-radius: 6px;
      padding: 1vh 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }
    .today-header { display: flex; justify-content: space-between; align-items: center; }
    .today-badge {
      background: #00e5ff;
      color: #000;
      font-size: clamp(10px, 1.4vh, 12px);
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .today-date { font-size: clamp(11px, 1.6vh, 14px); font-weight: bold; color: #ffffff; }

    .today-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      padding: 0.5vh 0;
      min-height: 0;
    }
    .today-icon {
      font-size: clamp(36px, 6vh, 56px);
      line-height: 1;
      width: 25%;
      text-align: center;
      flex-shrink: 0;
    }
    .today-info { text-align: right; flex: 1; min-width: 0; }
    .today-weather {
      font-size: clamp(13px, 2vh, 18px);
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.5vh;
    }
    .today-temps { font-size: clamp(18px, 3vh, 28px); font-weight: 900; line-height: 1; }
    .temp-high { color: #ff4d4d; }
    .temp-low { color: #3399ff; }

    .pop-grid {
      display: flex;
      width: 100%;
      height: 5.5vh;
      min-height: 32px;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
      border: 1px solid #1a293d;
      align-items: center;
      flex-shrink: 0;
    }
    .pop-item { flex: 1; text-align: center; }
    .pop-item-time { font-size: clamp(8px, 1.1vh, 10px); color: #8a99ad; }
    .pop-item-val { font-size: clamp(10px, 1.4vh, 13px); font-weight: bold; color: #00e5ff; margin-top: 1px; }

    /* 4 & 5. 明日・明後日 (flex: 2.2 ずつ配分) */
    .sub-card {
      flex: 2.2;
      background: #0d121c;
      border: 1.5px solid #1f2d42;
      border-radius: 6px;
      padding: 1vh 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }
    .sub-head { display: flex; justify-content: space-between; align-items: center; }
    .sub-label { font-size: clamp(12px, 1.6vh, 15px); font-weight: bold; color: #00e5ff; }
    .sub-date { font-size: clamp(10px, 1.4vh, 12px); color: #8a99ad; }

    .sub-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      padding: 0.3vh 0;
      min-height: 0;
    }
    .sub-icon {
      font-size: clamp(28px, 4.5vh, 40px);
      line-height: 1;
      width: 20%;
      text-align: center;
      flex-shrink: 0;
    }
    .sub-center { text-align: center; flex: 1; padding: 0 4px; min-width: 0; }
    .sub-weather {
      font-size: clamp(12px, 1.7vh, 15px);
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-pop { font-size: clamp(10px, 1.3vh, 12px); color: #00e5ff; font-weight: bold; margin-top: 2px; }
    .sub-temps { text-align: right; flex-shrink: 0; line-height: 1; }
    .sub-temp-high { font-size: clamp(15px, 2.3vh, 20px); font-weight: 900; color: #ff4d4d; }
    .sub-temp-low { font-size: clamp(15px, 2.3vh, 20px); font-weight: 900; color: #3399ff; }
  </style>
</head>
<body>

  <!-- 1. ヘッダー -->
  <div class="header">
    <div class="location-title" id="location-name">読み込み中...</div>
    <div class="update-time" id="updated-at">更新 --:--</div>
  </div>

  <!-- 2. 熱中症目安 -->
  <div class="wbgt-card">
    <div class="wbgt-head">
      <div class="wbgt-title">熱中症目安情報</div>
      <div class="wbgt-status" id="wbgt-status">算出中...</div>
    </div>
    <div class="wbgt-meter">
      <div class="meter-seg seg-1" id="m-1"></div>
      <div class="meter-seg seg-2" id="m-2"></div>
      <div class="meter-seg seg-3" id="m-3"></div>
      <div class="meter-seg seg-4" id="m-4"></div>
      <div class="meter-seg seg-5" id="m-5"></div>
    </div>
    <div class="wbgt-desc" id="wbgt-val">本日予想最高: --℃</div>
  </div>

  <!-- 3. 今日 -->
  <div class="today-card">
    <div class="today-header">
      <div class="today-badge">TODAY</div>
      <div class="today-date" id="date-0">--/-- (-)</div>
    </div>
    <div class="today-main">
      <div class="today-icon" id="icon-0">☀️</div>
      <div class="today-info">
        <div class="today-weather" id="weather-0">--</div>
        <div class="today-temps">
          <span class="temp-high" id="high-0">--℃</span>
          <span style="color:#555; font-size:80%;">/</span>
          <span class="temp-low" id="low-0">--℃</span>
        </div>
      </div>
    </div>
    <div class="pop-grid">
      <div class="pop-item"><div class="pop-item-time">00-06</div><div class="pop-item-val" id="pop-0">--%</div></div>
      <div class="pop-item"><div class="pop-item-time">06-12</div><div class="pop-item-val" id="pop-1">--%</div></div>
      <div class="pop-item"><div class="pop-item-time">12-18</div><div class="pop-item-val" id="pop-2">--%</div></div>
      <div class="pop-item"><div class="pop-item-time">18-24</div><div class="pop-item-val" id="pop-3">--%</div></div>
    </div>
  </div>

  <!-- 4. 明日 -->
  <div class="sub-card">
    <div class="sub-head">
      <div class="sub-label">明日</div>
      <div class="sub-date" id="date-1">--/-- (-)</div>
    </div>
    <div class="sub-body">
      <div class="sub-icon" id="icon-1">⛅</div>
      <div class="sub-center">
        <div class="sub-weather" id="weather-1">--</div>
        <div class="sub-pop" id="sub-pop-1">降水 --%</div>
      </div>
      <div class="sub-temps">
        <span class="sub-temp-high" id="high-1">--℃</span>
        <span style="color:#555; font-size:80%;">/</span>
        <span class="sub-temp-low" id="low-1">--℃</span>
      </div>
    </div>
  </div>

  <!-- 5. 明後日 -->
  <div class="sub-card">
    <div class="sub-head">
      <div class="sub-label">明後日</div>
      <div class="sub-date" id="date-2">--/-- (-)</div>
    </div>
    <div class="sub-body">
      <div class="sub-icon" id="icon-2">🌧️</div>
      <div class="sub-center">
        <div class="sub-weather" id="weather-2">--</div>
      </div>
      <div class="sub-temps">
        <span class="sub-temp-high" id="high-2">--℃</span>
        <span style="color:#555; font-size:80%;">/</span>
        <span class="sub-temp-low" id="low-2">--℃</span>
      </div>
    </div>
  </div>

  <script>
    const CITIES = {
      '4020300': { name: '福岡県久留米市', forecastCode: '400000' },
      '4021700': { name: '福岡県大野城市', forecastCode: '400000' }
    };

    const params = new URLSearchParams(window.location.search);
    const cityCode = params.get('city') || '4020300';
    const cityInfo = CITIES[cityCode] || CITIES['4020300'];

    document.getElementById('location-name').textContent = cityInfo.name;

    function getWeatherIcon(text) {
      if (!text) return '☀️';
      if (text.includes('雨')) return text.includes('晴') ? '🌦️' : '🌧️';
      if (text.includes('雪')) return '❄️';
      if (text.includes('雷')) return '🌩️';
      if (text.includes('くもり') || text.includes('曇')) return text.includes('晴') ? '⛅' : '☁️';
      return '☀️';
    }

    function setWbgtMeter(highTemp) {
      for(let i=1; i<=5; i++) {
        document.getElementById(`m-${i}`).classList.remove('active');
      }
      const statusEl = document.getElementById('wbgt-status');
      const valEl = document.getElementById('wbgt-val');

      if (highTemp === '--') {
        statusEl.textContent = '取得中';
        return;
      }

      const h = parseInt(highTemp);
      valEl.textContent = `本日予想最高: ${h}℃`;

      if (h >= 35) {
        statusEl.textContent = '危険 (運動中止)';
        document.getElementById('m-5').classList.add('active');
      } else if (h >= 31) {
        statusEl.textContent = '厳重警戒';
        document.getElementById('m-4').classList.add('active');
      } else if (h >= 28) {
        statusEl.textContent = '警戒';
        document.getElementById('m-3').classList.add('active');
      } else if (h >= 25) {
        statusEl.textContent = '注意';
        document.getElementById('m-2').classList.add('active');
      } else {
        statusEl.textContent = 'ほぼ安全';
        document.getElementById('m-1').classList.add('active');
      }
    }

    async function fetchJmaForecast() {
      try {
        const url = `https://www.jma.go.jp/bosai/forecast/data/forecast/${cityInfo.forecastCode}.json?t=` + Date.now();
        const res = await fetch(url);
        const data = await res.json();

        const timeSeries = data[0].timeSeries;
        const weatherArea = timeSeries[0].areas[0];
        const popArea = timeSeries[1] ? timeSeries[1].areas[0] : null;
        const tempArea = timeSeries[2].areas[0];

        const now = new Date();
        document.getElementById('updated-at').textContent = '更新 ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

        for (let i = 0; i < 3; i++) {
          const dateObj = new Date(timeSeries[0].timeDefines[i]);
          const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} (${['日','月','火','水','木','金','土'][dateObj.getDay()]})`;
          const wText = weatherArea.weathers[i] ? weatherArea.weathers[i].replace(/ /g, ' ') : '--';

          document.getElementById(`date-${i}`).textContent = dateStr;
          document.getElementById(`weather-${i}`).textContent = wText.split(' ')[0];
          document.getElementById(`icon-${i}`).textContent = getWeatherIcon(wText);

          const high = tempArea.temps[i*2 + 1] || tempArea.temps[i] || '--';
          const low = tempArea.temps[i*2] || '--';
          document.getElementById(`high-${i}`).textContent = high !== '--' ? high + '℃' : '--℃';
          document.getElementById(`low-${i}`).textContent = low !== '--' ? low + '℃' : '--℃';

          if (i === 0) setWbgtMeter(high);
        }

        if (popArea && popArea.pops) {
          for (let p = 0; p < 4; p++) {
            const popVal = popArea.pops[p] !== undefined ? popArea.pops[p] + '%' : '--%';
            document.getElementById(`pop-${p}`).textContent = popVal;
          }
          if (popArea.pops[4] !== undefined) {
            document.getElementById('sub-pop-1').textContent = `降水 ${popArea.pops[4]}%`;
          }
        }

      } catch (e) {
        console.error('天気予報取得エラー:', e);
      }
    }

    fetchJmaForecast();
    setInterval(fetchJmaForecast, 600000);
  </script>
</body>
</html>
