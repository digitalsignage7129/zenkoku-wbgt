<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>右帯 - 天気＆環境情報</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
    }
    body {
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
    }

    /* 拠点ヘッダー */
    .header {
      height: 40px;
      background: #111111;
      border: 1px solid #333333;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .location-title { font-size: 16px; font-weight: bold; color: #00e5ff; }
    .update-time { font-size: 11px; color: #aaaaaa; }

    /* 熱中症目安カード */
    .wbgt-card {
      height: 85px;
      background: #1a0f00;
      border: 2px solid #ff9900;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .wbgt-label { font-size: 12px; color: #ffcc00; font-weight: bold; }
    .wbgt-status { font-size: 20px; font-weight: 900; color: #ff3333; }
    .wbgt-value { font-size: 13px; color: #ffffff; margin-top: 2px; }

    /* 3日間天気カード */
    .day-card {
      flex: 1;
      background: #0a0a0a;
      border: 2px solid #333333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .day-card.today {
      border-color: #00e5ff;
      background: #00121d;
    }

    .day-left { width: 45%; text-align: left; }
    .day-label { font-size: 15px; font-weight: bold; color: #00e5ff; }
    .day-card:not(.today) .day-label { color: #aaaaaa; }
    .day-date { font-size: 13px; color: #ffffff; margin-bottom: 4px; }
    .weather-text { font-size: 14px; font-weight: bold; color: #ffffff; }

    .day-center { width: 25%; text-align: center; }
    .weather-icon { font-size: 42px; line-height: 1; }

    .day-right { width: 30%; text-align: right; }
    .temp-high { font-size: 18px; font-weight: 900; color: #ff3333; }
    .temp-low { font-size: 18px; font-weight: 900; color: #3399ff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="location-title" id="location-name">読み込み中...</div>
    <div class="update-time" id="updated-at">更新 --:--</div>
  </div>

  <div class="wbgt-card">
    <div>
      <div class="wbgt-label">熱中症目安（最高気温より算出）</div>
      <div class="wbgt-status" id="wbgt-status">算出中...</div>
      <div class="wbgt-value" id="wbgt-val">予想最高: --℃</div>
    </div>
    <div style="font-size: 32px;">⚠️</div>
  </div>

  <!-- 今日 -->
  <div class="day-card today">
    <div class="day-left">
      <div class="day-label">【 今日 】</div>
      <div class="day-date" id="date-0">--/--</div>
      <div class="weather-text" id="weather-0">--</div>
    </div>
    <div class="day-center"><div class="weather-icon" id="icon-0">☀️</div></div>
    <div class="day-right">
      <div><span class="temp-high" id="high-0">--℃</span></div>
      <div><span class="temp-low" id="low-0">--℃</span></div>
    </div>
  </div>

  <!-- 明日 -->
  <div class="day-card">
    <div class="day-left">
      <div class="day-label">明日</div>
      <div class="day-date" id="date-1">--/--</div>
      <div class="weather-text" id="weather-1">--</div>
    </div>
    <div class="day-center"><div class="weather-icon" id="icon-1">⛅</div></div>
    <div class="day-right">
      <div><span class="temp-high" id="high-1">--℃</span></div>
      <div><span class="temp-low" id="low-1">--℃</span></div>
    </div>
  </div>

  <!-- 明後日 -->
  <div class="day-card">
    <div class="day-left">
      <div class="day-label">明後日</div>
      <div class="day-date" id="date-2">--/--</div>
      <div class="weather-text" id="weather-2">--</div>
    </div>
    <div class="day-center"><div class="weather-icon" id="icon-2">🌧️</div></div>
    <div class="day-right">
      <div><span class="temp-high" id="high-2">--℃</span></div>
      <div><span class="temp-low" id="low-2">--℃</span></div>
    </div>
  </div>

  <script>
    const CITIES = {
      '4020300': { name: '福岡県久留米市', forecastCode: '400000' },
      '4021700': { name: '福岡県大野城市', forecastCode: '400000' }
    };

    const params = new URLSearchParams(window.location.search);
    const cityCode = params.get('city') || '4020300';
    const cityInfo = CITIES[cityCode] || CITIES['4020300'];

    document.getElementById('location-name').textContent = cityInfo.name;

    function getWeatherIcon(text) {
      if (!text) return '☀️';
      if (text.includes('雨')) return text.includes('晴') ? '🌦️' : '🌧️';
      if (text.includes('雪')) return '❄️';
      if (text.includes('雷')) return '🌩️';
      if (text.includes('くもり') || text.includes('曇')) return text.includes('晴') ? '⛅' : '☁️';
      return '☀️';
    }

    async function fetchJmaForecast() {
      try {
        const url = `https://www.jma.go.jp/bosai/forecast/data/forecast/${cityInfo.forecastCode}.json?t=` + Date.now();
        const res = await fetch(url);
        const data = await res.json();

        const timeSeries = data[0].timeSeries;
        const weatherArea = timeSeries[0].areas[0];
        const tempArea = timeSeries[2].areas[0];

        const now = new Date();
        document.getElementById('updated-at').textContent = '更新 ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

        for (let i = 0; i < 3; i++) {
          const dateObj = new Date(timeSeries[0].timeDefines[i]);
          const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} (${['日','月','火','水','木','金','土'][dateObj.getDay()]})`;
          const wText = weatherArea.weathers[i] ? weatherArea.weathers[i].replace(/ /g, ' ') : '--';

          document.getElementById(`date-${i}`).textContent = dateStr;
          document.getElementById(`weather-${i}`).textContent = wText.split(' ')[0];
          document.getElementById(`icon-${i}`).textContent = getWeatherIcon(wText);

          const high = tempArea.temps[i*2 + 1] || tempArea.temps[i] || '--';
          const low = tempArea.temps[i*2] || '--';
          document.getElementById(`high-${i}`).textContent = high !== '--' ? high + '℃' : '--℃';
          document.getElementById(`low-${i}`).textContent = low !== '--' ? low + '℃' : '--℃';

          if (i === 0 && high !== '--') {
            const hVal = parseInt(high);
            let status = '注意';
            if (hVal >= 35) status = '運動原則中止 (危険)';
            else if (hVal >= 31) status = '厳重警戒 (激しい運動中止)';
            else if (hVal >= 28) status = '警戒 (水分補給)';

            document.getElementById('wbgt-status').textContent = status;
            document.getElementById('wbgt-val').textContent = `本日予想最高: ${high}℃`;
          }
        }

      } catch (e) {
        console.error('天気予報取得エラー:', e);
      }
    }

    fetchJmaForecast();
    setInterval(fetchJmaForecast, 600000); // 10分ごとに更新
  </script>
</body>
</html>
