<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シンプル3日天気</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080b10;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #ffffff;
      user-select: none;
    }

    body {
      padding: 1.5vh 3vw;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
    }

    /* 天気カード（3分割） */
    .weather-card {
      flex: 1;
      background: #111722;
      border: 1px solid #1f2b3e;
      border-radius: 12px;
      padding: 1.5vh 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 今日だけ少し目立たせる（アクセント枠線） */
    .weather-card.today {
      background: linear-gradient(135deg, #132238 0%, #0d1726 100%);
      border: 2px solid #00e5ff;
    }

    /* 左側：日付と曜日 */
    .date-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 28%;
    }
    .day-label {
      font-size: clamp(12px, 1.8vh, 16px);
      font-weight: bold;
      color: #00e5ff;
      margin-bottom: 2px;
    }
    .today .day-label {
      color: #ffcc00;
    }
    .date-text {
      font-size: clamp(14px, 2.2vh, 20px);
      font-weight: 900;
      color: #ffffff;
    }

    /* 中央：天気アイコンと天気名 */
    .weather-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }
    .weather-icon {
      font-size: clamp(32px, 5vh, 48px);
      line-height: 1;
    }
    .weather-name {
      font-size: clamp(13px, 2vh, 18px);
      font-weight: bold;
      color: #ffffff;
    }

    /* 右側：気温 */
    .temp-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(18px, 3vh, 28px);
      font-weight: 900;
      justify-content: flex-end;
      width: 32%;
      white-space: nowrap;
    }
    .temp-high { color: #ff5555; }
    .temp-slash { color: #445566; font-size: 80%; }
    .temp-low { color: #3399ff; }
  </style>
</head>
<body>

  <!-- 今日 -->
  <div class="weather-card today">
    <div class="date-box">
      <div class="day-label" id="label-0">今日</div>
      <div class="date-text" id="date-0">--/-- (-)</div>
    </div>
    <div class="weather-box">
      <div class="weather-icon" id="icon-0">☀️</div>
      <div class="weather-name" id="weather-0">--</div>
    </div>
    <div class="temp-box">
      <span class="temp-high" id="high-0">--℃</span>
      <span class="temp-slash">/</span>
      <span class="temp-low" id="low-0">--℃</span>
    </div>
  </div>

  <!-- 明日 -->
  <div class="weather-card">
    <div class="date-box">
      <div class="day-label" id="label-1">明日</div>
      <div class="date-text" id="date-1">--/-- (-)</div>
    </div>
    <div class="weather-box">
      <div class="weather-icon" id="icon-1">⛅</div>
      <div class="weather-name" id="weather-1">--</div>
    </div>
    <div class="temp-box">
      <span class="temp-high" id="high-1">--℃</span>
      <span class="temp-slash">/</span>
      <span class="temp-low" id="low-1">--℃</span>
    </div>
  </div>

  <!-- 明後日 -->
  <div class="weather-card">
    <div class="date-box">
      <div class="day-label" id="label-2">明後日</div>
      <div class="date-text" id="date-2">--/-- (-)</div>
    </div>
    <div class="weather-box">
      <div class="weather-icon" id="icon-2">🌧️</div>
      <div class="weather-name" id="weather-2">--</div>
    </div>
    <div class="temp-box">
      <span class="temp-high" id="high-2">--℃</span>
      <span class="temp-slash">/</span>
      <span class="temp-low" id="low-2">--℃</span>
    </div>
  </div>

  <script>
    const CITIES = {
      '4020300': { forecastCode: '400000' },
      '4021700': { forecastCode: '400000' }
    };

    const params = new URLSearchParams(window.location.search);
    const cityCode = params.get('city') || '4020300';
    const cityInfo = CITIES[cityCode] || CITIES['4020300'];

    function getWeatherIcon(text) {
      if (!text) return '☀️';
      if (text.includes('雨')) return text.includes('晴') ? '🌦️' : '🌧️';
      if (text.includes('雪')) return '❄️';
      if (text.includes('雷')) return '🌩️';
      if (text.includes('くもり') || text.includes('曇')) return text.includes('晴') ? '⛅' : '☁️';
      return '☀️';
    }

    async function fetchForecast() {
      try {
        const url = `https://www.jma.go.jp/bosai/forecast/data/forecast/${cityInfo.forecastCode}.json?t=` + Date.now();
        const res = await fetch(url);
        const data = await res.json();

        const shortData = data[0];
        const weeklyData = data[1] || null;

        const timeSeriesWeather = shortData.timeSeries[0];
        const timeSeriesTempShort = shortData.timeSeries[2];

        const weatherArea = timeSeriesWeather.areas[0];
        const tempAreaShort = timeSeriesTempShort ? timeSeriesTempShort.areas[0] : null;

        // 週間気温データのマップ作成
        let weeklyTempMap = {};
        if (weeklyData && weeklyData.timeSeries && weeklyData.timeSeries[1]) {
          const wTempTimes = weeklyData.timeSeries[1].timeDefines;
          const wTempArea = weeklyData.timeSeries[1].areas[0];
          for (let k = 0; k < wTempTimes.length; k++) {
            const dateKey = wTempTimes[k].substring(0, 10);
            weeklyTempMap[dateKey] = {
              min: wTempArea.tempsMin && wTempArea.tempsMin[k] !== "" ? wTempArea.tempsMin[k] : null,
              max: wTempArea.tempsMax && wTempArea.tempsMax[k] !== "" ? wTempArea.tempsMax[k] : null
            };
          }
        }

        const now = new Date();
        const firstApiDateStr = timeSeriesWeather.timeDefines[0].substring(0, 10);
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const isEveningShift = (firstApiDateStr !== todayStr);

        // 夕方以降の表示調整（明日・明後日・3日後）
        if (isEveningShift) {
          document.getElementById('label-0').textContent = '明日';
          document.getElementById('label-1').textContent = '明後日';
          document.getElementById('label-2').textContent = '3日後';
        } else {
          document.getElementById('label-0').textContent = '今日';
          document.getElementById('label-1').textContent = '明日';
          document.getElementById('label-2').textContent = '明後日';
        }

        for (let i = 0; i < 3; i++) {
          if (!timeSeriesWeather.timeDefines[i]) continue;

          const dateObj = new Date(timeSeriesWeather.timeDefines[i]);
          const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} (${['日','月','火','水','木','金','土'][dateObj.getDay()]})`;
          
          const year = dateObj.getFullYear();
          const month = String(dateObj.getMonth() + 1).padStart(2, '0');
          const day = String(dateObj.getDate()).padStart(2, '0');
          const localDateKey = `${year}-${month}-${day}`;

          const wText = weatherArea.weathers[i] ? weatherArea.weathers[i].trim() : '--';

          document.getElementById(`date-${i}`).textContent = dateStr;
          document.getElementById(`weather-${i}`).textContent = wText;
          document.getElementById(`icon-${i}`).textContent = getWeatherIcon(wText);

          let high = '--';
          let low = '--';

          const wData = weeklyTempMap[localDateKey];
          if (wData) {
            if (wData.max) high = wData.max;
            if (wData.min) low = wData.min;
          }

          // 気温取得ロジック
          if (i === 0 && !isEveningShift) {
            if (tempAreaShort && tempAreaShort.temps) {
              const temps = tempAreaShort.temps;
              if (temps.length >= 2 && temps[0] !== temps[1]) {
                high = String(Math.max(parseInt(temps[0]), parseInt(temps[1])));
                low = String(Math.min(parseInt(temps[0]), parseInt(temps[1])));
              } else if (temps.length >= 1) {
                high = temps[0];
              }
            }
            // キャッシュ保持
            if (low !== '--') localStorage.setItem(`saved_low_${localDateKey}`, low);
            else {
              const savedLow = localStorage.getItem(`saved_low_${localDateKey}`);
              if (savedLow) low = savedLow;
            }
          } else if (i === 0 && isEveningShift) {
            if (tempAreaShort && tempAreaShort.temps && tempAreaShort.temps.length >= 2) {
              if (low === '--') low = tempAreaShort.temps[0] || '--';
              if (high === '--') high = tempAreaShort.temps[1] || '--';
            }
          } else if (i === 1 && !isEveningShift) {
            if (tempAreaShort && tempAreaShort.temps && tempAreaShort.temps.length >= 4) {
              if (low === '--') low = tempAreaShort.temps[2] || '--';
              if (high === '--') high = tempAreaShort.temps[3] || '--';
            }
          }

          document.getElementById(`high-${i}`).textContent = high !== '--' ? high + '℃' : '--℃';
          document.getElementById(`low-${i}`).textContent = low !== '--' ? low + '℃' : '--℃';
        }

      } catch (e) {
        console.error('天気取得エラー:', e);
      }
    }

    fetchForecast();
    setInterval(fetchForecast, 600000); // 10分ごとに自動更新
  </script>
</body>
</html>
