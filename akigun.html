<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>広島市 下帯サイネージ</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #ffffff;
      user-select: none;
    }
    body {
      padding: 12px;
      display: flex;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      height: 100%;
    }
    .clock-block {
      width: 340px;
      height: 100%;
      background: #11141a;
      border: 2px solid #2a364a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .clock-date { font-size: 22px; color: #9ab0c7; font-weight: bold; }
    .clock-time { font-size: 68px; color: #00e5ff; font-weight: 900; line-height: 1; margin-top: 2px; letter-spacing: -1px; }
    .main-block {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }
    .status-bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .city-badge {
      background: #00e5ff;
      color: #000000;
      font-size: 26px;
      font-weight: 900;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .alert-badge {
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      padding: 0 24px;
      border-radius: 8px;
      background: #007700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alert-badge.advisory { background: #d99b00; color: #000000; }
    .alert-badge.warning { background: #d92626; color: #ffffff; }
    .alert-badge.emergency {
      background: #990099;
      color: #ffffff;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    /* テロップ容器：Container Queryを適用 */
    .ticker-container {
      container-type: inline-size;
      flex: 1;
      min-height: 0;
      background: #0a0d14;
      border: 2px solid #2a364a;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
    }
    /* 流れる文字：GPUアクセラレーション固定 */
    .ticker-text {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      width: max-content;
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;

      will-change: transform;
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }
    /* 60fpsでスムーズに動くCSSアニメーション */
    @keyframes tickerScroll {
      0% {
        transform: translate3d(100cqw, 0, 0);
      }
      100% {
        transform: translate3d(-100%, 0, 0);
      }
    }
  </style>
</head>
<body>
  <div class="clock-block">
    <div class="clock-date" id="clock-date">----/--/-- (-)</div>
    <div class="clock-time" id="clock-time">00:00</div>
  </div>
  <div class="main-block">
    <div class="status-bar">
      <div class="city-badge" id="city-badge">広島市</div>
      <div class="alert-badge" id="alert-badge">気象情報を確認中...</div>
    </div>
    <div class="ticker-container" id="ticker-bg">
      <div class="ticker-text" id="ticker-text">データ取得中...</div>
    </div>
  </div>
  <script>
    // --- 広島市用設定 ---
    // 広島市は政令指定都市のため、気象庁の警報・注意報は「区」単位(class20、7桁)で
    // 別々に発表される(中区3410100/東区3410200/南区3410300/西区3410400/
    // 安佐南区3410500/安佐北区3410600/安芸区3410700/佐伯区3410800)。
    // 設置場所の座標(北緯34.31853, 東経132.54614)を国土地理院の逆ジオコーディングAPIで
    // 照合したところ muniCd=34107(安芸区)・矢野町 と判定されたため、安芸区を採用した
    // (安芸郡そのものではなく、安芸郡に隣接する広島市安芸区でした)。
    // regionCodeには南部(340010、広島市を含む地域予報区分)を設定し、
    // 区単位では出ない種別の注意報(例:雷注意報など)も拾えるようにしている。
    const CITIES = {
      '3410700': { name: '広島県広島市(安芸区)', areaCode: '340000', regionCode: '340010' }
    };
    // 2026-09時点でJMA API解説記事(Qiita)・IIJ社SDK文書・国立情報学研究所
    // 警報データベースの3資料を突き合わせて検証した正しいコード対応表。
    const WARNING_CODES = {
      '02': { name: '暴風雪警報', type: 'warning' },
      '03': { name: '大雨警報', type: 'warning' },
      '04': { name: '洪水警報', type: 'warning' },
      '05': { name: '暴風警報', type: 'warning' },
      '06': { name: '大雪警報', type: 'warning' },
      '07': { name: '波浪警報', type: 'warning' },
      '08': { name: '高潮警報', type: 'warning' },
      '09': { name: '土砂災害警報', type: 'warning' },
      '10': { name: '大雨注意報', type: 'advisory' },
      '12': { name: '大雪注意報', type: 'advisory' },
      '13': { name: '風雪注意報', type: 'advisory' },
      '14': { name: '雷注意報', type: 'advisory' },
      '15': { name: '強風注意報', type: 'advisory' },
      '16': { name: '波浪注意報', type: 'advisory' },
      '17': { name: '融雪注意報', type: 'advisory' },
      '18': { name: '洪水注意報', type: 'advisory' },
      '19': { name: '高潮注意報', type: 'advisory' },
      '20': { name: '濃霧注意報', type: 'advisory' },
      '21': { name: '乾燥注意報', type: 'advisory' },
      '22': { name: 'なだれ注意報', type: 'advisory' },
      '23': { name: '低温注意報', type: 'advisory' },
      '24': { name: '霜注意報', type: 'advisory' },
      '25': { name: '着氷注意報', type: 'advisory' },
      '26': { name: '着雪注意報', type: 'advisory' },
      '27': { name: 'その他の注意報', type: 'advisory' },
      '29': { name: '土砂災害注意報', type: 'advisory' },
      '32': { name: '暴風雪特別警報', type: 'emergency' },
      '33': { name: '大雨特別警報', type: 'emergency' },
      '35': { name: '暴風特別警報', type: 'emergency' },
      '36': { name: '大雪特別警報', type: 'emergency' },
      '37': { name: '波浪特別警報', type: 'emergency' },
      '38': { name: '高潮特別警報', type: 'emergency' },
      '39': { name: '土砂災害特別警報', type: 'emergency' },
      '43': { name: '大雨危険警報', type: 'warning' },
      '48': { name: '高潮危険警報', type: 'warning' },
      '49': { name: '土砂災害危険警報', type: 'warning' }
    };
    // URLパラメータなしの場合は「広島市安芸区(3410700)」をデフォルトに指定
    const params = new URLSearchParams(window.location.search);
    const cityCode = params.get('city') || '3410700';
    const cityInfo = CITIES[cityCode] || CITIES['3410700'];
    document.getElementById('city-badge').textContent = cityInfo.name;
    function updateClock() {
      const now = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('clock-date').textContent = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
      document.getElementById('clock-time').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
    let currentText = '';
    function startTicker(text) {
      if (currentText === text) return;
      currentText = text;
      const el = document.getElementById('ticker-text');
      el.textContent = text;
      // 1文字あたり約0.38秒の滑らかなスピード調整
      const duration = Math.max(12, text.length * 0.38 + 6);
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = `tickerScroll ${duration}s linear infinite`;
    }
    startTicker(`【${cityInfo.name}】気象庁から最新データを取得しています...`);
    async function fetchJmaWarnings() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
      try {
        // 2026年5月末にJMAが警報・注意報JSONの配信方式を変更した(旧URL
        // .../data/warning/{code}.json は更新が止まった凍結データを返し続ける)。
        // 現在の正しいエンドポイントは .../data/r8/{code}.json で、スキーマも
        // areaTypes/areas/warnings → warning.class10Items/class20Items/kinds に
        // 変わっている。また応答は「直近複数回分の発表(レポート)」の配列であり、
        // 必ずしも新しい順に並んでいないため、reportDatetimeが最も新しいものを
        // 現在の状態として採用する。
        const url = `https://www.jma.go.jp/bosai/warning/data/r8/${cityInfo.areaCode}.json?t=` + Date.now();
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTPエラー');
        const data = await res.json();
        const reports = Array.isArray(data) ? data : [data];
        const sorted = [...reports].sort((a, b) => new Date(b.reportDatetime) - new Date(a.reportDatetime));
        const latest = sorted[0] || {};
        const warningData = latest.warning || {};
        const itemGroups = [warningData.class20Items || [], warningData.class10Items || []];
        let activeWarnings = [];
        let maxLevel = 'none';
        // 市区町村コード(cityCode)に加えて一次細分区域コード(regionCode、設定されていれば)も
        // 突き合わせる。JMAは警報種別によって、市区町村単位ではなく一次細分区域単位でしか
        // statusを持たないことがあるため(例: 雷注意報)。
        const matchCodes = [String(cityCode)];
        if (cityInfo.regionCode) matchCodes.push(String(cityInfo.regionCode));
        for (const items of itemGroups) {
          for (const item of items) {
            if (matchCodes.includes(String(item.areaCode))) {
              for (const k of item.kinds || []) {
                if (k.status === "発表" || k.status === "継続") {
                  const master = WARNING_CODES[k.code];
                  if (master && !activeWarnings.includes(master.name)) {
                    activeWarnings.push(master.name);
                    if (master.type === 'emergency') maxLevel = 'emergency';
                    else if (master.type === 'warning' && maxLevel !== 'emergency') maxLevel = 'warning';
                    else if (master.type === 'advisory' && maxLevel === 'none') maxLevel = 'advisory';
                  }
                }
              }
            }
          }
        }
        const badgeEl = document.getElementById('alert-badge');
        badgeEl.className = 'alert-badge';
        if (activeWarnings.length === 0) {
          badgeEl.textContent = '警報・注意報：発表なし';
          startTicker(`【${cityInfo.name}】現在、警報・注意報は発表されていません。本日もご安全にお過ごしください。`);
        } else {
          badgeEl.classList.add(maxLevel);
          const titleMap = {
            'emergency': '【特別警報発表中】',
            'warning': '【気象警報発表中】',
            'advisory': '【気象注意報発表中】'
          };
          badgeEl.textContent = titleMap[maxLevel] + ' ' + activeWarnings.join('・');
          startTicker(`【${titleMap[maxLevel]}】${cityInfo.name}に「${activeWarnings.join('、')}」が発表されています。最新の気象・防災情報に注意してください。`);
        }
      } catch (e) {
        clearTimeout(timeoutId);
        console.error('気象警報取得エラー:', e);
        document.getElementById('alert-badge').textContent = '警報・注意報：発表なし';
        startTicker(`【${cityInfo.name}】現在、警報・注意報は発表されていません。本日もご安全にお過ごしください。`);
      }
    }
    fetchJmaWarnings();
    setInterval(fetchJmaWarnings, 600000);
  </script>
</body>
</html>
