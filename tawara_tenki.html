<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- Viewportを端末固定にして勝手な自動拡大を防止 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>奈良県田原本町 3日間天気予報</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    /* 全体コンテナを絶対値 558px * 424px でピクセル固定 */
    html, body {
      width: 558px !important;
      height: 424px !important;
      min-width: 558px !important;
      min-height: 424px !important;
      max-width: 558px !important;
      max-height: 424px !important;
      overflow: hidden !important;
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      user-select: none;
    }

    body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 1. ヘッダー (固定高: 32px) */
    .header {
      height: 32px;
      width: 542px; /* 558 - 8*2 */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      background-color: #111111;
      border-radius: 4px;
      border: 1px solid #333333;
      flex-shrink: 0;
    }
    .location-name {
      font-size: 14px;
      font-weight: 900;
      color: #00e5ff;
    }
    .update-time {
      font-size: 11px;
      color: #aaaaaa;
    }

    /* 2. 3日間コンテナ (固定高: 370px, 幅: 542px) */
    .forecast-container {
      width: 542px;
      height: 370px;
      display: flex; /* gridの押し出し事故を防ぐため flex で 170px * 3 に均等割り */
      justify-content: space-between;
      align-items: stretch;
    }

    /* 各カードの幅を 174px に完全固定（174 * 3 + 間隔 = 542px） */
    .card {
      width: 174px;
      height: 370px;
      background-color: #050505;
      border: 1px solid #444444;
      border-radius: 6px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      flex-shrink: 0; /* 縮小破綻を防止 */
    }

    .card.today {
      border: 2px solid #00e5ff;
      background-color: #00121d;
    }

    /* 日付表示 */
    .date-box {
      width: 100%;
      height: 42px;
      border-bottom: 1px solid #333333;
    }
    .date-label {
      font-size: 14px;
      font-weight: 900;
      color: #00e5ff;
    }
    .card:not(.today) .date-label {
      color: #aaaaaa;
    }
    .date-val {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 1px;
    }

    /* 天気アイコン ＆ テキスト (固定高: 150px) */
    .weather-box {
      width: 100%;
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .weather-icon {
      font-size: 44px;
      height: 50px;
      line-height: 50px;
    }
    .weather-text {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 6px;
      line-height: 1.2;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis; /* テキスト長大化による突き破りを防止 */
    }

    /* 降水確率 (固定高: 32px) */
    .pop-box {
      width: 100%;
      height: 32px;
      background-color: #002233;
      border: 1px solid #0088cc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pop-val {
      font-size: 14px;
      font-weight: 900;
      color: #00ffff;
    }

    /* 気温エリア (固定高: 48px) */
    .temp-box {
      width: 100%;
      height: 48px;
      background-color: #111111;
      border: 1px solid #222222;
      border-radius: 4px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .temp-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .temp-title {
      font-size: 10px;
      font-weight: bold;
      color: #888888;
    }
    .temp-val-high {
      font-size: 14px;
      font-weight: 900;
      color: #ff3333;
    }
    .temp-val-low {
      font-size: 14px;
      font-weight: 900;
      color: #3399ff;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="location-name" id="location-name">奈良県田原本町</div>
    <div class="update-time" id="updated-at">更新: --:--</div>
  </div>

  <div class="forecast-container">
    <!-- Day 1 -->
    <div class="card today" id="card-day1">
      <div class="date-box">
        <div class="date-label" id="label-day1">【 今日 】</div>
        <div class="date-val" id="date-day1">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day1">☀️</div>
        <div class="weather-text" id="weather-day1">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day1">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day1">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day1">--℃</span>
        </div>
      </div>
    </div>

    <!-- Day 2 -->
    <div class="card" id="card-day2">
      <div class="date-box">
        <div class="date-label" id="label-day2">明日</div>
        <div class="date-val" id="date-day2">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day2">⛅</div>
        <div class="weather-text" id="weather-day2">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day2">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day2">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day2">--℃</span>
        </div>
      </div>
    </div>

    <!-- Day 3 -->
    <div class="card" id="card-day3">
      <div class="date-box">
        <div class="date-label" id="label-day3">明後日</div>
        <div class="date-val" id="date-day3">--/-- (-)</div>
      </div>
      <div class="weather-box">
        <div class="weather-icon" id="icon-day3">🌧️</div>
        <div class="weather-text" id="weather-day3">--</div>
      </div>
      <div class="pop-box">
        <div class="pop-val" id="pop-day3">☔ --%</div>
      </div>
      <div class="temp-box">
        <div class="temp-group">
          <span class="temp-title">最高</span>
          <span class="temp-val-high" id="temphigh-day3">--℃</span>
        </div>
        <div class="temp-group">
          <span class="temp-title">最低</span>
          <span class="temp-val-low" id="templow-day3">--℃</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getWeatherIcon(weatherText) {
      if (!weatherText || weatherText === '--') return '☀️';
      if (weatherText.includes('雨')) {
        if (weatherText.includes('晴')) return '🌦️';
        return '🌧️';
      }
      if (weatherText.includes('雪')) return '❄️';
      if (weatherText.includes('雷')) return '🌩️';
      if (weatherText.includes('くもり') || weatherText.includes('曇')) {
        if (weatherText.includes('晴')) return '⛅';
        return '☁️';
      }
      return '☀️';
    }

    async function loadWeather() {
      try {
        const response = await fetch('tawaramoto_tenki.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        document.getElementById('location-name').textContent = data.location || '奈良県田原本町';
        document.getElementById('updated-at').textContent = '更新: ' + (data.updated_at || '--');

        const keys = ['day1', 'day2', 'day3'];
        keys.forEach((key) => {
          const dayData = data[key];
          if (!dayData) return;

          // JSエラーによる途中で更新が止まる事故を完全ガード
          const labelEl = document.getElementById(`label-${key}`);
          const dateEl = document.getElementById(`date-${key}`);
          if (labelEl) labelEl.textContent = dayData.label || '--';
          if (dateEl) dateEl.textContent = dayData.date || '--/--';

          const weatherEl = document.getElementById(`weather-${key}`);
          const iconEl = document.getElementById(`icon-${key}`);
          if (weatherEl) weatherEl.textContent = dayData.weather || '--';
          if (iconEl) iconEl.textContent = getWeatherIcon(dayData.weather);

          const popEl = document.getElementById(`pop-${key}`);
          if (popEl) {
            const popVal = (dayData.pop && dayData.pop !== '--') ? `${dayData.pop}%` : '--%';
            popEl.textContent = `☔ ${popVal}`;
          }

          const highEl = document.getElementById(`temphigh-${key}`);
          const lowEl = document.getElementById(`templow-${key}`);
          if (highEl) {
            highEl.textContent = (dayData.temp_max && dayData.temp_max !== '--') ? `${dayData.temp_max}℃` : '--℃';
          }
          if (lowEl) {
            lowEl.textContent = (dayData.temp_min && dayData.temp_min !== '--') ? `${dayData.temp_min}℃` : '--℃';
          }
        });
      } catch (error) {
        console.error('データ読み込み失敗:', error);
      }
    }

    loadWeather();
    setInterval(loadWeather, 60000);
  </script>
</body>
</html>
