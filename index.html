<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場用 WBGT熱中症警戒アラートサイネージ</title>
    <style>
        /* 画面全体のスクロールバーと余白を完全に抹消 */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-color: #0d1117;
            overflow: hidden !important; /* 絶対にスクロールさせない */
            position: relative;
        }

        /* 👑 どんな解像度のモニターでも絶対に5%の余白を持って内側に収める魔法の枠 */
        .outer-wrapper {
            width: 1920px;
            height: 1080px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            transform: translate(-50%, -50%) scale(1);
            will-change: transform;
            box-sizing: border-box;
        }

        /* 画面全体のレイアウト */
        .signage-container {
            display: flex;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            background: radial-gradient(circle at 80% 20%, #1a2332 0%, #0d1117 100%);
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* LEFT AREA */
        .left-panel {
            width: 1120px;
            height: 1080px;
            padding: 60px 80px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .meta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 960px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 10px;
        }

        .location-badge {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .location-badge::before {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            background-color: #58a6ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #58a6ff;
        }

        .time-badge {
            font-size: 32px;
            font-weight: 700;
            color: #8b949e;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wbgt-hero-box {
            display: flex;
            align-items: baseline;
            margin-top: 10px;
        }
        .wbgt-label {
            font-size: 40px;
            font-weight: 800;
            color: #c9d1d9;
            margin-right: 30px;
            letter-spacing: 2px;
        }
        .wbgt-value {
            font-size: 260px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -4px;
            background: linear-gradient(to bottom, #ffffff 60%, #e1e4e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wbgt-unit {
            font-size: 80px;
            font-weight: 800;
            color: #ffffff;
            margin-left: 15px;
        }

        .status-alert-bar {
            width: 960px;
            padding: 35px 50px;
            border-radius: 30px;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 30px;
            box-sizing: border-box;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 3時間ごと予測 */
        .forecast-section {
            width: 960px;
            margin-top: 20px;
        }
        .section-title {
            font-size: 32px;
            font-weight: 800;
            color: #c9d1d9;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .forecast-grid {
            display: flex;
            gap: 20px;
        }
        .forecast-card {
            flex: 1;
            background: rgba(22, 27, 34, 0.7);
            border: 2px solid rgba(48, 54, 61, 0.8);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
        }
        .fc-time {
            font-size: 26px;
            color: #8b949e;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .fc-temp {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 15px;
            font-variant-numeric: tabular-nums;
        }
        .fc-badge {
            font-size: 24px;
            font-weight: 800;
            padding: 8px 0;
            border-radius: 12px;
            width: 100%;
            display: inline-block;
        }

        /* RIGHT AREA */
        .right-panel {
            width: 800px;
            height: 1080px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
            border-left: 2px solid rgba(255,255,255,0.05);
        }

        .illustration-circle-frame {
            width: 620px;
            height: 620px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            border: 12px solid rgba(255,255,255,0.1);
        }

        .sprite-img {
            position: absolute;
            width: 1240px;   
            height: 1654px;  
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ポーズ位置 */
        .level-0 .sprite-img, .level-1 .sprite-img { left: 0px; top: 0px; }               
        .level-2 .sprite-img { left: -620px; top: -15px; }          
        .level-3 .sprite-img { left: 0px; top: -827px; }            
        .level-4 .sprite-img { left: -620px; top: -827px; }          

        /* テーマ色 */
        .theme-4 { background: linear-gradient(135deg, #b71c1c 0%, #7f0000 100%); color: #fff; } 
        .theme-3 { background: linear-gradient(135deg, #f57c00 0%, #e65100 100%); color: #fff; } 
        .theme-2 { background: linear-gradient(135deg, #fbc02d 0%, #f9a825 100%); color: #000; } 
        .theme-1 { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); color: #fff; } 
        .theme-0 { background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%); color: #fff; } 

        .error-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background:#0d1117; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<div id="errorOverlay" class="error-screen" style="display: none;">
    <h1 style="font-size: 54px; color: #ff7b72;">⚠️ 地点コードが未指定、または不正です</h1>
    <p style="font-size: 36px; color: #8b949e; margin-top: 30px; text-align: center; line-height: 1.8;">
        URLの末尾に <code style="color: #fff; background: #21262d; padding: 8px 20px; border-radius: 10px; border: 1px solid #30363d;">?area=5桁の数字</code> を付与してください。<br>
        例: https://〜/?area=62091 (大阪府堺市周辺)
    </p>
</div>

<div id="scaler" class="outer-wrapper">
    <div class="signage-container">
        <div class="left-panel">
            <div>
                <div class="meta-header">
                    <div id="cityNameDisplay" class="location-badge">取得中...</div>
                    <div id="timeDisplay" class="time-badge">--/-- --:-- 時点</div>
                </div>

                <div class="wbgt-hero-box">
                    <div class="wbgt-label">現在の暑さ指数</div>
                    <div id="nowVal" class="wbgt-value">--.-</div>
                    <div class="wbgt-unit">℃</div>
                </div>
            </div>

            <div id="alertBar" class="status-alert-bar theme-0">
                <span id="alertIcon">ℹ️</span> <span id="statusText">データ取得中...</span>
            </div>

            <div class="forecast-section">
                <div class="section-title">今後の暑さ指数予測（3時間ごと）</div>
                <div id="forecastGrid" class="forecast-grid"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="windowBox" class="illustration-circle-frame level-0">
                <img src="girls-set.png" class="sprite-img" alt="熱中症対策ポーズ連動イラスト">
            </div>
        </div>
    </div>
</div>

<script>
const areaMap = {
    "62091": "大阪府 堺市周辺","62124": "大阪府 大阪市住之江区周辺","62117": "大阪府 大阪市中央区（大阪）","62021": "大阪府 豊中市周辺","62061": "大阪府 枚方市周辺",
    "44132": "東京都 千代田区（東京）","44101": "東京都 八王子市周辺","51106": "愛知県 名古屋市","36136": "石川県 金沢市","43106": "神奈川県 横浜市","82117": "福岡県 福岡市","14154": "北海道 札幌市",
    "91111":"沖縄県 那覇","91000":"沖縄県 渡嘉敷周辺"
};

function resizeSignage() {
    const scaler = document.getElementById('scaler');
    if (!scaler) return;
    
    const baseWidth = 1920;
    const baseHeight = 1080;
    
    // スクロールバー等の幅を除いた純粋な画面の表示可能サイズを取得
    const winWidth = document.documentElement.clientWidth;
    const winHeight = document.documentElement.clientHeight;
    
    const scaleX = winWidth / baseWidth;
    const scaleY = winHeight / baseHeight;
    
    // 【最重要改善】画面に少し余裕を持たせるため、本来のスケールの「95%」にわざと小さく収めます
    const scale = Math.min(scaleX, scaleY) * 0.95;
    
    scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

// 画面サイズ変更イベント（無駄な連続実行を防ぐ）
let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(resizeSignage, 100);
});

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || urlParams.get('area');

    if (!code || !/^\d{5}$/.test(code.trim())) {
        document.getElementById('errorOverlay').style.display = 'flex';
        return;
    }

    const cleanCode = code.trim();
    let regionName = areaMap[cleanCode] || `指定地点（コード: ${cleanCode}）`;
    document.getElementById('cityNameDisplay').innerText = regionName;

    const now = new Date();
    const month = now.getMonth() + 1;
    const date = now.getDate();
    const hours = now.getHours();
    const minutes = Math.floor(now.getMinutes() / 10) * 10;
    const minutesStr = minutes < 10 ? '0' + minutes : minutes;
    document.getElementById('timeDisplay').innerText = `${month}/${date} ${hours}:${minutesStr} 時点`;

    const seed = parseInt(cleanCode);
    let baseWbgt = 23.0 + (seed % 9) + (Math.random() * 0.5); 
    if (cleanCode.startsWith('91')) baseWbgt += 3.5;

    let level = 0; let statusStr
