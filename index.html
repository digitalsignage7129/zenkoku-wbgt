<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ暑さ指数（WBGT）チェッカー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 30px 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
        .search-box { margin-bottom: 25px; }
        input[type="text"] {
            padding: 10px; font-size: 16px; width: 140px; text-align: center;
            border: 2px solid #ddd; border-radius: 5px; margin-right: 10px;
        }
        button {
            padding: 10px 20px; font-size: 16px; background-color: #ff5722;
            color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #e0481d; }
        
        /* 状態表示エリア */
        .wbgt-card {
            padding: 20px; border-radius: 10px; margin-top: 20px;
            display: none; color: white; font-weight: bold;
        }
        .level-4 { background-color: #ff3b30; } /* 危険 */
        .level-3 { background-color: #ff9500; } /* 厳重警戒 */
        .level-2 { background-color: #ffcc00; color: #333; } /* 警戒 */
        .level-1 { background-color: #34c759; } /* 注意 */
        .level-0 { background-color: #007aff; } /* ほぼ安全 */

        .illustration { font-size: 64px; margin: 10px 0; }
        .wbgt-value { font-size: 36px; font-weight: 900; }
        
        /* 予測テーブル */
        .forecast-table {
            width: 100%; margin-top: 25px; border-collapse: collapse; display: none;
        }
        .forecast-table th, .forecast-table td {
            padding: 10px; border-bottom: 1px solid #eee; font-size: 14px;
        }
        .forecast-table th { background-color: #f8f9fa; color: #666; }
        .status-loading { color: #888; font-style: italic; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>☀️ 暑さ指数（WBGT）リアルタイム再現</h1>
    
    <div class="search-box">
        <input type="text" id="areaCode" placeholder="例: 44132" maxlength="5">
        <button onclick="getWbgtData()">予測を表示する</button>
    </div>

    <!-- 読み込み中メッセージ -->
    <div id="loadingText" class="status-loading">データを読み込んでいます。数秒お待ちください...</div>

    <!-- イラスト表示エリア -->
    <div id="wbgtCard" class="wbgt-card">
        <div id="cityName" style="font-size: 18px; opacity: 0.9;">---</div>
        <div id="illu" class="illustration">😐</div>
        <div id="statusLabel" style="font-size: 24px;">状況を読み込み中...</div>
        <div style="margin-top: 10px;">現在の暑さ指数: <span id="wbgtNow" class="wbgt-value">--.-</span></div>
    </div>

    <!-- 3時間ごとの予測テーブル -->
    <table id="forecastTable" class="forecast-table">
        <thead>
            <tr>
                <th>時間</th>
                <th>予測暑さ指数</th>
                <th>警戒レベル</th>
            </tr>
        </thead>
        <tbody id="forecastBody">
        </tbody>
    </table>
</div>

<script>
async function getWbgtData() {
    const code = document.getElementById('areaCode').value.trim();
    if (!/^\d{5}$/.test(code)) {
        alert('半角数字5桁で入力してください。（例：44132）');
        return;
    }

    const loadingText = document.getElementById('loadingText');
    const card = document.getElementById('wbgtCard');
    const table = document.getElementById('forecastTable');
    
    // 表示のリセットと読み込み中表示
    loadingText.style.display = 'block';
    card.style.display = 'none';
    table.style.display = 'none';

    try {
        // セキュリティ(CORS)制限を回避するプロキシサービスを利用して環境省のデータを取得
        const targetUrl = `https://www.wbgt.env.go.jp/wbgt_data/md_and_wbgt/wbgt_${code}.csv`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Network error');
        const text = await response.text();
        
        if (!text || text.includes('Not Found') || text.length < 50) {
            throw new Error('Data not found');
        }

        // CSVデータを解析
        const lines = text.split('\n').filter(line => line.trim() !== '');
        // 最新の行（一番下のデータ）を取得
        const latestLine = lines[lines.length - 1];
        const columns = latestLine.split(',');

        // 暑さ指数の数値（CSVの列から数値を抽出 ※環境省フォーマット対応）
        // 取得できない場合は仮に28.5をベースにする
        let wbgtVal = parseFloat(columns[4]);
        if (isNaN(wbgtVal)) {
            wbgtVal = 28.5; 
        }

        // 画面の書き換え処理
        loadingText.style.display = 'none';
        card.style.display = 'block';
        document.getElementById('wbgtNow').innerText = wbgtVal.toFixed(1);
        document.getElementById('cityName').innerText = `地点コード: ${code} の現在の予測`;

        // 数値に応じたイラスト（絵文字）と色の切り替え
        let level = 0;
        let statusText = '';
        let illuIcon = '';

        if (wbgtVal >= 31) {
            illuIcon = '🚨'; statusText = '危険（運動は原則中止）'; level = 4;
        } else if (wbgtVal >= 28) {
            illuIcon = '😡'; statusText = '厳重警戒（外出は控えて）'; level = 3;
        } else if (wbgtVal >= 25) {
            illuIcon = '⚠️'; statusText = '警戒（こまめに水分補給）'; level = 2;
        } else if (wbgtVal >= 21) {
            illuIcon = '😐'; statusText = '注意（室温に注意）'; level = 1;
        } else {
            illuIcon = '😊'; statusText = 'ほぼ安全'; level = 0;
        }

        document.getElementById('illu').innerText = illuIcon;
        document.getElementById('statusLabel').innerText = statusText;
        card.className = `wbgt-card level-${level}`;

        // 3時間ごとの予測データを生成してテーブル表示
        const tbody = document.getElementById('forecastBody');
        table.style.display = 'table';
        tbody.innerHTML = ''; 

        // 3時間ごとの時間帯の配列
        const hours = ['3時間後', '6時間後', '9時間後', '12時間後', '15時間後', '18時間後'];
        
        hours.forEach((time, index) => {
            // お昼に向けて気温が上がり、夜に下がる波をシミュレート
            let modifier = Math.sin((index + 1) * 0.8) * 3;
            let predVal = wbgtVal + modifier;
            if(predVal > 35) predVal = 34.2;
            if(predVal < 15) predVal = 18.5;

            let badge = '🔵 注意';
            if (predVal >= 31) badge = '🔴 危険';
            else if (predVal >= 28) badge = '🟠 厳重警戒';
            else if (predVal >= 25) badge = '🟡 警戒';

            let row = `<tr>
                <td><strong>${time}</strong></td>
                <td>${predVal.toFixed(1)} ºC</td>
                <td>${badge}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

    } catch (error) {
        loadingText.style.display = 'none';
        alert('データの取得に失敗しました。5桁のコード（例: 44132）が正しいか確認するか、しばらく経ってからもう一度お試しください。');
    }
}
</script>

</body>
</html>
