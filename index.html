<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場用 WBGT熱中症警戒アラートサイネージ</title>
    <style>
        /* 1920x1080 に完全固定（スクロールバー非表示） */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #000; /* 画面焼き付き防止 */
            color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            overflow: hidden;
        }

        .signage-container {
            display: flex;
            width: 1920px;
            height: 1080px;
        }

        /* 左側：現在のリアルタイムステータス */
        .main-card {
            width: 1050px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.5s ease;
        }

        .location-title {
            font-size: 50px;
            font-weight: 900;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 50px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* グラフィック表示エリア */
        .illustration-box {
            width: 500px;
            height: 500px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff; /* イラストが映える白背景 */
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }
        
        .illustration-box svg {
            width: 100%;
            height: 100%;
        }

        .status-label {
            font-size: 76px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 4px 4px 12px rgba(0,0,0,0.7);
            margin-top: 30px;
        }

        .value-display {
            font-size: 46px;
            margin-top: 30px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 15px 40px;
            border-radius: 15px;
        }
        .wbgt-number {
            font-size: 110px;
            font-weight: 900;
        }

        /* 右側：3時間ごとの推移予測 */
        .forecast-side {
            width: 870px;
            height: 1080px;
            background-color: #141414;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px;
            box-sizing: border-box;
            border-left: 4px solid #222;
        }

        .side-title {
            font-size: 46px;
            font-weight: 900;
            border-left: 15px solid #ffeb3b;
            padding-left: 25px;
            margin-bottom: 60px;
            color: #fff;
            letter-spacing: 2px;
        }

        .forecast-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            margin-bottom: 25px;
            padding: 25px 40px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .time-label {
            font-size: 38px;
            font-weight: bold;
            color: #ddd;
        }

        .val-label {
            font-size: 46px;
            font-weight: 900;
        }

        .badge-label {
            font-size: 36px;
            font-weight: 900;
            padding: 12px 0;
            border-radius: 12px;
            color: #fff;
            width: 240px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 現場用高コントラスト配色 */
        .bg-level-4 { background-color: #b71c1c; } /* 危険：深紅 */
        .bg-level-3 { background-color: #e65100; } /* 厳重警戒：オレンジ */
        .bg-level-2 { background-color: #fbc02d; color: #000; } /* 警戒：黄 */
        .bg-level-1 { background-color: #1b5e20; } /* 注意：緑 */
        .bg-level-0 { background-color: #0d47a1; } /* ほぼ安全：紺 */

        .badge-4 { background-color: #d32f2f; }
        .badge-3 { background-color: #f57c00; }
        .badge-2 { background-color: #fbc02d; color: #000; }
        .badge-1 { background-color: #2e7d32; }
        .badge-0 { background-color: #1565c0; }

        /* イラスト内のパーツ表示切り替え（初期値は非表示） */
        .part-sun, .part-bottle, .part-sweat, .part-dizzy, .part-shade, .part-smile {
            display: none;
        }

        /* エラー画面 */
        .error-screen {
            position: fixed; top:0; left:0; width:1920px; height:1080px;
            background:#111; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<div id="errorOverlay" class="error-screen" style="display: none;">
    <h1 style="font-size: 54px; color: #ff3b30;">⚠️ 地点コードが未指定、または不正です</h1>
    <p style="font-size: 36px; color: #ccc; margin-top: 30px; text-align: center; line-height: 1.8;">
        URLの末尾に <code style="color: #fff; background: #333; padding: 5px 20px; border-radius: 10px;">?code=5桁の数字</code> を付与してください。<br>
        例: https://〜/?code=62124 (大阪市住之江区周辺)
    </p>
</div>

<div class="signage-container">
    <div id="mainCard" class="main-card bg-level-0">
        <div id="cityNameDisplay" class="location-title">計測地域：設定中...</div>
        
        <div class="illustration-box">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <circle cx="200" cy="230" r="150" fill="#f5f5f5" />

                <g class="part-sun">
                    <circle cx="80" cy="80" r="25" fill="#ff9100" />
                    <path d="M80 45 L80 35 M80 115 L80 125 M45 80 L35 80 M115 80 L125 80 M55 55 L48 48 M105 105 L112 112 M55 105 L48 112 M105 55 L112 48" stroke="#ff9100" stroke-width="5" stroke-linecap="round" />
                </g>

                <path d="M200 130 C250 130, 270 180, 260 220 C240 220, 230 180, 200 180" fill="#111" />
                <path d="M255 185 C290 200, 300 240, 280 270 C265 250, 255 220, 255 185" fill="#111" />

                <path d="M130 380 C130 310, 270 310, 270 380" fill="#b3e5fc" stroke="#111" stroke-width="6" stroke-linejoin="round" />
                
                <path d="M175 260 Q200 310 225 260 Z" fill="#fcd8c4" stroke="#111" stroke-width="6" stroke-linejoin="round" />
                <circle cx="200" cy="210" r="55" fill="#fcd8c4" stroke="#111" stroke-width="6" />

                <path d="M145 200 C160 170, 240 170, 255 200 C240 180, 160 180, 145 200" fill="#111" />
                <path d="M145 195 L150 240 L158 240 Z" fill="#111" />
                <path d="M255 195 L250 240 L242 240 Z" fill="#111" />

                <g class="part-smile">
                    <path d="M175 210 Q185 205 190 212" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <path d="M210 210 Q215 205 225 212" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <path d="M190 235 Q200 250 210 235" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" />
                </g>

                <g class="part-bottle">
                    <path d="M175 215 Q185 220 190 212" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <path d="M210 215 Q215 220 225 212" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <path d="M170 225 Q180 235 190 225" fill="none" stroke="#e57373" stroke-width="8" opacity="0.4" stroke-linecap="round" />
                    <path d="M140 330 Q110 240 205 235" fill="none" stroke="#111" stroke-width="26" stroke-linecap="round" />
                    <path d="M140 330 Q110 240 205 235" fill="none" stroke="#fcd8c4" stroke-width="18" stroke-linecap="round" />
                    <rect x="200" y="215" width="65" height="30" rx="5" fill="#b3e5fc" stroke="#111" stroke-width="5" transform="rotate(-30 200 215)" />
                    <rect x="255" y="200" width="15" height="18" fill="#0288d1" stroke="#111" stroke-width="4" transform="rotate(-30 255 200)" />
                </g>

                <g class="part-shade">
                    <path d="M170 195 Q180 190 190 198" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <path d="M210 198 Q220 190 230 195" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <circle cx="180" cy="215" r="4" fill="#111" />
                    <circle cx="220" cy="215" r="4" fill="#111" />
                    <path d="M192 235 Q200 228 208 235" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                    <path d="M150 195 Q200 215 250 195 L250 220 Q200 240 150 220 Z" fill="#e57373" opacity="0.3" />
                    <path d="M270 320 Q280 170 190 165" fill="none" stroke="#111" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M270 320 Q280 170 190 165" fill="none" stroke="#fcd8c4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
                </g>

                <g class="part-dizzy">
                    <path d="M170 215 Q180 205 185 220 Q175 225 172 212" fill="none" stroke="#111" stroke-width="4" />
                    <path d="M215 215 Q225 205 228 220 Q218 225 215 212" fill="none" stroke="#111" stroke-width="4" />
                    <path d="M190 245 Q200 235 210 245" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" />
                    <path d="M150 190 L250 190 L250 225 L150 225 Z" fill="#b0bec5" opacity="0.4" /> <path d="M130 330 Q120 170 185 170" fill="none" stroke="#111" stroke-width="26" stroke-linecap="round" />
                    <path d="M130 330 Q120 170 185 170" fill="none" stroke="#fcd8c4" stroke-width="18" stroke-linecap="round" />
                </g>

                <g class="part-sweat">
                    <path d="M165 225 Q163 235 165 240 M235 220 Q233 230 235 235 M195 255 Q193 265 195 270" fill="none" stroke="#29b6f6" stroke-width="4" stroke-linecap="round" />
                    <path d="M140 260 Q135 270 138 275 M250 315 Q245 325 248 330" fill="none" stroke="#29b6f6" stroke-width="4" stroke-linecap="round" />
                </g>
            </svg>
        </div>

        <div id="statusText" class="status-label">安全確認中</div>
        <div class="value-display">
            現在の暑さ指数(WBGT)：<span id="nowVal" class="wbgt-number">--.-</span> <span style="font-size: 40px;">℃</span>
        </div>
    </div>

    <div class="forecast-side">
        <div class="side-title">今後の暑さ指数予測（3時間ごと）</div>
        <div id="forecastContainer">
            </div>
    </div>
</div>

<script>
// 地域マスター（環境省コード対応）
const areaMap = {
    "62124": "大阪府 大阪市住之江区周辺",
    "62117": "大阪府 大阪市中央区（大阪）",
    "44132": "東京都 千代田区（東京）",
    "51106": "愛知県 名古屋市",
    "36136": "石川県 金沢市",
    "43106": "神奈川県 横浜市",
    "82117": "福岡県 福岡市",
    "14154": "北海道 札幌市"
};

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (!code || !/^\d{5}$/.test(code.trim())) {
        document.getElementById('errorOverlay').style.display = 'flex';
        return;
    }

    const cleanCode = code.trim();
    const regionName = areaMap[cleanCode] || `地点コード: ${cleanCode}`;
    document.getElementById('cityNameDisplay').innerText = `測定地域：${regionName}`;

    // 数値シミュレーション
    const seed = parseInt(cleanCode);
    const baseWbgt = 23.5 + (seed % 9) + (Math.random() * 0.4); 

    let level = 0;
    let statusStr = '';

    // すべてのイラストパーツを一度非表示にする関数
    const hideAllParts = () => {
        document.querySelector('.part-smile').style.display = 'none';
        document.querySelector('.part-bottle').style.display = 'none';
        document.querySelector('.part-shade').style.display = 'none';
        document.querySelector('.part-dizzy').style.display = 'none';
        document.querySelector('.part-sun').style.display = 'none';
        document.querySelector('.part-sweat').style.display = 'none';
    };

    hideAllParts();

    // レベル判定と、イラスト内部のパーツの出し分け処理
    if (baseWbgt >= 31) {
        statusStr = '危 険（作業は原則中止）'; level = 4;
        document.querySelector('.part-dizzy').style.display = 'block';
        document.querySelector('.part-sun').style.display = 'block';
        document.querySelector('.part-sweat').style.display = 'block';
    } else if (baseWbgt >= 28) {
        statusStr = '厳重警戒（厳重な熱中症対策を）'; level = 3;
        document.querySelector('.part-shade').style.display = 'block';
        document.querySelector('.part-sun').style.display = 'block';
        document.querySelector('.part-sweat').style.display = 'block';
    } else if (baseWbgt >= 25) {
        statusStr = '警 戒（定期的な水分・塩分補給）'; level = 2;
        document.querySelector('.part-bottle').style.display = 'block';
    } else if (baseWbgt >= 21) {
        statusStr = '注 意（こまめな給水を推奨）'; level = 1;
        document.querySelector('.part-smile').style.display = 'block';
    } else {
        statusStr = 'ほぼ安全（通常通り作業可能）'; level = 0;
        document.querySelector('.part-smile').style.display = 'block';
    }

    document.getElementById('nowVal').innerText = baseWbgt.toFixed(1);
    document.getElementById('statusText').innerText = statusStr;
    document.getElementById('mainCard').className = `main-card bg-level-${level}`;

    // 右側予測エリア
    const container = document.getElementById('forecastContainer');
    container.innerHTML = '';

    const timeSteps = ['3時間後予測', '6時間後予測', '9時間後予測', '12時間後予測'];
    timeSteps.forEach((time, index) => {
        let wave = Math.sin(((index + 1) / timeSteps.length) * Math.PI) * 3.2;
        let predVal = baseWbgt + wave - (index * 0.5);
        
        if(predVal > 34.8) predVal = 34.3;
        if(predVal < 18.0) predVal = 19.2;

        let badgeText = '注意';
        let lv = 1;
        if (predVal >= 31) { badgeText = '🚨 危険'; lv = 4; }
        else if (predVal >= 28) { badgeText = '⚠️ 厳重警戒'; lv = 3; }
        else if (predVal >= 25) { badgeText = '🥤 警戒'; lv = 2; }
        else if (predVal < 21) { badgeText = '✅ 安全'; lv = 0; }

        let rowHtml = `
            <div class="forecast-row">
                <div class="time-label">${time}</div>
                <div class="val-label" style="color: ${lv === 2 ? '#fbc02d' : '#fff'}">${predVal.toFixed(1)} ℃</div>
                <div class="badge-label badge-${lv}">${badgeText}</div>
            </div>
        `;
        container.innerHTML += rowHtml;
    });
};
</script>

</body>
</html>
