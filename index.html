<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場用 WBGT熱中症警戒アラートサイネージ</title>
    <style>
        /* 1920x1080 に完全固定（スクロールバー非表示） */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #000; /* 画面焼き付き防止 */
            color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            overflow: hidden;
        }

        .signage-container {
            display: flex;
            width: 1920px;
            height: 1080px;
        }

        /* 左側：現在のリアルタイムステータス */
        .main-card {
            width: 1050px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.5s ease;
            position: relative;
        }

        .location-title {
            font-size: 50px;
            font-weight: 900;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 50px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* グラフィック埋め込みエリア */
        .illustration-box {
            width: 450px;
            height: 450px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .illustration-box svg {
            width: 100%;
            height: 100%;
        }

        .status-label {
            font-size: 76px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 4px 4px 12px rgba(0,0,0,0.7);
            margin-top: 10px;
        }

        .value-display {
            font-size: 46px;
            margin-top: 30px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 15px 40px;
            border-radius: 15px;
        }
        .wbgt-number {
            font-size: 110px;
            font-weight: 900;
        }

        /* 右側：3時間ごとの推移予測 */
        .forecast-side {
            width: 870px;
            height: 1080px;
            background-color: #141414;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px;
            box-sizing: border-box;
            border-left: 4px solid #222;
        }

        .side-title {
            font-size: 46px;
            font-weight: 900;
            border-left: 15px solid #ffeb3b;
            padding-left: 25px;
            margin-bottom: 60px;
            color: #fff;
            letter-spacing: 2px;
        }

        .forecast-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            margin-bottom: 25px;
            padding: 25px 40px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .time-label {
            font-size: 38px;
            font-weight: bold;
            color: #ddd;
        }

        .val-label {
            font-size: 46px;
            font-weight: 900;
        }

        .badge-label {
            font-size: 36px;
            font-weight: 900;
            padding: 12px 0;
            border-radius: 12px;
            color: #fff;
            width: 240px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 現場用高コントラスト配色 */
        .bg-level-4 { background-color: #b71c1c; } /* 危険：深紅 */
        .bg-level-3 { background-color: #e65100; } /* 厳重警戒：オレンジ */
        .bg-level-2 { background-color: #fbc02d; color: #000; } /* 警戒：黄 */
        .bg-level-1 { background-color: #1b5e20; } /* 注意：緑 */
        .bg-level-0 { background-color: #0d47a1; } /* ほぼ安全：紺 */

        .badge-4 { background-color: #d32f2f; }
        .badge-3 { background-color: #f57c00; }
        .badge-2 { background-color: #fbc02d; color: #000; }
        .badge-1 { background-color: #2e7d32; }
        .badge-0 { background-color: #1565c0; }

        /* 警戒度によるイラスト内の汗やシグナルの制御用CSS */
        .sweat { display: none; fill: #64b5f6; }
        .alert-sign { display: none; }
        
        .level-3-active .sweat { display: block; } /* 厳重警戒で汗表示 */
        .level-4-active .sweat { display: block; } /* 危険で大汗表示 */
        .level-4-active .alert-sign { display: block; } /* 危険でアラートマーク表示 */

        /* エラー画面 */
        .error-screen {
            position: fixed; top:0; left:0; width:1920px; height:1080px;
            background:#111; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<div id="errorOverlay" class="error-screen" style="display: none;">
    <h1 style="font-size: 54px; color: #ff3b30;">⚠️ 地点コードが未指定、または不正です</h1>
    <p style="font-size: 36px; color: #ccc; margin-top: 30px; text-align: center; line-height: 1.8;">
        URLの末尾に <code style="color: #fff; background: #333; padding: 5px 20px; border-radius: 10px;">?code=5桁の数字</code> を付与してください。<br>
        例: https://〜/?code=62124 (大阪市住之江区周辺)
    </p>
</div>

<div class="signage-container">
    <div id="mainCard" class="main-card bg-level-0">
        <div id="cityNameDisplay" class="location-title">計測地域：設定中...</div>
        
        <div id="illustrationBox" class="illustration-box">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <circle cx="200" cy="200" r="180" fill="rgba(255,255,255,0.15)" />
                
                <path d="M120 380 C120 310, 280 310, 280 380" fill="#cfd8dc" stroke="#263238" stroke-width="6" />
                <path d="M160 315 L200 360 L240 315" fill="#eceff1" stroke="#263238" stroke-width="4" />
                
                <circle cx="250" cy="230" r="35" fill="#111" />
                <path d="M245 250 C270 280, 280 320, 260 340 C240 320, 240 280, 245 250" fill="#111" />
                <circle cx="235" cy="215" r="10" fill="#0288d1" /> <path d="M170 250 Q200 320 230 250 Z" fill="#fcd8c4" stroke="#263238" stroke-width="6" />
                <circle cx="195" cy="210" r="55" fill="#fcd8c4" stroke="#263238" stroke-width="6" />
                
                <path d="M135 190 C135 110, 255 110, 255 190 Z" fill="#fbc02d" stroke="#263238" stroke-width="6" />
                <path d="M125 190 C125 185, 265 185, 265 190 C265 195, 125 195, 125 190" fill="#fbc02d" stroke="#263238" stroke-width="6" />
                <rect x="180" y="125" width="30" height="55" rx="5" fill="#f9a825" />
                
                <path d="M148 205 L195 265 L232 210" fill="none" stroke="#37474f" stroke-width="5" />

                <path d="M165 200 Q175 195 180 202" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                <path d="M205 198 Q210 193 220 198" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" />
                <circle cx="165" cy="215" r="12" fill="#ff8a80" opacity="0.5" />
                <circle cx="215" cy="212" r="12" fill="#ff8a80" opacity="0.5" />

                <path d="M130 240 L170 220 L180 235 L140 255 Z" fill="#b3e5fc" stroke="#263238" stroke-width="5" />
                <rect x="168" y="215" width="15" height="12" transform="rotate(-25 168 215)" fill="#0288d1" />
                <path d="M110 350 Q110 270 145 245" fill="none" stroke="#fcd8c4" stroke-width="24" stroke-linecap="round" />
                <path d="M110 350 Q110 270 145 245" fill="none" stroke="#263238" stroke-width="30" stroke-linecap="round" style="z-index:-1" />
                <path d="M110 350 Q110 270 145 245" fill="none" stroke="#cfd8dc" stroke-width="20" stroke-linecap="round" />

                <g class="alert-sign">
                    <polygon points="320,100 360,170 280,170" fill="#d32f2f" stroke="#fff" stroke-width="4"/>
                    <text x="320" y="155" font-family="sans-serif" font-size="45" font-weight="bold" fill="#fff" text-anchor="middle">!</text>
                </g>

                <circle class="sweat" cx="185" cy="185" r="4" />
                <circle class="sweat" cx="152" cy="225" r="5" />
                <circle class="sweat" cx="210" cy="235" r="4" />
                <path class="sweat" d="M185 185 Q183 195 185 200" fill="none" stroke="#64b5f6" stroke-width="3" stroke-linecap="round"/>
                <path class="sweat" d="M210 235 Q208 245 210 250" fill="none" stroke="#64b5f6" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <div id="statusText" class="status-label">安全確認中</div>
        <div class="value-display">
            現在の暑さ指数(WBGT)：<span id="nowVal" class="wbgt-number">--.-</span> <span style="font-size: 40px;">℃</span>
        </div>
    </div>

    <div class="forecast-side">
        <div class="side-title">今後の暑さ指数予測（3時間ごと）</div>
        <div id="forecastContainer">
            </div>
    </div>
</div>

<script>
// 地域マスター
const areaMap = {
    "62124": "大阪府 大阪市住之江区周辺",
    "62117": "大阪府 大阪市中央区（大阪）",
    "44132": "東京都 千代田区（東京）",
    "51106": "愛知県 名古屋市",
    "36136": "石川県 金沢市",
    "43106": "神奈川県 横浜市",
    "82117": "福岡県 福岡市",
    "14154": "北海道 札幌市"
};

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (!code || !/^\d{5}$/.test(code.trim())) {
        document.getElementById('errorOverlay').style.display = 'flex';
        return;
    }

    const cleanCode = code.trim();
    const regionName = areaMap[cleanCode] || `地点コード: ${cleanCode}`;
    document.getElementById('cityNameDisplay').innerText = `測定地域：${regionName}`;

    // 数値シミュレーションロジック
    const seed = parseInt(cleanCode);
    const baseWbgt = 23.5 + (seed % 9) + (Math.random() * 0.4); 

    let level = 0;
    let statusStr = '';
    const illuBox = document.getElementById('illustrationBox');

    // 数値に応じて画面カラー、警告テキスト、イラスト内の汗などのエフェクトを連動
    if (baseWbgt >= 31) {
        statusStr = '危 険（作業は原則中止）'; level = 4;
        illuBox.className = "illustration-box level-4-active";
    } else if (baseWbgt >= 28) {
        statusStr = '厳重警戒（厳重な熱中症対策を）'; level = 3;
        illuBox.className = "illustration-box level-3-active";
    } else if (baseWbgt >= 25) {
        statusStr = '警 戒（定期的な水分・塩分補給）'; level = 2;
        illuBox.className = "illustration-box level-2-active";
    } else if (baseWbgt >= 21) {
        statusStr = '注 意（こまめな給水を推奨）'; level = 1;
        illuBox.className = "illustration-box level-1-active";
    } else {
        statusStr = 'ほぼ安全（通常通り作業可能）'; level = 0;
        illuBox.className = "illustration-box level-0-active";
    }

    document.getElementById('nowVal').innerText = baseWbgt.toFixed(1);
    document.getElementById('statusText').innerText = statusStr;
    document.getElementById('mainCard').className = `main-card bg-level-${level}`;

    // 右側：予測テーブルの生成
    const container = document.getElementById('forecastContainer');
    container.innerHTML = '';

    const timeSteps = ['3時間後予測', '6時間後予測', '9時間後予測', '12時間後予測'];
    timeSteps.forEach((time, index) => {
        let wave = Math.sin(((index + 1) / timeSteps.length) * Math.PI) * 3.2;
        let predVal = baseWbgt + wave - (index * 0.5);
        
        if(predVal > 34.8) predVal = 34.3;
        if(predVal < 18.0) predVal = 19.2;

        let badgeText = '注意';
        let lv = 1;
        if (predVal >= 31) { badgeText = '🚨 危険'; lv = 4; }
        else if (predVal >= 28) { badgeText = '⚠️ 厳重警戒'; lv = 3; }
        else if (predVal >= 25) { badgeText = '🥤 警戒'; lv = 2; }
        else if (predVal < 21) { badgeText = '✅ 安全'; lv = 0; }

        let rowHtml = `
            <div class="forecast-row">
                <div class="time-label">${time}</div>
                <div class="val-label" style="color: ${lv === 2 ? '#fbc02d' : '#fff'}">${predVal.toFixed(1)} ℃</div>
                <div class="badge-label badge-${lv}">${badgeText}</div>
            </div>
        `;
        container.innerHTML += rowHtml;
    });
};
</script>

</body>
</html>
