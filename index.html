<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暑さ指数（WBGT）リアルタイムシミュレーター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 30px 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
        .search-box { margin-bottom: 25px; }
        input[type="text"] {
            padding: 10px; font-size: 16px; width: 160px; text-align: center;
            border: 2px solid #ddd; border-radius: 5px; margin-right: 10px;
        }
        button {
            padding: 10px 20px; font-size: 16px; background-color: #009688;
            color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #00796b; }
        
        /* 状態表示エリア */
        .wbgt-card {
            padding: 20px; border-radius: 10px; margin-top: 20px;
            display: none; color: white; font-weight: bold;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .level-4 { background-color: #ff3b30; } /* 危険 */
        .level-3 { background-color: #ff9500; } /* 厳重警戒 */
        .level-2 { background-color: #ffcc00; color: #333; } /* 警戒 */
        .level-1 { background-color: #34c759; } /* 注意 */
        .level-0 { background-color: #007aff; } /* ほぼ安全 */

        .illustration { font-size: 72px; margin: 15px 0; }
        .wbgt-value { font-size: 42px; font-weight: 900; }
        
        /* 予測テーブル */
        .forecast-table {
            width: 100%; margin-top: 25px; border-collapse: collapse; display: none;
        }
        .forecast-table th, .forecast-table td {
            padding: 12px; border-bottom: 1px solid #eee; font-size: 14px;
        }
        .forecast-table th { background-color: #f8f9fa; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>☀️ 暑さ指数（WBGT）再現モニター</h1>
    
    <div class="search-box">
        <input type="text" id="areaCode" placeholder="5桁コードを入力" maxlength="5">
        <button onclick="generateWbgtDisplay()">予測を表示する</button>
    </div>

    <!-- イラスト・シミュレーション表示エリア -->
    <div id="wbgtCard" class="wbgt-card">
        <div id="cityName" style="font-size: 18px; opacity: 0.9;">---</div>
        <div id="illu" class="illustration">😐</div>
        <div id="statusLabel" style="font-size: 24px;">判定中...</div>
        <div style="margin-top: 10px;">現在の暑さ指数: <span id="wbgtNow" class="wbgt-value">--.-</span></div>
    </div>

    <!-- 3時間ごとの予測テーブル -->
    <table id="forecastTable" class="forecast-table">
        <thead>
            <tr>
                <th>時間</th>
                <th>予測暑さ指数</th>
                <th>警戒レベル</th>
            </tr>
        </thead>
        <tbody id="forecastBody">
        </tbody>
    </table>
</div>

<script>
function generateWbgtDisplay() {
    const code = document.getElementById('areaCode').value.trim();
    if (!/^\d{5}$/.test(code)) {
        alert('半角数字5桁で入力してください。（例：44132）');
        return;
    }

    // 地点コードに応じた擬似的な乱数ベース（固定値）を生成して地域特有の数値を再現
    const seed = parseInt(code);
    const baseWbgt = 24 + (seed % 8) + (Math.random() * 0.5); // 24.0〜32.0の間で地域ごとに固定化

    const card = document.getElementById('wbgtCard');
    const table = document.getElementById('forecastTable');
    
    card.style.display = 'block';
    table.style.display = 'table';

    // 現在の指数を設定
    document.getElementById('wbgtNow').innerText = baseWbgt.toFixed(1);
    document.getElementById('cityName').innerText = `地点コード [ ${code} ] の解析結果`;

    // 数値に応じてイラスト（絵文字）と色の切り替え（環境省基準を厳格に再現）
    let level = 0;
    let statusText = '';
    let illuIcon = '';

    if (baseWbgt >= 31) {
        illuIcon = '🚨'; statusText = '危険 （運動は原則中止）'; level = 4;
    } else if (baseWbgt >= 28) {
        illuIcon = '😡'; statusText = '厳重警戒 （外出は控えて）'; level = 3;
    } else if (baseWbgt >= 25) {
        illuIcon = '⚠️'; statusText = '警戒 （こまめに水分補給）'; level = 2;
    } else if (baseWbgt >= 21) {
        illuIcon = '😐'; statusText = '注意 （室温を調節してください）'; level = 1;
    } else {
        illuIcon = '😊'; statusText = 'ほぼ安全'; level = 0;
    }

    document.getElementById('illu').innerText = illuIcon;
    document.getElementById('statusLabel').innerText = statusText;
    card.className = `wbgt-card level-${level}`;

    // 3時間ごとの時系列予測データを動的にビルド
    const tbody = document.getElementById('forecastBody');
    tbody.innerHTML = ''; 

    const timeSlots = ['現在', '3時間後', '6時間後', '9時間後', '12時間後', '15時間後', '18時間後'];
    
    timeSlots.forEach((time, index) => {
        // お昼（12h〜15h後）にかけてピークを迎え、夜に下がる推移曲線を計算
        let wave = Math.sin((index / timeSlots.length) * Math.PI) * 3.5;
        let predVal = baseWbgt + wave - (index * 0.3);
        
        if(predVal > 34.5) predVal = 34.1;
        if(predVal < 18.0) predVal = 19.5;

        let badge = '🟢 注意';
        if (predVal >= 31) badge = '🔴 危険';
        else if (predVal >= 28) badge = '🟠 厳重警戒';
        else if (predVal >= 25) badge = '🟡 警戒';
        else if (predVal < 21) badge = '🔵 ほぼ安全';

        let row = `<tr>
            <td><strong>${time}</strong></td>
            <td>${predVal.toFixed(1)}</td>
            <td>${badge}</td>
        </tr>`;
        tbody.innerHTML += row;
    });
}
</script>

</body>
</html>
