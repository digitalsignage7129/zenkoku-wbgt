<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場用 WBGT熱中症警戒アラートサイネージ</title>
    <style>
        /* 1920x1080 に完全固定（スクロールバー非表示） */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #000; /* 画面焼き付き防止 */
            color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            overflow: hidden;
        }

        .signage-container {
            display: flex;
            width: 1920px;
            height: 1080px;
        }

        /* 左側：現在のリアルタイムステータス */
        .main-card {
            width: 1050px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.5s ease;
        }

        .location-title {
            font-size: 50px;
            font-weight: 900;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 50px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* イラスト窓（ここがポイント！） */
        .illustration-window {
            width: 450px;
            height: 480px;
            margin: 10px 0;
            background-color: #fff; /* イラストが引き立つ白背景 */
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden; /* 枠からはみ出た部分（他のポーズ）を非表示にする */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 4人セットの画像を裏側でズラすための設定 */
        .sprite-img {
            position: absolute;
            width: 900px;  /* 1枚の画像の幅をサイネージ用に最適化 */
            height: 960px; /* 1枚の画像の高さをサイネージ用に最適化 */
            transition: all 0.3s ease-in-out;
        }

        /* 暑さレベルに応じて、裏の画像をスライドさせて適切なポーズを窓に収める */
        .level-0 .sprite-img, .level-1 .sprite-img { left: 0px; top: 0px; }            /* 左上：通常・注意 */
        .level-2 .sprite-img { left: -450px; top: 0px; }         /* 右上：水分補給 */
        .level-3 .sprite-img { left: 0px; top: -480px; }         /* 左下：うちわ（厳重警戒） */
        .level-4 .sprite-img { left: -450px; top: -480px; }       /* 右下：ぐったり（危険） */

        .status-label {
            font-size: 76px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 4px 4px 12px rgba(0,0,0,0.7);
            margin-top: 30px;
        }

        .value-display {
            font-size: 46px;
            margin-top: 30px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 15px 40px;
            border-radius: 15px;
        }
        .wbgt-number {
            font-size: 110px;
            font-weight: 900;
        }

        /* 右側：3時間ごとの推移予測 */
        .forecast-side {
            width: 870px;
            height: 1080px;
            background-color: #141414;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px;
            box-sizing: border-box;
            border-left: 4px solid #222;
        }

        .side-title {
            font-size: 46px;
            font-weight: 900;
            border-left: 15px solid #ffeb3b;
            padding-left: 25px;
            margin-bottom: 60px;
            color: #fff;
            letter-spacing: 2px;
        }

        .forecast-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            margin-bottom: 25px;
            padding: 25px 40px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .time-label {
            font-size: 38px;
            font-weight: bold;
            color: #ddd;
        }

        .val-label {
            font-size: 46px;
            font-weight: 900;
        }

        .badge-label {
            font-size: 36px;
            font-weight: 900;
            padding: 12px 0;
            border-radius: 12px;
            color: #fff;
            width: 240px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 現場用高コントラスト配色 */
        .bg-level-4 { background-color: #b71c1c; } /* 危険：深紅 */
        .bg-level-3 { background-color: #e65100; } /* 厳重警戒：オレンジ */
        .bg-level-2 { background-color: #fbc02d; color: #000; } /* 警戒：黄 */
        .bg-level-1 { background-color: #1b5e20; } /* 注意：緑 */
        .bg-level-0 { background-color: #0d47a1; } /* ほぼ安全：紺 */

        .badge-4 { background-color: #d32f2f; }
        .badge-3 { background-color: #f57c00; }
        .badge-2 { background-color: #fbc02d; color: #000; }
        .badge-1 { background-color: #2e7d32; }
        .badge-0 { background-color: #1565c0; }

        /* エラー画面 */
        .error-screen {
            position: fixed; top:0; left:0; width:1920px; height:1080px;
            background:#111; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<div id="errorOverlay" class="error-screen" style="display: none;">
    <h1 style="font-size: 54px; color: #ff3b30;">⚠️ 地点コードが未指定、または不正です</h1>
    <p style="font-size: 36px; color: #ccc; margin-top: 30px; text-align: center; line-height: 1.8;">
        URLの末尾に <code style="color: #fff; background: #333; padding: 5px 20px; border-radius: 10px;">?code=5桁の数字</code> を付与してください。<br>
        例: https://〜/?code=62124 (大阪市住之江区周辺)
    </p>
</div>

<div class="signage-container">
    <div id="mainCard" class="main-card bg-level-0">
        <div id="cityNameDisplay" class="location-title">計測地域：設定中...</div>
        
        <div id="windowBox" class="illustration-window level-0">
            <img src="girls-set.png" class="sprite-img" alt="熱中症対策イラスト">
        </div>

        <div id="statusText" class="status-label">安全確認中</div>
        <div class="value-display">
            現在の暑さ指数(WBGT)：<span id="nowVal" class="wbgt-number">--.-</span> <span style="font-size: 40px;">℃</span>
        </div>
    </div>

    <div class="forecast-side">
        <div class="side-title">今後の暑さ指数予測（3時間ごと）</div>
        <div id="forecastContainer">
            </div>
    </div>
</div>

<script>
// 地域マスター（環境省コード対応）
const areaMap = {
    "62124": "大阪府 大阪市住之江区周辺",
    "62117": "大阪府 大阪市中央区（大阪）",
    "44132": "東京都 千代田区（東京）",
    "51106": "愛知県 名古屋市",
    "36136": "石川県 金沢市",
    "43106": "神奈川県 横浜市",
    "82117": "福岡県 福岡市",
    "14154": "北海道 札幌市"
};

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (!code || !/^\d{5}$/.test(code.trim())) {
        document.getElementById('errorOverlay').style.display = 'flex';
        return;
    }

    const cleanCode = code.trim();
    const regionName = areaMap[cleanCode] || `地点コード: ${cleanCode}`;
    document.getElementById('cityNameDisplay').innerText = `測定地域：${regionName}`;

    // 数値シミュレーション
    const seed = parseInt(cleanCode);
    const baseWbgt = 23.5 + (seed % 9) + (Math.random() * 0.4); 

    let level = 0;
    let statusStr = '';

    // WBGT数値によるレベル・テキスト・イラスト切り替え判定
    if (baseWbgt >= 31) {
        statusStr = '危 険（作業は原則中止）'; level = 4;
    } else if (baseWbgt >= 28) {
        statusStr = '厳重警戒（厳重な熱中症対策を）'; level = 3;
    } else if (baseWbgt >= 25) {
        statusStr = '警 戒（定期的な水分・塩分補給）'; level = 2;
    } else if (baseWbgt >= 21) {
        statusStr = '注 意（こまめな給水を推奨）'; level = 1;
    } else {
        statusStr = 'ほぼ安全（通常通り作業可能）'; level = 0;
    }

    document.getElementById('nowVal').innerText = baseWbgt.toFixed(1);
    document.getElementById('statusText').innerText = statusStr;
    
    // 全体の背景色を変更
    document.getElementById('mainCard').className = `main-card bg-level-${level}`;
    // イラスト窓のクラスを書き換えて、中の画像をピタッと動かす
    document.getElementById('windowBox').className = `illustration-window level-${level}`;

    // 右側予測エリア
    const container = document.getElementById('forecastContainer');
    container.innerHTML = '';

    const timeSteps = ['3時間後予測', '6時間後予測', '9時間後予測', '12時間後予測'];
    timeSteps.forEach((time, index) => {
        let wave = Math.sin(((index + 1) / timeSteps.length) * Math.PI) * 3.2;
        let predVal = baseWbgt + wave - (index * 0.5);
        
        if(predVal > 34.8) predVal = 34.3;
        if(predVal < 18.0) predVal = 19.2;

        let badgeText = '注意';
        let lv = 1;
        if (predVal >= 31) { badgeText = '🚨 危険'; lv = 4; }
        else if (predVal >= 28) { badgeText = '⚠️ 厳重警戒'; lv = 3; }
        else if (predVal >= 25) { badgeText = '🥤 警戒'; lv = 2; }
        else if (predVal < 21) { badgeText = '✅ 安全'; lv = 0; }

        let rowHtml = `
            <div class="forecast-row">
                <div class="time-label">${time}</div>
                <div class="val-label" style="color: ${lv === 2 ? '#fbc02d' : '#fff'}">${predVal.toFixed(1)} ℃</div>
                <div class="badge-label badge-${lv}">${badgeText}</div>
            </div>
        `;
        container.innerHTML += rowHtml;
    });
};
</script>

</body
</html>
