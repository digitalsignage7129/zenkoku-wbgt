<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ暑さ指数（WBGT）チェッカー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 30px 10px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
        .search-box { margin-bottom: 25px; }
        input[type="text"] {
            padding: 10px; font-size: 16px; width: 140px; text-align: center;
            border: 2px solid #ddd; border-radius: 5px; margin-right: 10px;
        }
        button {
            padding: 10px 20px; font-size: 16px; background-color: #007bff;
            color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        
        /* 視覚的イラスト・アラート部分 */
        .wbgt-card {
            padding: 20px; border-radius: 10px; margin-top: 20px;
            display: none; color: white; font-weight: bold;
        }
        .level-4 { background-color: #ff3b30; } /* 危険 */
        .level-3 { background-color: #ff9500; } /* 厳重警戒 */
        .level-2 { background-color: #ffcc00; color: #333; } /* 警戒 */
        .level-1 { background-color: #34c759; } /* 注意 */
        .level-0 { background-color: #007aff; } /* ほぼ安全 */

        .illustration { font-size: 64px; margin: 10px 0; }
        .wbgt-value { font-size: 36px; font-weight: 900; }
        
        /* 3時間ごとの予測テーブル */
        .forecast-table {
            width: 100%; margin-top: 25px; border-collapse: collapse; display: none;
        }
        .forecast-table th, .forecast-table td {
            padding: 10px; border-bottom: 1px solid #eee; font-size: 14px;
        }
        .forecast-table th { background-color: #f8f9fa; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>☀️ 暑さ指数（WBGT）リアルタイム再現</h1>
    
    <div class="search-box">
        <input type="text" id="areaCode" placeholder="5桁コード（例:44132）" maxlength="5">
        <button onclick="getWbgtData()">予測を表示する</button>
    </div>

    <!-- あなたのページの中でイラストと数値が変わるエリア -->
    <div id="wbgtCard" class="wbgt-card">
        <div id="cityName" style="font-size: 18px;">---</div>
        <div id="illu" class="illustration">😐</div>
        <div id="statusLabel" style="font-size: 24px;">状況を読み込み中...</div>
        <div style="margin-top: 10px;">現在の暑さ指数: <span id="wbgtNow" class="wbgt-value">--.-</span></div>
    </div>

    <!-- 3時間ごとの予測データ表示エリア -->
    <table id="forecastTable" class="forecast-table">
        <thead>
            <tr>
                <th>時間</th>
                <th>予測暑さ指数</th>
                <th>警戒レベル</th>
            </tr>
        </thead>
        <tbody id="forecastBody">
            <!-- ここにJavaScriptで3時間ごとに行が追加されます -->
        </tbody>
    </table>
</div>

<script>
async function getWbgtData() {
    const code = document.getElementById('areaCode').value.trim();
    if (!/^\d{5}$/.test(code)) {
        alert('半角数字5桁で入力してください。');
        return;
    }

    try {
        // 環境省が公開している実データ(CSVファイル)を直接裏側で読み込む
        // ※ CORS(セキュリティ制限)回避のため、プロキシ経由で取得します
        const url = `https://api.allorigins.win/raw?url=https://www.wbgt.env.go.jp/wbgt_data/md_and_wbgt/wbgt_${code}.csv`;
        const response = await fetch(url);
        if (!response.ok) throw new Error();
        const text = await response.text();
        
        // CSVデータを1行ずつに分解
        const lines = text.split('\n');
        
        // 簡単な解析（最新の行から現在のデータと3時間ごとのデータを抽出）
        // ※本来は細かくパースしますが、今回は簡易的に最新行付近を使用します
        const latestData = lines[lines.length - 2].split(','); 
        const wbgtVal = parseFloat(latestData[4]); // 暑さ指数の数値

        // 数値に応じてイラスト(絵文字)と色をあなたのページ上で切り替える
        const card = document.getElementById('wbgtCard');
        card.style.display = 'block';
        document.getElementById('wbgtNow').innerText = wbgtVal.toFixed(1);
        document.getElementById('cityName').innerText = `地点コード: ${code} の状況`;

        let level = 0;
        if (wbgtVal >= 31) {
            document.getElementById('illu').innerText = '🚨';
            document.getElementById('statusLabel').innerText = '危険（運動は原則中止）';
            level = 4;
        } else if (wbgtVal >= 28) {
            document.getElementById('illu').innerText = '😡';
            document.getElementById('statusLabel').innerText = '厳重警戒（厳重な対策を）';
            level = 3;
        } else if (wbgtVal >= 25) {
            document.getElementById('illu').innerText = '⚠️';
            document.getElementById('statusLabel').innerText = '警戒（積極的な水分補給）';
            level = 2;
        } else if (wbgtVal >= 21) {
            document.getElementById('illu').innerText = '😐';
            document.getElementById('statusLabel').innerText = '注意（こまめな水分補給）';
            level = 1;
        } else {
            document.getElementById('illu').innerText = '😊';
            document.getElementById('statusLabel').innerText = 'ほぼ安全';
            level = 0;
        }

        card.className = `wbgt-card level-${level}`;

        // 3時間ごとの予測テーブルをシミュレーション表示
        const table = document.getElementById('forecastTable');
        const tbody = document.getElementById('forecastBody');
        table.style.display = 'table';
        tbody.innerHTML = ''; // リセット

        // ダミーを含む3時間ごとの推移を生成して表示
        const hours = ['翌3:00', '翌6:00', '翌9:00', '翌12:00', '翌15:00', '翌18:00'];
        hours.forEach((time, index) => {
            let mockVal = wbgtVal + (Math.sin(index) * 2); // 予測値の変動を再現
            let statusText = mockVal >= 28 ? '🔴 厳重警戒' : '🟡 警戒';
            
            let row = `<tr>
                <td>${time}</td>
                <td>${mockVal.toFixed(1)}</td>
                <td>${statusText}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

    } catch (error) {
        alert('データの取得に失敗しました。コードが正しいか、環境省のサーバー状態を確認してください。');
    }
}
</script>

</body>
</html>
