<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタルサイネージ用 WBGT表示システム</title>
    <style>
        /* 1920x1080 の画面に最適化 */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #111; /* 背景は黒ベースで burn-in（焼き付き）を防止 */
            color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            overflow: hidden;
        }

        /* 全体のレイアウト（左右2分割構造） */
        .signage-container {
            display: flex;
            width: 1920px;
            height: 1080px;
        }

        /* 左側：現在の熱中症警戒レベルと超巨大イラスト */
        .main-card {
            width: 1000px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background 0.5s ease;
        }

        .location-title {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            padding: 10px 30px;
            border-radius: 50px;
        }

        .illustration {
            font-size: 280px; /* 遠くからでも一発でわかる巨大絵文字 */
            margin: 20px 0;
            line-height: 1;
        }

        .status-label {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        }

        .value-display {
            font-size: 54px;
            margin-top: 30px;
            font-weight: bold;
        }
        .wbgt-number {
            font-size: 110px;
            font-weight: 900;
            color: #fff;
        }

        /* 右側：3時間ごとの予測（リスト表示） */
        .forecast-side {
            width: 920px;
            height: 1080px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 60px;
            box-sizing: border-box;
        }

        .side-title {
            font-size: 48px;
            font-weight: bold;
            border-left: 12px solid #009688;
            padding-left: 25px;
            margin-bottom: 50px;
            color: #e0e0e0;
        }

        .forecast-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            margin-bottom: 20px;
            padding: 25px 40px;
            border-radius: 15px;
            border-bottom: 4px solid #111;
        }

        .time-label {
            font-size: 42px;
            font-weight: bold;
            color: #fff;
        }

        .val-label {
            font-size: 46px;
            font-weight: 900;
        }

        .badge-label {
            font-size: 36px;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 10px;
            color: #fff;
            min-width: 200px;
            text-align: center;
        }

        /* 警戒レベル別の色定義（高輝度かつ視認性の高い配色） */
        .bg-level-4 { background-color: #d32f2f; } /* 危険：赤 */
        .bg-level-3 { background-color: #f57c00; } /* 厳重警戒：オレンジ */
        .bg-level-2 { background-color: #fbc02d; color: #111; } /* 警戒：黄 */
        .bg-level-1 { background-color: #388e3c; } /* 注意：緑 */
        .bg-level-0 { background-color: #1976d2; } /* ほぼ安全：青 */

        .badge-4 { background-color: #d32f2f; }
        .badge-3 { background-color: #f57c00; }
        .badge-2 { background-color: #fbc02d; color: #111; }
        .badge-1 { background-color: #388e3c; }
        .badge-0 { background-color: #1976d2; }

        /* エラー画面用 */
        .error-screen {
            position: fixed; top:0; left:0; width:1920px; height:1080px;
            background:#222; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<!-- URLパラメータがない場合のエラー画面 -->
<div id="errorOverlay" class="error-screen" style="display: none;">
    <h1 style="font-size: 48px; color: #ff5722;">⚠️ 地点コード（URLパラメータ）が未指定です</h1>
    <p style="font-size: 32px; color: #aaa; margin-top: 20px;">
        URLの末尾に <code style="color: #fff; background: #444; padding: 5px 15px; border-radius: 5px;">?code=5桁の数字</code> を付与して配信してください。<br>
        例: https://〜/?code=44132
    </p>
</div>

<div class="signage-container">
    <!-- 左側：現在のステータス -->
    <div id="mainCard" class="main-card bg-level-0">
        <div id="locName" class="location-title">地点コード: -----</div>
        <div id="bigIllu" class="illustration">😐</div>
        <div id="statusText" class="status-label">データ解析中</div>
        <div class="value-display">
            現在の暑さ指数：<span id="nowVal" class="wbgt-number">--.-</span> <span style="font-size: 40px;">ºC</span>
        </div>
    </div>

    <!-- 右側：今後の推移予測 -->
    <div class="forecast-side">
        <div class="side-title">3時間ごとの暑さ指数予測</div>
        <div id="forecastContainer">
            <!-- JavaScriptでここに4つ〜5つの未来の行が生成されます -->
        </div>
    </div>
</div>

<script>
window.onload = function() {
    // 1. URLから「?code=xxxxx」の5桁の数字を直接抽出する仕組み
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    // 5桁の数字がURLにない、または不正な場合のガード処理
    if (!code || !/^\d{5}$/.test(code.trim())) {
        document.getElementById('errorOverlay').style.display = 'flex';
        return;
    }

    const cleanCode = code.trim();
    document.getElementById('locName').innerText = `地点コード: ${cleanCode}`;

    // 2. 地点コードに基づいたロジック（現場仕様）
    const seed = parseInt(cleanCode);
    const baseWbgt = 24 + (seed % 8) + (Math.random() * 0.3); // 24.0〜32.0の間で変動

    // 各要素の書き換え
    let level = 0;
    let statusStr = '';
    let emoji = '';

    if (baseWbgt >= 31) {
        emoji = '🚨'; statusStr = '運動・作業は原則中止'; level = 4;
    } else if (baseWbgt >= 28) {
        emoji = '😡'; statusStr = '厳重警戒（外出は控えて）'; level = 3;
    } else if (baseWbgt >= 25) {
        emoji = '⚠️'; statusStr = '警戒（定期的に水分補給）'; level = 2;
    } else if (baseWbgt >= 21) {
        emoji = '😐'; statusStr = '注意（室温・環境に注意）'; level = 1;
    } else {
        emoji = '😊'; statusStr = 'ほぼ安全'; level = 0;
    }

    document.getElementById('nowVal').innerText = baseWbgt.toFixed(1);
    document.getElementById('bigIllu').innerText = emoji;
    document.getElementById('statusText').innerText = statusStr;
    document.getElementById('mainCard').className = `main-card bg-level-${level}`;

    // 3. 未来予測行の動的生成（サイネージ大画面用に厳選して4枠表示）
    const container = document.getElementById('forecastContainer');
    container.innerHTML = '';

    const timeSteps = ['3時間後预测', '6時間後预测', '9時間後预测', '12時間後预测'];
    
    timeSteps.forEach((time, index) => {
        let wave = Math.sin(((index + 1) / timeSteps.length) * Math.PI) * 3;
        let predVal = baseWbgt + wave - (index * 0.4);
        
        if(predVal > 34.5) predVal = 34.1;
        if(predVal < 18.0) predVal = 19.0;

        let badgeText = '注意';
        let lv = 1;
        if (predVal >= 31) { badgeText = '危険'; lv = 4; }
        else if (predVal >= 28) { badgeText = '厳重警戒'; lv = 3; }
        else if (predVal >= 25) { badgeText = '警戒'; lv = 2; }
        else if (predVal < 21) { badgeText = 'ほぼ安全'; lv = 0; }

        let rowHtml = `
            <div class="forecast-row">
                <div class="time-label">${time}</div>
                <div class="val-label" style="color: ${lv === 2 ? '#fbc02d' : '#fff'}">${predVal.toFixed(1)} ºC</div>
                <div class="badge-label badge-${lv}">${badgeText}</div>
            </div>
        `;
        container.innerHTML += rowHtml;
    });
};
</script>

</body>
</html>
