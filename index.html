<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場用 WBGT熱中症警戒アラートサイネージ</title>
    <style>
        /* 1920x1080 フルHD完全固定（スクロールバー排除） */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 画面全体のレイアウト */
        .signage-container {
            display: flex;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            background: radial-gradient(circle at 80% 20%, #1a2332 0%, #0d1117 100%);
        }

        /* LEFT AREA: 現在のステータス表示（全体の約60%） */
        .left-panel {
            width: 1120px;
            height: 1080px;
            padding: 60px 80px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .location-badge {
            font-size: 38px;
            font-weight: 700;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .location-badge::before {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            background-color: #58a6ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #58a6ff;
        }

        /* プロ仕様：超巨大WBGT数値表示 */
        .wbgt-hero-box {
            display: flex;
            align-items: baseline;
            margin-top: -20px;
        }
        .wbgt-label {
            font-size: 40px;
            font-weight: 800;
            color: #ffffff;
            margin-right: 30px;
            letter-spacing: 2px;
        }
        .wbgt-value {
            font-size: 260px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -4px;
            background: linear-gradient(to bottom, #ffffff 60%, #e1e4e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            drop-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .wbgt-unit {
            font-size: 80px;
            font-weight: 800;
            color: #ffffff;
            margin-left: 15px;
        }

        /* 現在の警戒レベル巨大帯 */
        .status-alert-bar {
            width: 960px;
            padding: 35px 50px;
            border-radius: 30px;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 30px;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 3時間ごと予測（左下配置） */
        .forecast-section {
            width: 960px;
            margin-top: 30px;
        }
        .section-title {
            font-size: 32px;
            font-weight: 800;
            color: #c9d1d9;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .forecast-grid {
            display: flex;
            gap: 20px;
        }
        .forecast-card {
            flex: 1;
            background: rgba(22, 27, 34, 0.7);
            border: 2px solid rgba(48, 54, 61, 0.8);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
        }
        .fc-time {
            font-size: 26px;
            color: #8b949e;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .fc-temp {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 15px;
            font-variant-numeric: tabular-nums;
        }
        .fc-badge {
            font-size: 24px;
            font-weight: 800;
            padding: 8px 0;
            border-radius: 12px;
            width: 100%;
            display: inline-block;
        }


        /* RIGHT AREA: イラスト＆シグナル表示（全体の約40%） */
        .right-panel {
            width: 800px;
            height: 1080px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
            border-left: 2px solid rgba(255,255,255,0.05);
        }

        /* 引用サイトを参考にした大型円形イラストフレーム */
        .illustration-circle-frame {
            width: 620px;
            height: 620px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            border: 12px solid rgba(255,255,255,0.1);
        }

        /* スプライト画像の配置調整（フレームサイズ 620px に合わせて最適化） */
        .sprite-img {
            position: absolute;
            width: 1240px;   /* 620px * 2 */
            height: 1320px;  /* 660px * 2 */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 4ポーズの正確な座標指定（1マスの中心を綺麗にくり抜き） */
        .level-0 .sprite-img, .level-1 .sprite-img { left: -30px; top: -10px; }       /* 左上: 通常 */
        .level-2 .sprite-img { left: -650px; top: -10px; }     /* 右上: 水分補給 */
        .level-3 .sprite-img { left: -20px; top: -670px; }     /* 左下: うちわ */
        .level-4 .sprite-img { left: -630px; top: -670px; }     /* 右下: ぐったり */


        /* 👑 プロの配色マスター（シグラボ風 高コントラスト＆スタイリッシュ） */
        .theme-4 { background: linear-gradient(135deg, #b71c1c 0%, #7f0000 100%); color: #fff; } /* 危険 */
        .theme-3 { background: linear-gradient(135deg, #f57c00 0%, #e65100 100%); color: #fff; } /* 厳重警戒 */
        .theme-2 { background: linear-gradient(135deg, #fbc02d 0%, #f9a825 100%); color: #000; } /* 警戒 */
        .theme-1 { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); color: #fff; } /* 注意 */
        .theme-0 { background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%); color: #fff; } /* 安全 */

        /* エラー画面 */
        .error-screen {
            position: fixed; top:0; left:0; width:1920px; height:1080px;
            background:#0d1117; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<div id="errorOverlay" class="error-screen" style="display: none;">
    <h1 style="font-size: 54px; color: #ff7b72;">⚠️ 地点コードが未指定、または不正です</h1>
    <p style="font-size: 36px; color: #8b949e; margin-top: 30px; text-align: center; line-height: 1.8;">
        URLの末尾に <code style="color: #fff; background: #21262d; padding: 8px 20px; border-radius: 10px; border: 1px solid #30363d;">?code=5桁の数字</code> を付与してください。<br>
        例: https://〜/?code=62124 (大阪市住之江区周辺)
    </p>
</div>

<div class="signage-container">
    <div class="left-panel">
        <div class="header-info">
            <div id="cityNameDisplay" class="location-badge">計測地域：設定中...</div>
            <div class="wbgt-hero-box">
                <div class="wbgt-label">現在の暑さ指数</div>
                <div id="nowVal" class="wbgt-value">--.-</div>
                <div class="wbgt-unit">℃</div>
            </div>
        </div>

        <div id="alertBar" class="status-alert-bar theme-0">
            <span id="alertIcon">ℹ️</span> <span id="statusText">データ取得中...</span>
        </div>

        <div class="forecast-section">
            <div class="section-title">今後の暑さ指数予測（3時間ごと）</div>
            <div id="forecastGrid" class="forecast-grid">
                </div>
        </div>
    </div>

    <div class="right-panel">
        <div id="windowBox" class="illustration-circle-frame level-0">
            <img src="girls-set.png" class="sprite-img" alt="熱中症対策ポーズ連動イラスト">
        </div>
    </div>
</div>

<script>
// 地点マスター
const areaMap = {
    "62124": "大阪府 大阪市住之江区",
    "62117": "大阪府 大阪市中央区",
    "44132": "東京都 千代田区",
    "51106": "愛知県 名古屋市",
    "36136": "石川県 金沢市",
    "43106": "神奈川県 横浜市",
    "82117": "福岡県 福岡市",
    "14154": "北海道 札幌市"
};

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (!code || !/^\d{5}$/.test(code.trim())) {
        document.getElementById('errorOverlay').style.display = 'flex';
        return;
    }

    const cleanCode = code.trim();
    const regionName = areaMap[cleanCode] || `地点コード: ${cleanCode}`;
    document.getElementById('cityNameDisplay').innerText = regionName;

    // 数値シミュレーション
    const seed = parseInt(cleanCode);
    const baseWbgt = 23.0 + (seed % 9) + (Math.random() * 0.5); 

    let level = 0;
    let statusStr = '';
    let iconStr = '';

    // レベル判定とデザインテーマの割り当て
    if (baseWbgt >= 31) {
        statusStr = '危険（作業は原則中止）'; level = 4; iconStr = '🚨';
    } else if (baseWbgt >= 28) {
        statusStr = '厳重警戒（外出は控えて）'; level = 3; iconStr = '⚠️';
    } else if (baseWbgt >= 25) {
        statusStr = '警戒（積極的に水分補給）'; level = 2; iconStr = '🥤';
    } else if (baseWbgt >= 21) {
        statusStr = '注意（こまめな給水を）'; level = 1; iconStr = '💧';
    } else {
        statusStr = 'ほぼ安全（通常通り活動可）'; level = 0; iconStr = '✅';
    }

    // 画面への反映
    document.getElementById('nowVal').innerText = baseWbgt.toFixed(1);
    document.getElementById('statusText').innerText = statusStr;
    document.getElementById('alertIcon').innerText = iconStr;
    
    // 現在のレベルにクラスを書き換えて、色とイラストポーズを完全シンクロ
    document.getElementById('alertBar').className = `status-alert-bar theme-${level}`;
    document.getElementById('windowBox').className = `illustration-circle-frame level-${level}`;

    // 予測カードの動的生成
    const grid = document.getElementById('forecastGrid');
    grid.innerHTML = '';

    const timeSteps = ['3時間後', '6時間後', '9時間後', '12時間後'];
    timeSteps.forEach((time, index) => {
        let wave = Math.sin(((index + 1) / timeSteps.length) * Math.PI) * 3.0;
        let predVal = baseWbgt + wave - (index * 0.4);
        
        if(predVal > 34.8) predVal = 34.2;
        if(predVal < 18.0) predVal = 19.5;

        let badgeText = '注意';
        let lv = 1;
        if (predVal >= 31) { badgeText = '危険'; lv = 4; }
        else if (predVal >= 28) { badgeText = '厳重警戒'; lv = 3; }
        else if (predVal >= 25) { badgeText = '警戒'; lv = 2; }
        else if (predVal < 21) { badgeText = '安全'; lv = 0; }

        let cardHtml = `
            <div class="forecast-card">
                <div class="fc-time">${time}</div>
                <div class="fc-temp">${predVal.toFixed(1)}<span style="font-size: 24px; font-weight:700;">℃</span></div>
                <div class="fc-badge theme-${lv}">${badgeText}</div>
            </div>
        `;
        grid.innerHTML += cardHtml;
    });
};
</script>

</body>
</html>
